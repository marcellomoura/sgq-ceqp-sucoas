<style>
  /* ==========================================
     DESIGN SYSTEM — SGQ · CEQP / SUCOAS
     Light Mode Premium — tokens unificados
     (cor, tipografia, raio, sombra, espaçamento, motion)
  ========================================== */
  :root {
    /* ---- Marca / Ação (índigo premium) ---- */
    --primary: #6c5dd3;
    --primary-hover: #5a4bc4;
    --primary-active: #4f3fb5;
    --primary-light: #efedfc;
    --primary-lighter: #f7f6fd;
    --primary-ring: rgba(108,93,211,0.18);
    --primary-text: #5a4bc4;

    /* ---- Superfícies ---- */
    --bg-app: #f7f7fb;
    --bg-card: #ffffff;
    --bg-panel: #fafafc;
    --bg-subtle: #f2f2f7;
    --bg-hover: #f4f4fa;
    --kanban-list-bg: #e8e9f0;

    /* ---- Sidebar (grafite premium) ---- */
    --sidebar-bg: #24252f;
    --sidebar-bg-alt: #2b2c38;
    --sidebar-hover: rgba(255,255,255,0.07);
    --sidebar-active-bg: rgba(108,93,211,0.30);
    --sidebar-text: #a7a8ba;
    --sidebar-text-hover: #e6e6f0;
    --sidebar-text-active: #ffffff;
    --sidebar-border: rgba(255,255,255,0.09);
    --sidebar-icon: #83849a;
    --sidebar-group-text: #74758a;

    /* ---- Texto ---- */
    --text-main: #17181f;
    --text-secondary: #5c5e6d;
    --text-muted: #8b8d9c;
    --text-inverse: #ffffff;

    /* ---- Bordas ---- */
    --border-color: #e7e7f0;
    --border-subtle: #eeeef5;
    --border-strong: #d4d4e2;

    /* ---- Status ---- */
    --success: #17a673;
    --success-bg: #e6f7f0;
    --success-border: #a9e4cb;
    --success-text: #0f7a56;
    --warning: #dc8a00;
    --warning-bg: #fdf1de;
    --warning-border: #f4d194;
    --warning-text: #a8660a;
    --danger: #e0455e;
    --danger-bg: #fceef0;
    --danger-border: #f3b9c5;
    --danger-text: #b1263d;
    --info: #3f8cff;
    --info-bg: #eaf3ff;
    --info-border: #b8d7ff;
    --info-text: #2266cc;
    --purple: #6c5dd3;
    --purple-bg: #efedfc;

    /* aliases legados usados em algumas regras internas */
    --tag-alta: var(--danger);
    --tag-media: var(--warning);
    --tag-baixa: var(--success);
    --green: var(--success);
    --red: var(--danger);
    --yellow: var(--warning);

    /* ---- Raio ---- */
    --radius-xs: 8px;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;
    --radius-xl: 22px;
    --radius-pill: 999px;

    /* ---- Sombra ---- */
    --shadow-xs: 0 1px 2px rgba(23,24,31,0.05);
    --shadow-sm: 0 2px 10px rgba(23,24,31,0.05);
    --shadow-md: 0 10px 28px rgba(23,24,31,0.09);
    --shadow-lg: 0 24px 48px rgba(23,24,31,0.16);

    /* ---- Espaçamento (múltiplos de 4) ---- */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-7: 28px; --space-8: 32px;

    /* ---- Tipografia ---- */
    --fs-2xs: 10px; --fs-xs: 11px; --fs-sm: 12px; --fs-base: 13px;
    --fs-md: 14px; --fs-lg: 16px; --fs-xl: 18px; --fs-2xl: 24px;

    /* ---- Motion ---- */
    --ease: cubic-bezier(0.4,0,0.2,1);
    --transition-fast: 150ms var(--ease);
    --transition-base: 200ms var(--ease);
    --transition-slow: 300ms var(--ease);
  }

  /* ===== RESET E BASE ===== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  * { scrollbar-width: thin; scrollbar-color: #d4d4e2 transparent; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d4d4e2; border-radius: var(--radius-pill); border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #b9b9cc; background-clip: content-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--bg-app);
    color: var(--text-main);
    height: 100vh;
    overflow: hidden;
    font-size: var(--fs-md);
    line-height: 1.55;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ===== HEADER ÚNICO DO SISTEMA ===== */
  .top-header {
    flex-shrink: 0;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-subtle);
    padding: 14px 28px 12px;
    box-sizing: border-box;
  }
  .top-header-title {
    font-size: var(--fs-xl);
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: 0.2px;
    line-height: 1.2;
  }
  .top-header-sub {
    font-size: var(--fs-xs);
    color: var(--text-muted);
    margin-top: 3px;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  /* ===== LAYOUT PRINCIPAL ===== */
  .app-layout { display: flex; width: 100vw; height: 100vh; overflow: hidden; }
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }

  /* ===== PAGE HEADER (título da aba + filtros/ações) ===== */
  .page-header {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    flex-wrap: nowrap;
    gap: 14px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-card);
    padding: 16px 28px;
  }
  .page-tab-title {
    font-size: var(--fs-lg);
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: -0.1px;
  }
  .hdr-tab-controls {
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    flex-shrink: 0;
  }
  .hdr-tab-controls.active { display: flex; }
  .hdr-tab-controls label {
    font-size: var(--fs-xs); font-weight: 600; color: var(--text-muted);
    white-space: nowrap; line-height: 1; flex-shrink: 0;
  }
  .hdr-select {
    height: 32px;
    width: 170px;
    padding: 0 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: var(--fs-xs);
    background: var(--bg-panel);
    color: var(--text-main);
    font-family: inherit;
    outline: none;
    cursor: pointer;
    line-height: 1.3;
    flex-shrink: 0;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .hdr-input {
    height: 32px;
    width: 170px;
    padding: 0 10px;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    font-size: var(--fs-xs);
    background: var(--bg-panel);
    color: var(--text-main);
    font-family: inherit;
    outline: none;
    cursor: text;
    line-height: 1.3;
    flex-shrink: 0;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .hdr-input::placeholder { font-size: var(--fs-xs); color: var(--text-muted); }
  .hdr-select:focus, .hdr-input:focus { border-color: var(--primary); background: var(--bg-card); box-shadow: 0 0 0 3px var(--primary-ring); }
  .hdr-tab-controls .btn.primary { height: 32px; padding: 0 14px; font-size: var(--fs-sm); flex-shrink: 0; }
  .hdr-tab-controls .btn-outline { height: 32px; padding: 0 12px; font-size: var(--fs-xs); flex-shrink: 0; }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 272px;
    background-color: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    padding: 0 0 20px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 16px 18px;
    border-bottom: 1px solid var(--sidebar-border);
    margin-bottom: 8px; flex-shrink: 0;
  }
  .sidebar-brand-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--primary), #8b7ce8);
    border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff; flex-shrink: 0;
    letter-spacing: -0.3px; font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 12px rgba(108,93,211,0.35);
  }
  .sidebar-brand-text { min-width: 0; }
  .sidebar-brand-name { font-size: 13.5px; font-weight: 700; color: #f2f2f7; line-height: 1.3; font-family: 'Inter', sans-serif; letter-spacing: -0.1px; }
  .sidebar-brand-sub { font-size: var(--fs-2xs); color: var(--sidebar-icon); font-weight: 600; margin-top: 2px; white-space: nowrap; letter-spacing: 0.3px; text-transform: uppercase; }
  .sidebar-nav { display: flex; flex-direction: column; padding: 4px 12px; gap: 2px; }

  /* Grupo de menu (retrátil) */
  .nav-group-title {
    background: transparent; color: var(--sidebar-group-text); border: none;
    padding: 8px 10px; text-align: left; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: color var(--transition-fast), background var(--transition-fast);
    border-radius: var(--radius-sm); margin-top: 18px; width: 100%;
    font-family: 'Inter', sans-serif;
  }
  .sidebar-nav > .nav-group-title:first-child { margin-top: 4px; }
  .nav-group-title .nav-group-icon { width: 14px; height: 14px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; opacity: 0.55; }
  .nav-group-title .nav-group-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav-group-title .nav-group-label { flex: 1; }
  .nav-group-title:hover { color: var(--sidebar-text-hover); background: var(--sidebar-hover); }
  .nav-group-title.open { color: #b3a8ec; background: transparent; }
  .nav-group-title.open .nav-group-icon { opacity: 0.9; }
  .nav-group-title .arrow { flex-shrink: 0; opacity: 0.55; display: inline-flex; transition: transform var(--transition-base), opacity var(--transition-fast); }
  .nav-group-title .arrow svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-group-title.open .arrow { transform: rotate(180deg); opacity: 0.9; }
  .nav-group-items { display: none; padding-left: 4px; overflow: hidden; }
  .nav-group-items.open { display: block; animation: navExpand var(--transition-base); }
  @keyframes navExpand { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* Item de menu individual */
  .menu-item {
    background: none; border: none; color: var(--sidebar-text);
    font-size: 13px; font-weight: 500; padding: 9px 10px;
    border-radius: var(--radius-sm); text-align: left; cursor: pointer;
    transition: color var(--transition-fast), background var(--transition-fast);
    display: flex; align-items: center; gap: 10px;
    width: 100%; margin-top: 1px;
    font-family: 'Inter', sans-serif;
    letter-spacing: 0.05px;
  }
  .menu-item .menu-item-icon { width: 15px; height: 15px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; opacity: 0.55; }
  .menu-item .menu-item-icon svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .menu-item:hover { color: var(--sidebar-text-hover); background-color: var(--sidebar-hover); }
  .menu-item:hover .menu-item-icon { opacity: 0.85; }
  .menu-item.active { color: var(--sidebar-text-active); background-color: var(--sidebar-active-bg); font-weight: 600; }
  .menu-item.active .menu-item-icon { opacity: 1; }

  .top-bar { display: none; }

  /* ===== SEÇÕES DE VIEW ===== */
  .view-section { display: none; flex: 1; padding: 24px 28px; overflow: auto; background-color: var(--bg-app); }
  .view-section.active { display: flex; flex-direction: column; gap: 18px; }
  .compact-view.active { gap: 12px; padding: 16px 22px; }
  .compact-view .kpi-card { padding: 14px 16px; }
  .compact-view .kpi-value { font-size: 20px; }
  .compact-view .kpi-icon { width: 38px; height: 38px; font-size: 15px; }
  .compact-view .data-table th { padding: 10px 12px; font-size: var(--fs-xs); }
  .compact-view .data-table td { padding: 9px 12px; font-size: var(--fs-sm); }
  .view-section.kanban-view.active { display: flex; flex-direction: column; padding: 0; }

  /* ===== QUADRO KANBAN ===== */
  .board-canvas {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 22px; overflow-x: auto; flex: 1;
  }
  .list-wrapper {
    background-color: var(--kanban-list-bg); border-radius: var(--radius-lg); width: 292px; min-width: 292px;
    display: flex; flex-direction: column; border: 1px solid var(--border-color); flex-shrink: 0;
  }
  .list-header {
    padding: 14px 16px; font-weight: 700; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--text-main); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    letter-spacing: 0.2px;
  }
  .count { background: var(--bg-card); padding: 2px 8px; border-radius: var(--radius-pill); font-size: var(--fs-xs); color: var(--text-secondary); font-weight: 600; border: 1px solid var(--border-color); }
  .list-cards { display: flex; flex-direction: column; gap: 10px; padding: 10px; min-height: 40px; }
  .btn-add-card {
    background: transparent; border: none; padding: 11px 16px; font-size: 12.5px;
    font-weight: 500; color: var(--text-main); text-align: left; cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg); border-top: 1px solid var(--border-color); width: 100%;
  }
  .btn-add-card:hover { background: rgba(23,24,31,0.06); color: var(--primary); }

  /* Cards */
  .card {
    position: relative; background-color: var(--bg-card); border-radius: var(--radius-md);
    padding: 14px; box-shadow: var(--shadow-xs);
    cursor: grab; display: flex; flex-direction: column; gap: 7px;
    transition: box-shadow var(--transition-base), transform var(--transition-base);
    border-left: 3px solid var(--border-color);
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card.prio-Alta  { border-left-color: var(--tag-alta); }
  .card.prio-Media { border-left-color: var(--tag-media); }
  .card.prio-Baixa { border-left-color: var(--tag-baixa); }
  .card.overdue { background-color: var(--danger-bg) !important; border: 1px solid var(--danger-border) !important; border-left: 3px solid var(--danger) !important; }
  .card.overdue .card-title { color: var(--danger-text) !important; font-weight: 600; }
  .btn-edit-card { position: absolute; top: 10px; right: 10px; z-index: 1; background: none; border: none; cursor: pointer; color: var(--text-muted); opacity: 0.5; transition: opacity var(--transition-fast), color var(--transition-fast), background var(--transition-fast); padding: 3px; line-height: 0; border-radius: var(--radius-xs); }
  .btn-edit-card svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .card:hover .btn-edit-card { opacity: 1; color: var(--primary); }
  .btn-edit-card:hover { background: var(--primary-light); }
  .card-labels { padding-right: 22px; }
  .card-title { font-size: 13px; font-weight: 500; line-height: 1.4; color: var(--text-main); padding-right: 22px; }
  .card-assignee { font-size: var(--fs-xs); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .card-meta { font-size: var(--fs-2xs); color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card-meta-left, .card-meta-right { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .meta-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .meta-overdue { color: var(--danger); font-weight: 600; }
  .card-comments { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--text-muted); }
  .card-assignee svg, .meta-item svg, .card-comments svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .card-assignee svg { width: 13px; height: 13px; }
  .meta-item svg { width: 12px; height: 12px; }
  .card-comments svg { width: 13px; height: 13px; }

  /* ===== TABELAS (SGQ) ===== */
  .table-wrap { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow-x: auto; box-shadow: var(--shadow-xs); }
  .data-table { width: 100%; border-collapse: collapse; font-size: var(--fs-base); }
  .data-table th {
    background-color: var(--bg-panel); padding: 13px 16px; text-align: left;
    border-bottom: 1px solid var(--border-color); color: var(--text-secondary);
    font-weight: 600; font-size: var(--fs-sm); white-space: nowrap;
    letter-spacing: 0.1px;
  }
  .data-table td { padding: 13px 16px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; color: var(--text-main); }
  #view-ferias .data-table th, #view-ferias .data-table td { padding-left: 10px; padding-right: 10px; vertical-align: top; }
  .data-table tbody tr { break-inside: avoid; page-break-inside: avoid; transition: background var(--transition-fast); }
  .data-table tbody tr:last-child td { border-bottom: none; }
  .data-table tbody tr:hover td { background: var(--bg-hover); }
  .data-table tbody tr.row-warning td { background-color: var(--warning-bg) !important; }
  .data-table tbody tr.row-cancelled td { background-color: var(--bg-panel) !important; opacity: 0.6; }
  .group-row td { background: var(--bg-panel) !important; font-weight: 700; color: var(--text-secondary); font-size: var(--fs-sm); }

  .archived-table { table-layout: fixed; }
  .archived-table td:first-child {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cell-actions { display: flex; gap: 6px; align-items: center; }
  .msg-empty { text-align: center; color: var(--text-muted); padding: 36px; font-size: var(--fs-base); }
  .msg-error { text-align: center; color: var(--danger); padding: 36px; font-weight: 600; font-size: var(--fs-base); }

  /* ===== MEMBROS ===== */
  .member-role-badge { background: var(--primary-light); color: var(--primary-text); padding: 3px 9px; border-radius: var(--radius-xs); font-size: var(--fs-xs); font-weight: 600; }

  /* ===== KPIs ===== */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .kpi-card {
    background: var(--bg-card); padding: 18px; border-radius: var(--radius-lg);
    border: 1px solid var(--border-subtle); display: flex;
    align-items: center; gap: 14px; box-shadow: var(--shadow-xs);
    transition: transform var(--transition-base), box-shadow var(--transition-base);
    page-break-inside: avoid; break-inside: avoid;
  }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .kpi-icon { width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .icon-blue { background: var(--info-bg); } .icon-green { background: var(--success-bg); }
  .icon-red { background: var(--danger-bg); } .icon-purple { background: var(--purple-bg); }
  .icon-yellow { background: var(--warning-bg); }
  .kpi-label { font-size: var(--fs-2xs); font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .kpi-value { font-size: 23px; font-weight: 700; color: var(--text-main); margin-top: 3px; letter-spacing: -0.3px; }

  /* ===== DASHBOARD ===== */
  .dashboard-grid { display: flex; flex-direction: column; gap: 20px; }
  .dash-row { display: grid; gap: 20px; break-inside: avoid; page-break-inside: avoid; }
  .dash-row.two-cols { grid-template-columns: 1fr 1fr; }
  .dash-row.two-cols-table { grid-template-columns: 1fr 1.3fr; }
  .dash-row.one-col { grid-template-columns: 1fr; }
  .chart-box { background: var(--bg-card); padding: 20px 22px 22px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); box-shadow: var(--shadow-xs); page-break-inside: avoid; break-inside: avoid; }
  .chart-box h3 { font-size: var(--fs-xs); font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 12px; margin-bottom: 18px; }
  .chart-wrap { position: relative; height: 260px; width: 100%; display: flex; justify-content: center; align-items: center; }
  .kpi-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-blue svg { color: var(--info); } .icon-green svg { color: var(--success); } .icon-red svg { color: var(--danger); } .icon-purple svg { color: var(--purple); } .icon-yellow svg { color: var(--warning); }
  .upcoming-wrap { overflow-y: auto; max-height: 210px; }
  .upcoming-table { width: 100%; border-collapse: collapse; text-align: left; }
  .upcoming-table th { padding: 9px 8px; font-size: var(--fs-xs); color: var(--text-secondary); border-bottom: 1px solid var(--border-color); font-weight: 600; }
  .upcoming-table td { padding: 10px 8px; font-size: var(--fs-sm); border-bottom: 1px solid var(--border-subtle); color: var(--text-main); vertical-align: middle; }
  .upcoming-table tbody tr { break-inside: avoid; page-break-inside: avoid; }
  .urgent-date { color: var(--danger); font-weight: 700; }
  .tag-badge { border-radius: var(--radius-xs); padding: 3px 8px; font-size: var(--fs-2xs); font-weight: 700; color: white; display: inline-block; }

  /* ===== FORMULÁRIOS ===== */
  .form-row { display: flex; gap: 16px; }
  .form-row > div { flex: 1; }
  label.field-label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px; margin-top: 16px; }
  input[type="text"], input[type="email"], input[type="date"], select.field-select, textarea.field-area {
    width: 100%; padding: 10px 13px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    font-size: var(--fs-base); background: var(--bg-panel); font-family: inherit;
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast); outline: none; color: var(--text-main);
  }
  input::placeholder, textarea::placeholder { color: var(--text-muted); }
  input:focus, select.field-select:focus, textarea.field-area:focus {
    border-color: var(--primary); background: var(--bg-card);
    box-shadow: 0 0 0 3px var(--primary-ring);
  }

  /* ===== BOTÕES ===== */
  .btn { padding: 9px 18px; border: none; border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast); font-family: inherit; display: inline-flex; align-items: center; gap: 7px; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(108,93,211,0.28); }
  .btn.primary:hover { background-color: var(--primary-hover); box-shadow: 0 4px 14px rgba(108,93,211,0.36); }
  .btn.secondary { background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); }
  .btn.secondary:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn.danger { background: var(--bg-card); color: var(--danger); border: 1px solid var(--danger-border); }
  .btn.danger:hover { background: var(--danger-bg); }
  .btn.success { background: var(--success); color: white; }
  .btn.success:hover { background: #12855e; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-sm { padding: 6px 12px; font-size: var(--fs-xs); }
  .btn-icon {
    background: var(--bg-card); border: 1px solid var(--border-color); cursor: pointer;
    width: 32px; height: 32px; border-radius: var(--radius-sm); display: inline-flex;
    align-items: center; justify-content: center; transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast); padding: 0;
  }
  .btn-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .btn-icon.edit { color: var(--primary); } .btn-icon.edit:hover { background: var(--primary-light); border-color: #c7bdf5; }
  .btn-icon.rev  { color: var(--success); }  .btn-icon.rev:hover  { background: var(--success-bg); border-color: var(--success-border); }
  .btn-icon.del  { color: var(--danger); }   .btn-icon.del:hover   { background: var(--danger-bg); border-color: var(--danger-border); }
  .btn-icon.archive { color: var(--warning-text); } .btn-icon.archive:hover { background: var(--warning-bg); border-color: var(--warning-border); }
  .btn-icon.ban { color: var(--warning-text); } .btn-icon.ban:hover { background: var(--warning-bg); border-color: var(--warning-border); }
  .btn-icon.check { color: var(--success); } .btn-icon.check:hover { background: var(--success-bg); border-color: var(--success-border); }
  .btn-icon.history { color: var(--text-secondary); } .btn-icon.history:hover { background: var(--bg-subtle); border-color: var(--border-strong); }
  .btn-pdf { display: flex; align-items: center; gap: 8px; padding: 0 18px; height: 36px; border: none; border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 600; background: var(--text-main); color: white; cursor: pointer; transition: background var(--transition-fast), transform var(--transition-fast); white-space: nowrap; font-family: inherit; }
  .btn-pdf:hover { background: #303140; }
  .btn-pdf:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-pdf-email { display: flex; align-items: center; gap: 8px; padding: 0 18px; height: 36px; border: none; border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 600; background: var(--success); color: white; cursor: pointer; transition: filter var(--transition-fast); white-space: nowrap; font-family: inherit; }
  .btn-pdf-email:hover { filter: brightness(0.92); }
  .btn-pdf-email:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-action-icon { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: none; border-radius: var(--radius-sm); background: var(--text-main); color: white; cursor: pointer; transition: background var(--transition-fast); flex-shrink: 0; outline: none; }
  .btn-action-icon:hover { background: #303140; }
  .btn-action-icon.email { background: var(--success); }
  .btn-action-icon.email:hover { background: #12855e; }
  .btn-action-icon:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-action-icon.loading { opacity: 0.5; pointer-events: none; }
  .btn-action-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .btn-outline { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border-color); cursor: pointer; font-weight: 600; padding: 8px 16px; border-radius: var(--radius-sm); font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 7px; transition: background var(--transition-fast), border-color var(--transition-fast); font-family: inherit; }
  .btn-outline:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .action-btn-main { width: 100%; padding: 13px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: var(--fs-md); font-weight: 700; cursor: pointer; transition: background var(--transition-fast); margin-top: 24px; font-family: inherit; box-shadow: 0 2px 8px rgba(108,93,211,0.28); }
  .action-btn-main:hover { background: var(--primary-hover); }
  .action-btn-main:disabled { background: var(--text-muted); cursor: not-allowed; box-shadow: none; }

  /* ===== STATUS BADGES ===== */
  .status-badge { padding: 4px 11px; border-radius: var(--radius-pill); font-weight: 700; font-size: var(--fs-xs); display: inline-block; white-space: nowrap; }
  .version-badge {
    padding: 3px 10px; border-radius: var(--radius-pill); font-weight: 700; font-size: var(--fs-xs);
    background: var(--bg-panel); color: var(--text-secondary); border: 1px solid var(--border-color);
    cursor: pointer; font-family: inherit; transition: background var(--transition-fast), border-color var(--transition-fast);
  }
  .version-badge:hover { background: var(--bg-hover); border-color: var(--border-strong); }

  /* ===== MATRIZ DE RISCOS ===== */
  .matrix-table { width: 100%; border-collapse: separate; border-spacing: 4px; break-inside: avoid; page-break-inside: avoid; }
  .matrix-table th, .matrix-table td { height: 100px; text-align: center; font-weight: 700; border-radius: var(--radius-sm); font-size: 13.5px; width: 16%; vertical-align: middle; padding: 4px; }
  .matrix-table tr { break-inside: avoid; page-break-inside: avoid; }
  .cell-axis { background: var(--bg-card); color: var(--text-secondary); font-size: var(--fs-xs); border: 1px solid var(--border-color); }
  .cell-green  { background: #bfead7; color: #0f5b40; border: 1px solid #8fd6b4; }
  .cell-yellow { background: #f9e3ab; color: #7a5b06; border: 1px solid #edc768; }
  .cell-orange { background: #f6c9a0; color: #7c3f0d; border: 1px solid #ec9f5c; }
  .cell-red    { background: #f0b0b9; color: #7f1d2c; border: 1px solid #e17f8d; }
  .badge-cluster { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; padding: 4px; }
  .risk-badge { background: rgba(255,255,255,0.92); border: 1px solid rgba(0,0,0,0.1); color: var(--text-main); padding: 2px 7px; border-radius: var(--radius-xs); font-size: var(--fs-xs); font-weight: 700; cursor: default; }
  .legend-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; background: var(--bg-panel); padding: 13px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-top: 12px; break-inside: avoid; page-break-inside: avoid; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--text-secondary); font-weight: 600; }
  .legend-dot { width: 18px; height: 18px; border-radius: var(--radius-xs); }

  /* ===== MODAIS ===== */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(17,17,24,0.5); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(3px); animation: overlayIn var(--transition-base); }
  .modal-overlay.open { display: flex; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-box { background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); position: relative; max-height: 90vh; overflow-y: auto; width: 90%; max-width: 620px; padding: 30px 34px; animation: modalIn var(--transition-base); }
  .modal-box.wide { max-width: 800px; }
  .modal-box.narrow { max-width: 420px; text-align: center; }

  .modal-close-bar { display: flex; justify-content: flex-end; margin: -14px -18px 4px 0; }
  button.close-modal {
    width: 30px; height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1; font-weight: 400; font-family: inherit;
    color: var(--text-secondary); background: var(--bg-subtle); border: none;
    border-radius: var(--radius-pill); cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  button.close-modal:hover { background: var(--border-color); color: var(--text-main); }
  .modal-title { font-size: var(--fs-xl); font-weight: 700; color: var(--text-main); margin-bottom: 4px; letter-spacing: -0.2px; }
  .modal-info { background: var(--bg-panel); padding: 13px 15px; border-radius: var(--radius-md); font-size: var(--fs-base); line-height: 1.7; margin: 14px 0; }
  .modal-footer { display: flex; gap: 12px; margin-top: 24px; }

  /* Modal de tarefa (Kanban) */
  .card-detail-modal { background-color: var(--bg-panel); padding: 0; width: 780px; max-width: 95%; max-height: 90vh; display: flex; flex-direction: column; position: relative; }
  .card-detail-modal .modal-close-bar { position: absolute; top: 10px; right: 14px; margin: 0; padding: 0; z-index: 10; }
  .modal-split-layout { display: flex; flex-direction: row; padding: 24px 28px; gap: 28px; overflow-y: auto; }
  .modal-main-content { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .modal-sidebar-actions { width: 180px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }
  .modal-title-field { width: 100%; font-size: 19px; font-weight: 600; color: var(--text-main); padding: 6px 10px; border: 2px solid transparent; border-radius: var(--radius-xs); background: transparent; outline: none; resize: none; overflow: hidden; display: block; line-height: 1.4; font-family: inherit; }
  .modal-title-field:focus { border-color: var(--primary); background: var(--bg-card); }
  .modal-subtitle-text { font-size: var(--fs-sm); color: var(--text-muted); padding-left: 10px; margin-top: 2px; }
  .modal-content-section { display: flex; flex-direction: column; padding: 0 10px; }
  .section-label-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .section-label-header h4 { font-size: var(--fs-md); font-weight: 600; color: var(--text-main); margin: 0; }
  .icon-svg { width: 15px; height: 15px; color: var(--text-secondary); display: inline-block; }
  .modal-desc-field { width: 100%; padding: 10px 12px; border: 1px solid transparent; border-radius: var(--radius-xs); background: var(--bg-subtle); font-size: 13.5px; color: var(--text-main); resize: vertical; min-height: 75px; outline: none; font-family: inherit; }
  .modal-desc-field:focus { background: var(--bg-card); border-color: var(--primary); }
  .modal-comment-field { width: 100%; padding: 9px 11px; border: 1px solid var(--border-color); border-radius: var(--radius-xs); font-size: var(--fs-base); background: var(--bg-card); resize: vertical; min-height: 38px; outline: none; font-family: inherit; }
  .modal-comment-field:focus { border-color: var(--primary); }
  .activity-feed { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .hist-item { display: flex; flex-direction: column; position: relative; padding-left: 12px; border-left: 2px solid var(--border-color); }
  .hist-item::before { content: ''; position: absolute; left: -5px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); }
  .hist-date { font-size: var(--fs-2xs); font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
  .hist-author { color: var(--text-main); font-weight: 700; }
  .hist-action { font-size: 12.5px; color: var(--text-main); line-height: 1.4; }
  .sidebar-field-group { display: flex; flex-direction: column; gap: 4px; }
  .sidebar-field-group label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
  .sidebar-select, .sidebar-date { width: 100%; padding: 8px 10px; border: none; border-radius: var(--radius-xs); background: var(--bg-subtle); font-size: 12.5px; color: var(--text-main); cursor: pointer; outline: none; font-family: inherit; }
  .sidebar-select:focus, .sidebar-date:focus { background: var(--bg-card); box-shadow: inset 0 0 0 2px var(--primary); }
  .sidebar-action-btn { width: 100%; padding: 9px; border: none; border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; transition: background var(--transition-fast); font-family: inherit; }
  .save-btn { background: var(--primary); color: white; margin-bottom: 7px; }
  .save-btn:hover { background: var(--primary-hover); }
  .del-btn { background: var(--bg-subtle); color: var(--danger); }
  .del-btn:hover { background: var(--danger-bg); }
  .archive-btn { background: var(--warning-bg); color: var(--warning-text); margin-bottom: 7px; }
  .archive-btn:hover { background: var(--warning-border); }
  .btn-add-afast { background: var(--primary-light); color: var(--primary-text); border: 1px dashed #c7bdf5; border-radius: var(--radius-sm); padding: 7px 13px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; transition: background var(--transition-fast); font-family: inherit; }
  .btn-add-afast:hover { background: #e4e0f9; }
  .btn-rem-afast { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); border-radius: var(--radius-sm); width: 28px; height: 28px; font-size: 16px; line-height: 1; cursor: pointer; flex-shrink: 0; transition: background var(--transition-fast); }
  .btn-rem-afast:hover { background: #f8dbe0; }
  .afast-block { margin-bottom: 8px; }
  .custom-select-wrapper { position: relative; }
  .custom-select-display { background: var(--bg-subtle); border-radius: var(--radius-xs); padding: 8px 10px; cursor: pointer; font-size: 12.5px; color: var(--text-main); transition: background var(--transition-fast); }
  .custom-select-display:hover { background: var(--bg-hover); }
  .custom-select-display::after { content: '▼'; float: right; font-size: 8px; color: var(--text-secondary); line-height: 18px; }
  .custom-select-options { position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); z-index: 10; max-height: 180px; overflow-y: auto; display: none; box-shadow: var(--shadow-md); margin-top: 4px; }
  .custom-select-options.show { display: flex; flex-direction: column; }
  .checkbox-label { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-main); }
  .checkbox-label:hover { background: var(--bg-panel); }
  .checkbox-label input { width: auto; margin: 0; cursor: pointer; accent-color: var(--primary); }
  .selected-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .assignee-tag { background: var(--border-color); color: var(--text-main); border-radius: var(--radius-xs); padding: 3px 8px; font-size: var(--fs-2xs); font-weight: 600; }
  .label-chip { color: #fff; border-radius: var(--radius-xs); padding: 3px 9px; font-size: var(--fs-2xs); font-weight: 600; line-height: 1.3; letter-spacing: .2px; }
  .label-dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
  .card-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
  .card-labels .label-chip { padding: 2px 7px; font-size: 9.5px; }

  /* ===== STATUS MSG / STATUS BAR ===== */
  .status-msg { margin-top: 14px; text-align: center; font-weight: 600; font-size: var(--fs-base); min-height: 20px; }

  /* ===== PDF ===== */
  .pdf-header { display: none; margin-bottom: 26px; padding: 14px 20px; background: var(--bg-panel); border-left: 4px solid var(--primary); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .pdf-header h1 { font-size: 12px; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.3px; }
  .pdf-header .pdf-sub { color: var(--text-secondary); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; margin: 3px 0 8px; }
  .pdf-header h2 { font-size: 19px; font-weight: 700; color: var(--primary); }

  /* ===== ACOMPANHAMENTO DE ENTREGAS (modal) ===== */
  .acomp-ent-row { border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 13px 17px; margin-bottom: 8px; background: var(--bg-panel); transition: border-color var(--transition-base), background var(--transition-base); }
  .acomp-ent-row.entregue { border-color: var(--success-border); background: var(--success-bg); }
  .acomp-ent-row.pendente { border-color: var(--danger-border); background: var(--danger-bg); }
  .acomp-main-row { display: flex; align-items: center; gap: 14px; }
  .acomp-unit-info { flex: 1; min-width: 0; }
  .acomp-unit-sigla { font-size: 10.5px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; }
  .acomp-unit-nome { font-size: 12.5px; font-weight: 600; color: var(--text-main); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acomp-status-wrap { flex-shrink: 0; }
  .acomp-status-select { height: 34px; padding: 0 11px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--bg-card); color: var(--text-main); font-family: inherit; outline: none; cursor: pointer; width: 160px; transition: border-color var(--transition-fast), background var(--transition-fast); }
  .acomp-status-select:focus { border-color: var(--primary); }
  .acomp-status-select.entregue { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); font-weight: 600; }
  .acomp-status-select.pendente { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
  .acomp-fields-row { display: none; align-items: flex-end; gap: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .acomp-field-group { display: flex; flex-direction: column; gap: 4px; }
  .acomp-field-label { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; }
  .acomp-field-group input { padding: 8px 11px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--bg-card); font-family: inherit; color: var(--text-main); outline: none; transition: border-color var(--transition-fast); }
  .acomp-field-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }

  /* ===== RESPONSIVO ===== */
  @media (max-width: 768px) {
    .app-layout { flex-direction: column; }
    .sidebar { width: 100%; height: auto; padding: 12px; flex-direction: row; flex-wrap: wrap; }
    .modal-split-layout { flex-direction: column; padding: 16px; }
    .modal-sidebar-actions { width: 100%; border-top: 1px solid var(--border-color); padding-top: 16px; }
    .dash-row.two-cols, .dash-row.two-cols-table { grid-template-columns: 1fr; }
    .form-row { flex-direction: column; }
  }

  /* ==========================================
     MÓDULO 6 — GESTÃO DE PESSOAS
  ========================================== */

  /* Escala — grid de visão diária */
  .escala-overview {
    display: flex; gap: 12px; margin-bottom: 22px;
  }
  .escala-col {
    flex: 1; background: var(--bg-panel); border: 1.5px solid var(--border-subtle); border-radius: var(--radius-md);
    padding: 13px 11px; min-height: 90px; text-align: center;
    transition: border-color var(--transition-base), background var(--transition-base);
  }
  .escala-col.today {
    border-color: var(--primary); background: var(--primary-lighter);
  }
  .escala-col-title {
    font-weight: 700; font-size: var(--fs-sm); color: var(--text-secondary); margin-bottom: 4px; letter-spacing: .04em;
  }
  .escala-col-count {
    font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: 8px;
  }
  .escala-member-pill {
    display: inline-block; background: var(--primary); color: #fff;
    border-radius: var(--radius-pill); padding: 2px 10px; font-size: var(--fs-xs); font-weight: 600;
    margin: 2px auto;
  }
  .escala-empty-day { font-size: var(--fs-xs); color: var(--border-strong); font-style: italic; }
  .today-dot        { color: var(--primary); font-size: 7px; vertical-align: middle; }

  /* Escala — ícones de check na tabela */
  .escala-check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 25px; height: 25px; border-radius: 50%;
    background: var(--success-bg); color: var(--success-text); font-size: 12px; font-weight: 700;
  }
  .escala-check.presencial {
    background: var(--info-bg); color: var(--info-text);
