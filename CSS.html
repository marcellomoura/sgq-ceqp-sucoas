  .sidebar-field-group > label { font-size: var(--fs-xs); font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
  .sidebar-select, .sidebar-date { width: 100%; padding: 10px 13px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background-color: var(--bg-panel); font-size: var(--fs-base); color: var(--text-main); cursor: pointer; outline: none; font-family: inherit; transition: border-color var(--transition-fast), background-color var(--transition-fast); }
  .sidebar-select:focus, .sidebar-date:focus { background-color: var(--bg-card); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
  .sidebar-action-btn { width: 100%; padding: 9px; border: none; border-radius: var(--radius-sm); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; transition: background var(--transition-fast); font-family: inherit; }
  /* Mesmo caso do .btn.primary (§8.20 B1): "Salvar Cartão" é ação primária, então
     usa a família da marca. Antes o fundo vinha de --sidebar-active-bg (a pílula
     do menu de navegação, sem relação com este painel) e só o hover de
     --primary-hover. Corrigido junto para os 3 botões primários do sistema
     (.btn-create, .btn.primary, .save-btn) ficarem na mesma cor. */
  .save-btn { background: var(--primary); color: var(--text-inverse); margin-bottom: 7px; }
  .save-btn:hover { background: var(--primary-hover); }
  .del-btn { background: var(--bg-subtle); color: var(--danger); }
  .del-btn:hover { background: var(--danger-bg); }
  .archive-btn { background: var(--warning-bg); color: var(--warning-text); margin-bottom: 7px; }
  .archive-btn:hover { background: var(--warning-border); }
  .btn-add-afast { background: var(--primary-light); color: var(--primary-text); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 7px 13px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; transition: background var(--transition-fast); font-family: inherit; }
  .btn-add-afast:hover { background: var(--bg-subtle); }
  .btn-rem-afast { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); border-radius: var(--radius-sm); width: 28px; height: 28px; font-size: 16px; line-height: 1; cursor: pointer; flex-shrink: 0; transition: background var(--transition-fast); }
  .btn-rem-afast:hover { background: var(--danger-border); }
  .afast-block { margin-bottom: 8px; }
  .custom-select-wrapper { position: relative; }
  .field-multiselect {
    width: 100%; padding: 10px 13px; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    font-size: var(--fs-base); font-family: inherit; background: var(--bg-panel); color: var(--text-muted);
    cursor: pointer; transition: border-color var(--transition-fast), background var(--transition-fast), box-shadow var(--transition-fast);
  }
  .field-multiselect:hover { background: var(--bg-hover); }
  .field-multiselect:focus { background: var(--bg-card); border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); outline: none; }
  .field-multiselect::after { content: '▼'; float: right; font-size: 8px; color: var(--text-secondary); line-height: 18px; }
  
  /* Ajuste Kanban: Imitar select nativo (cor escura e setinha nativa) */
  .sidebar-field-group .field-multiselect { color: var(--text-main); }
  .sidebar-field-group .field-multiselect::after {
    content: ''; width: 14px; height: 14px; float: right; margin-top: 2px;
    background-image: var(--icon-chevron);
    background-size: contain; background-repeat: no-repeat;
  }

  .custom-select-options {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    max-height: 200px; overflow-y: auto; z-index: 50; margin-top: 4px;
  }
  .custom-select-options.show { display: flex; flex-direction: column; }
  .checkbox-label { padding: 8px 12px; cursor: pointer; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-main); }
  .checkbox-label:hover { background: var(--bg-panel); }
  .checkbox-label input { width: auto; margin: 0; cursor: pointer; accent-color: var(--control-accent); }
  /* Variante compacta (lista de labels do Kanban); migrado de inline. */
  .checkbox-label--compact { padding: 4px 8px; margin-bottom: 2px; border-radius: 4px; }
  .label-svg-icon { display: flex; }
  .hidden-checkbox { display: none; }
  .selected-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .assignee-tag { background: var(--border-color); color: var(--text-main); border-radius: var(--radius-xs); padding: 3px 8px; font-size: var(--fs-2xs); font-weight: 600; }
  .label-chip { color: var(--text-inverse); border-radius: var(--radius-xs); padding: 3px 9px; font-size: var(--fs-2xs); font-weight: 600; line-height: 1.3; letter-spacing: .2px; }
  .card-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
  .card-labels .label-chip { padding: 2px 7px; font-size: 9.5px; }

  /* ===== ACOMPANHAMENTO DE ENTREGAS (modal) ===== */
  .acomp-ent-row {
    display: flex; align-items: center; gap: 16px; flex-wrap: nowrap;
    border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 13px 17px;
    margin-bottom: 8px; background: var(--bg-panel);
    transition: border-color var(--transition-base), background var(--transition-base);
  }
  .acomp-ent-row.entregue { border-color: var(--success-border); background: var(--success-bg); }
  .acomp-ent-row.pendente { border-color: var(--danger-border); background: var(--danger-bg); }
  .acomp-unit-info { flex: 1; min-width: 200px; }
  .acomp-unit-sigla { font-size: 10.5px; font-weight: 700; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; }
  .acomp-unit-nome { font-size: 12.5px; font-weight: 600; color: var(--text-main); margin-top: 2px; white-space: normal; line-height: 1.2; }
  .acomp-status-wrap { width: 160px; flex-shrink: 0; }
  .acomp-status-select { height: 34px; padding: 0 11px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 12.5px; background: var(--bg-card); color: var(--text-main); font-family: inherit; outline: none; cursor: pointer; width: 100%; transition: border-color var(--transition-fast), background var(--transition-fast); }
  .acomp-status-select:focus { border-color: var(--primary); }
  .acomp-status-select.entregue { border-color: var(--success-border); background: var(--success-bg); color: var(--success-text); font-weight: 600; }
  .acomp-status-select.pendente { border-color: var(--danger-border); background: var(--danger-bg); color: var(--danger-text); }
  .acomp-sei-wrap { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .acomp-field-group { display: flex; flex-direction: column; gap: 4px; }
  .acomp-field-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .acomp-field-group input { padding: 8px 11px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 12.5px; background-color: var(--bg-card); font-family: inherit; color: var(--text-main); outline: none; transition: border-color var(--transition-fast); }
  .acomp-field-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-ring); }
  .acomp-data { width: 130px !important; height: 32px; padding: 0 8px !important; }
  .acomp-sei { width: 150px !important; height: 32px; padding: 0 8px !important; }
  .required-mark { color: var(--danger); }

  /* ===== RESPONSIVO ===== */
  @media (max-width: 768px) {
    .app-layout { flex-direction: column; }
    .sidebar, .sidebar.collapsed { width: 100%; height: auto; padding: 12px; flex-direction: row; flex-wrap: wrap; }
    /* Modo ícones é recurso de desktop; no mobile o layout já é outro
       (barra horizontal), então neutraliza o recolhido e mantém os rótulos. */
    .sidebar.collapsed .sidebar-brand-text,
    .sidebar.collapsed .nav-group-label { display: block; }
    .sidebar.collapsed .nav-group-title .arrow { display: inline-flex; }
    .sidebar.collapsed .menu-item { font-size: 13px; justify-content: flex-start; padding: 9px 10px; gap: 10px; }
    .sidebar.collapsed .nav-group-items.open { display: block; }
    .modal-split-layout { flex-direction: column; padding: 16px; }
    .modal-sidebar-actions { width: 100%; border-top: 1px solid var(--border-color); padding-top: 16px; }
    .form-row { flex-direction: column; }
  }

  /* ==========================================
     MÓDULO 6 — GESTÃO DE PESSOAS
  ========================================== */

  /* Escala — grid de visão diária */
  .escala-overview {
    display: flex; gap: 12px; margin-bottom: 16px;
    padding: 0 28px; flex-shrink: 0;
  }
  .escala-col {
    flex: 1; background: var(--bg-card); border: 2px solid var(--border-subtle); border-radius: var(--radius-md);
    padding: 13px 11px; min-height: 90px; text-align: center;
    transition: transform var(--transition-base), box-shadow var(--transition-base);
    box-shadow: var(--shadow-sm);
  }
  .escala-col:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .escala-col.today {
    background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                linear-gradient(135deg, var(--accent), var(--purple)) border-box;
    border: 2px solid transparent;
    box-shadow: var(--shadow-accent);
  }
  .escala-col-title {
    font-weight: 700; font-size: var(--fs-sm); color: var(--text-secondary); margin-bottom: 4px; letter-spacing: .04em;
  }
  .escala-col-count {
    font-size: var(--fs-xs); color: var(--text-muted); margin-bottom: 8px;
  }
  .escala-member-pill {
    display: inline-block; background: var(--color-presencial-bg); color: var(--color-presencial-text);
    border-radius: var(--radius-pill); padding: 2px 10px; font-size: var(--fs-xs); font-weight: 600;
    margin: 2px auto;
  }
  .escala-empty-day { font-size: var(--fs-xs); color: var(--border-strong); font-style: italic; }

  /* Badges de Férias/Afastamentos */
  .tag-periodo {
    display: inline-block; font-size: 11.5px; padding: 2px 0px; color: var(--text-main);
    margin: 2px 4px 2px 0; white-space: nowrap; line-height: 1.35;
  }
  .tag-periodo.agora {
    background: var(--color-agora-bg); border: 1px solid var(--color-agora-border); border-radius: 4px;
    padding: 2px 6px; font-weight: 600; color: var(--color-agora-text);
  }
  .tag-periodo.abono-past {
    background: var(--bg-hover); border: 1px solid var(--border-color); border-radius: 4px;
    padding: 2px 6px; color: var(--text-secondary); font-size: 11px;
  }
  .tag-dash { color: var(--text-muted); font-size: 12px; }
  .today-dot        { color: var(--primary); font-size: 7px; vertical-align: middle; }

  /* Escala — ícones de check na tabela */
  .escala-check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 25px; height: 25px; border-radius: 50%;
    background: var(--success-bg); color: var(--success-text); font-size: 12px; font-weight: 700;
  }
  .escala-check.presencial {
    background: var(--color-agora-bg); color: var(--color-agora-text);
  }
  .escala-check svg { stroke: currentColor; }
  .escala-vazio { color: var(--border-strong); font-size: var(--fs-base); }
  .escala-cell-off { text-align: center; display: flex; align-items: center; justify-content: center; }
  .escala-cell-on { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .escala-hora-info { font-size: 9.5px; color: var(--text-secondary); font-weight: normal; white-space: nowrap; }
  .escala-presenciais-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  /* Selo "Inativo" (membro/unidade desativado). */
  .tag-badge--inativo { font-size: 10px; margin-left: 4px; text-decoration: none; }
  /* Variante do .tag-badge para nomes de presencial (Escala Semanal, tabela). */
  .tag-badge--presencial { background: var(--color-presencial-bg); color: var(--color-presencial-text); font-size: 11px; margin-right: 2px; display: inline-block; margin-bottom: 2px; }

  /* Avatar de membro — a cor vem de uma das classes .avatar-pastel-N abaixo,
     escolhida por corPastelPorNome() (JS_Utilitarios.html) conforme o nome. */
  .member-avatar {
    width: 33px; height: 33px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12px; flex-shrink: 0;
  }
  /* Variante maior (linhas de lista de Membros/Escala); migrado de inline (repetia
     idêntico em Kanban e Pessoas). */
  .member-avatar--lg { width: 38px; height: 38px; font-size: 13px; }
  .member-role-badge--lg { font-size: var(--fs-sm); }

  /* Lista-legenda dos gráficos por membro (Kanban); migrado de inline (repetia
     2x — gráfico "Em Andamento" e "Concluídas por Membro"). A cor de fundo do
     avatar continua inline (dinâmica, uma por membro). */
  .chart-legend-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: var(--radius-sm); }
  .chart-legend-left { display: flex; align-items: center; min-width: 0; margin-right: 12px; }
  .chart-legend-right { display: flex; align-items: center; flex-shrink: 0; }
  .chart-legend-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--text-inverse); margin-right: 12px; flex-shrink: 0; }
  .chart-legend-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--text-secondary); }
  .chart-legend-count { font-size: 13px; text-align: right; min-width: 20px; font-weight: 500; color: var(--text-muted); }
  /* Os 12 tons da paleta decorativa (ver §8.19). São exatamente os mesmos
     valores dos tokens --tag-*, que antes ficavam repetidos aqui em hex —
     agora apontam para a fonte única, para que a paleta seja ajustável num
     lugar só (pré-requisito do modo escuro, §8.20). */
  .avatar-pastel-1  { background: var(--tag-lavender);  color: var(--tag-lavender-text); }  /* Lavanda */
  .avatar-pastel-2  { background: var(--tag-mint);      color: var(--tag-mint-text); }      /* Menta */
  .avatar-pastel-3  { background: var(--tag-rose);      color: var(--tag-rose-text); }      /* Rosa */
  .avatar-pastel-4  { background: var(--tag-sky);       color: var(--tag-sky-text); }       /* Céu */
  .avatar-pastel-5  { background: var(--tag-peach);     color: var(--tag-peach-text); }     /* Pêssego */
  .avatar-pastel-6  { background: var(--tag-gold);      color: var(--tag-gold-text); }      /* Dourado */
  .avatar-pastel-7  { background: var(--tag-brick);     color: var(--tag-brick-text); }     /* Tijolo */
  .avatar-pastel-8  { background: var(--tag-lime);      color: var(--tag-lime-text); }      /* Lima */
  .avatar-pastel-9  { background: var(--tag-turquoise); color: var(--tag-turquoise-text); } /* Turquesa */
  .avatar-pastel-10 { background: var(--tag-orchid);    color: var(--tag-orchid-text); }    /* Orquídea */
  .avatar-pastel-11 { background: var(--tag-slate);     color: var(--tag-slate-text); }     /* Ardósia */
  .avatar-pastel-12 { background: var(--tag-cinnamon);  color: var(--tag-cinnamon-text); }  /* Canela */

  /* Escala — checkboxes/radios estilizados no modal */
  .escala-day-check {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-subtle);
    cursor: pointer; font-size: var(--fs-base); font-weight: 500; color: var(--text-secondary);
    transition: border-color var(--transition-fast), background var(--transition-fast);
    user-select: none;
  }
  .escala-day-check:hover { border-color: var(--primary); background: var(--primary-lighter); }
  .escala-day-check input { accent-color: var(--control-accent); width: 15px; height: 15px; margin: 0; }
  /* Variante compacta (modal Editar Escala Semanal — 6 dias lado a lado, sem
     scroll) e cartão de dia de trabalho + campo de horário; migrado de inline
     (cada um repetia 6x no mesmo modal). */
  .escala-day-check--compact { font-size: 11.5px; padding: 5px 8px; flex: 1; justify-content: center; white-space: nowrap; }
  .escala-day-card {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px;
    align-items: center; border: 1px solid var(--border-color); padding: 6px; border-radius: 6px;
  }
  .escala-day-card-label { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 11.5px; cursor: pointer; user-select: none; }
  .escala-day-card-label input[type="checkbox"] { accent-color: var(--control-accent); }
  .escala-hora-input {
    width: 100%; font-size: 10.5px !important; padding: 4px !important; text-align: center; height: 24px;
    border: 1px solid var(--border-strong) !important; border-radius: 4px !important;
  }

  #f-log-busca::placeholder { font-size: var(--fs-xs); }
  #f-log-data-ini, #f-log-data-fim { font-size: var(--fs-xs); }

  /* ==========================================================================
     PAINEL DE INDICADORES — herda os mesmos tokens globais do sistema

     Convenção de nomes: os componentes deste painel usam o prefixo `tl-`
     (.tl-kpi-card, .tl-kpi-grid, .tl-section-title etc.), sempre com o
     seletor `#view-indicadores` na frente, propositalmente separados dos
     componentes genéricos sem prefixo (.kpi-card, .section-title) usados no
     resto do app. Isso é intencional, não duplicação: permite alterar o
     visual de um painel específico (cores, espaçamento, cards) sem afetar o
     design system compartilhado, e vice-versa. Ver .kpi-fill-* acima, que é
     um caso deliberado de reuso entre as duas famílias.
     ========================================================================== */
  #view-indicadores {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-color: var(--bg-app);
    color: var(--text-main);
    padding: 24px 28px;
    border-radius: var(--radius-lg);
    min-height: calc(100vh - 100px);
  }

  /* .tl-header (título antigo do painel) removido — o cabeçalho hoje usa
     .view-header/.page-title compartilhados com o resto do app. */
  #view-indicadores .tl-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 8px; }
  #view-indicadores .tl-kpi-card {
    background: var(--bg-card); border-radius: var(--radius-md); padding: 10px 14px;
    box-shadow: none; border: none;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
    transition: transform var(--transition-base);
  }
  #view-indicadores .tl-kpi-card:hover { transform: translateY(-2px); }
  /* Cor de .c-* já declarada junto com .icon-* mais acima (mesma família). */
  #view-indicadores .tl-kpi-icon { width: 28px; height: 28px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  #view-indicadores .tl-kpi-icon svg { width: 14px; height: 14px; }
  #view-indicadores .tl-kpi-info { display: flex; flex-direction: column; min-width: 0; }
  #view-indicadores .tl-kpi-title { order: 2; font-size: var(--fs-2xs); font-weight: 500; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #view-indicadores .tl-kpi-value { order: 1; font-size: 17px; font-weight: 700; color: var(--text-main); line-height: 1.15; letter-spacing: -0.3px; }

  #view-indicadores .tl-section-title { font-size: var(--fs-lg); font-weight: 700; color: var(--text-main); margin: 8px 0 8px 0; display: flex; align-items: center; gap: 12px; }
  #view-indicadores .tl-section-title::before { content: ""; display: block; width: 4px; height: 16px; background: var(--primary); border-radius: var(--radius-pill); }
  #view-indicadores .tl-section-title::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }

  #view-indicadores .tl-chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  #view-indicadores .tl-chart-grid.full { grid-template-columns: 1fr; }
  @media (max-width: 900px) { #view-indicadores .tl-chart-grid { grid-template-columns: 1fr; } }

  #view-indicadores .tl-chart-card {
    background: var(--bg-card); border-radius: var(--radius-lg); padding: 14px 16px;
    box-shadow: none; border: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
  }
  #view-indicadores .tl-chart-header { font-size: 14.5px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; letter-spacing: -0.2px; }
  #view-indicadores .tl-chart-wrap { height: 190px; width: 100%; position: relative; }
  /* Variantes do painel de indicadores (gráficos maiores da tela de Monitoramento);
     migrado de inline (repetiam 4-6x cada). */
  #view-indicadores .tl-chart-wrap.tl-chart-simple { height: 300px; padding: 10px 0; }
  #view-indicadores .tl-chart-wrap.tl-chart-donut-wrap { display: flex; justify-content: center; align-items: center; gap: 28px; min-height: 320px; padding: 10px 0; }
  .tl-donut-ring { position: relative; width: 230px; height: 230px; flex-shrink: 0; }
  .tl-donut-center { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .tl-donut-total { font-size: 32px; font-weight: 700; color: var(--text-main); margin: 0; line-height: 1; }
  .tl-donut-label { font-size: 14px; font-weight: 500; color: var(--text-muted); }
  .tl-donut-legend-list { width: 270px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; max-height: 300px; padding-right: 6px; }
  /* ===== LISTAS (GRID) ===== */
  /* Container que rola — cabeçalho e linhas juntos */
  .list-scroll { flex:1; min-height:0; overflow-y:auto; scrollbar-gutter:stable;
                 display:flex; flex-direction:column; padding: 0 28px; }
  .list-scroll.x { overflow-x: auto; }









  /* =========================================================================
     NOVOS ESTILOS: Painel de Planos de Ação (Vínculo Visual Risco x Plano)
     ========================================================================= */
  .risk-block {
    background: var(--bg-card);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    margin-bottom: 16px;
    overflow: hidden;
    border-left: 4px solid var(--primary);
  }
  /* Variante para riscos/planos arquivados; migrado de inline. */
  .risk-block--archived { background-color: var(--bg-panel); border: 1px dashed var(--border-strong); }
  .risk-title-row { display: flex; align-items: center; gap: 8px; }
  .tag-archived { font-size: 11px; font-weight: 700; background: var(--tag-slate); color: var(--tag-slate-text); padding: 2px 6px; border-radius: 4px; letter-spacing: 0.5px; }
  .risk-header {
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--border-color);
    display: flex; justify-content: space-between; align-items: flex-start;
    background-color: var(--bg-panel);
  }
  .risk-title {
    font-size: 16px; font-weight: 600;
    margin: 0 0 4px 0;
    display: flex; align-items: center; gap: 8px;
    color: var(--text-main);
  }
  .risk-title--archived { color: var(--text-secondary); }
  .risk-meta {
    display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center;
    font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4;
  }
  .risk-meta strong { color: var(--text-main); }
  .risk-meta-sep { color: var(--border-strong); margin: 0 4px; }
  .plans-container {
    padding: 12px 24px 16px;
    background: var(--bg-card);
  }
  .plans-title {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .plans-title--archived { color: var(--text-secondary); }
  .plan-card {
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 12px;
    background: var(--bg-card);
    transition: box-shadow 0.2s, border-color 0.2s;
    position: relative;
  }
  .plan-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--border-strong);
  }
  .plan-card:last-child { margin-bottom: 0; }
  /* Variante para plan-card isolado dentro de um version-card (não é lista de
     irmãos, então :last-child não se aplica); migrado de inline (repetia 2x). */
  .plan-card--nested { margin-top: 12px; margin-bottom: 0; }
  .plan-card-empty-msg { margin-top: 12px; font-size: 13px; color: var(--text-muted); font-style: italic; }
  .plan-card.inactive {
    background: var(--bg-panel);
    border-style: dashed;
    opacity: 0.8;
  }
  .plan-field-label {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px;
  }
  .plan-field-value {
    color: var(--text-main); font-weight: normal; font-size: 12.5px;
  }
  .plan-actions {
    position: absolute; top: 10px; right: 16px;
    display: flex; gap: 8px; align-items: center;
  }

  .version-card {
    border-left: 2px solid var(--border-color);
    padding-left: 20px;
    position: relative;
    margin-bottom: 24px;
    transition: opacity 0.3s;
  }
  .version-card.is-old {
    opacity: 0.85;
  }
  .version-card::before {
    content: '';
    position: absolute;
    left: -6px;
    top: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border-color);
    border: 2px solid var(--bg-card);
  }
  .version-card.is-active {
    border-left-color: var(--primary);
    opacity: 1 !important;
  }
  .version-card.is-active::before {
    background: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  .version-header {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    background: var(--bg-panel);
    padding: 8px 12px;
    border-radius: 6px;
  }
  .version-title {
    font-weight: 700;
    color: var(--text-main);
  }
  .version-date { color: var(--text-muted); font-size: 11px; }
  .plan-single-line {
    display: grid;
    grid-template-columns: minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr);
    gap: 16px;
    align-items: start;
    padding-right: 120px;
  }
  .plan-card.needs-review {
    background-color: var(--warning-bg) !important;
    border-color: var(--warning-border) !important;
  }
  .plan-single-line .plan-field-label {
    font-size: 10px;
  }

  /* ==========================================
     MODO ESCURO — ajustes ESTRUTURAIS
     ==========================================
     Único lugar do modo escuro que muda PROPRIEDADE, não valor de token.

     O problema: vários componentes deste sistema não têm borda — são
     definidos apenas pela sombra (`border: none` + `box-shadow`). Isso
     funciona no claro, onde uma pílula branca sobre fundo cinza ganha
     recorte com uma sombra sutil. No escuro **sombra praticamente não
     existe**: uma sombra escura sobre fundo escuro não recorta nada, e
     esses componentes perderiam a definição.

     Por que ANEL (box-shadow) e não `border`: borda real ocuparia espaço
     nos elementos que não têm width/height explícitos (as pílulas de
     filtro, as linhas de lista, o modal), empurrando o layout em 2px. O
     `box-shadow` de raio zero desenha a mesma hairline sem afetar layout
     nenhum — e, de quebra, substitui naturalmente a sombra que deixou de
     funcionar.

     Atenção ao mexer aqui: `box-shadow` NÃO faz merge entre declarações —
     é substituído por inteiro. Por isso cada estado de :hover que declara
     a própria sombra precisa reaplicar o anel explicitamente, senão o
     anel some justamente ao passar o mouse.

     Ver DOCUMENTACAO.md §8.20 (F1, P3).
  ========================================== */

  /* Filtros e ações do topo — pílulas da cor do cartão sobre o fundo do app. */
  [data-theme="dark"] .filter-select,
  [data-theme="dark"] .filter-input,
  [data-theme="dark"] .filter-date-group,
  [data-theme="dark"] .btn-top-action,
  /* Cartões de KPI (o do Painel precisa do #id para vencer a regra base). */
  [data-theme="dark"] .kpi-card,
  [data-theme="dark"] #view-indicadores .tl-kpi-card,
  /* As 10 classes de linha de lista — o componente mais repetido do sistema. */
  [data-theme="dark"] .doc-row,
  [data-theme="dark"] .membro-row,
  [data-theme="dark"] .escala-row,
  [data-theme="dark"] .vt-row,
  [data-theme="dark"] .ferias-row,
  [data-theme="dark"] .arq-row,
  [data-theme="dark"] .risco-row,
  [data-theme="dark"] .unid-row,
  [data-theme="dark"] .log-row,
  [data-theme="dark"] .cap-row,
  /* Modal: no claro a --shadow-lg é que o descola do fundo. */
  [data-theme="dark"] .modal-box {
    box-shadow: 0 0 0 1px var(--border-color);
  }

  /* Estados de hover que declaram box-shadow próprio: reaplicam o anel (mais
     forte) porque a propriedade é substituída por inteiro, não somada. */
  [data-theme="dark"] .btn-top-action:hover,
  [data-theme="dark"] .grid-row-hover:hover {
    box-shadow: 0 0 0 1px var(--border-strong);
  }

  /* NÃO recebem anel, deliberadamente:
     - .btn-create e .btn.primary: são preenchimento sólido colorido, o
       próprio fill já recorta contra o fundo;
     - .card (Kanban): a definição vem da escada de superfícies — o cartão
       (--bg-card) é mais claro que a coluna (--kanban-list-bg). Ver §8.20 K2;
     - .tl-chart-card, .table-wrap, .legend-row: já têm borda de verdade.

     .btn:disabled mantém opacity: 0.5 — analisado e descartado como problema:
     o efeito é simétrico nos dois temas (tinta escura a 50% sobre branco e
     tinta clara a 50% sobre escuro chegam ao mesmo cinza médio), então não há
     razão para um valor diferente aqui. Ver §8.20 (B4). */
