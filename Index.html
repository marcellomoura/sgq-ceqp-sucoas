  <!-- CDNs com Subresource Integrity (SRI): o navegador só executa o script se

       ponto exato para o hash não "quebrar" numa atualização de patch. -->
  <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.0/DragDropTouch.js"

       plugin chartjs-plugin-datalabels@2.0.0 é compatível com Chart.js 3.x/4.x. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"

  <meta name="theme-color" content="#f3f4f6">

  <!-- ANTI-FLASH — precisa rodar ANTES do primeiro paint, por isso vive aqui no
       <head> e não junto do resto do JS (que carrega no fim do <body>). Sem
       isso, quem usa o modo escuro veria a tela branca por ~200ms a cada
       carregamento, antes de escurecer.
       Falha em silêncio de propósito: este script roda antes de tudo, então
       uma exceção aqui derrubaria a página inteira. Sem localStorage
       (navegação privada, cookies bloqueados) o sistema simplesmente abre no
       modo claro. Ver DOCUMENTACAO.md §8.20. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sgq-tema');
        if (t !== 'dark' && t !== 'light') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark' : 'light';
        }
        var raiz = document.documentElement;
        if (t === 'dark') {
          raiz.setAttribute('data-theme', 'dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#0f131a');
        }
        // O data-theme sozinho NÃO evita o flash: ele só tem efeito depois que
        // o CSS é interpretado, e até lá o navegador pinta a tela de fundo
        // PADRÃO dele — branca. Estas duas linhas agem antes de qualquer CSS:
        //   colorScheme  diz ao navegador para usar o canvas escuro no lugar
        //                do branco (e vale também para o iframe do Apps Script,
        //                já que a página é servida com XFrameOptionsMode.DEFAULT);
        //   backgroundColor cobre o <html>, que no CSS não tem fundo próprio —
        //                lá o background está só no <body>, pintado mais tarde.
        // Mantidas em sincronia por aplicarTema() (JS_Utilitarios.html).
        raiz.style.colorScheme = t;
        raiz.style.backgroundColor = (t === 'dark') ? '#0f131a' : '#f3f4f6';
      } catch (e) { /* sem localStorage: abre no claro */ }
    })();
  </script>
