<script>
// ==========================================
// MÓDULO 6 — GESTÃO DE CAPACITAÇÕES
// ==========================================

let capPage = 1;
const capLimit = 20;

function renderCapacitacoes(resetPage = false) {
  if (resetPage) capPage = 1;
  const tbody = $id('lista-capacitacoes');
  let caps  = Array.isArray(state.trainings) ? state.trainings : [];

  const ini = $id('f-cap-data-ini') ? $id('f-cap-data-ini').value : '';
  const fim = $id('f-cap-data-fim') ? $id('f-cap-data-fim').value : '';
  
  if (ini || fim) {
    caps = caps.filter(c => {
      const d = c.dataRealizada || c.dataPrevista;
      if (!d) return false;
      if (ini && d < ini) return false;
      if (fim && d > fim) return false;
      return true;
    });
  }

  const btnMore = $id('btn-load-more-cap');

  if (!caps.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="msg-empty">Nenhuma capacitação encontrada.</td></tr>';
    if (btnMore) btnMore.style.display = 'none';
    return;
  }

  // data-idx precisa ser o índice em state.trainings (a fonte que o delegate
  // resolve), NÃO em `caps` — que aqui já pode estar filtrado por data. Com o
  // filtro ativo os dois divergem e editar/excluir atingia o registro errado.
  // Mesmo padrão de renderMembers/renderUnidades.
  const ordenadas = caps.map(c => ({ c, i: state.trainings.indexOf(c) })).sort((a, b) => b.c.idRow - a.c.idRow);
  const exibidas = ordenadas.slice(0, capPage * capLimit);
  
  if (btnMore) btnMore.style.display = (ordenadas.length > exibidas.length) ? 'inline-block' : 'none';

  const fmtData   = s => (s && s !== '-') ? s.split('-').reverse().join('/') : '-';

  tbody.innerHTML = exibidas.map(({c, i}) => {
    const status = c.dataRealizada ? 'Concluída'
                 : c.dataPrevista  ? 'Em Andamento'
                 : 'Planejada';

    const [statusBg, statusColor] = CORES_STATUS[status];

    const materiaisLink = c.materiais
      ? `<a href="${c.materiais.startsWith('http') ? esc(c.materiais) : 'https://' + esc(c.materiais)}" target="_blank" rel="noopener noreferrer" style="color:#2b7fff; text-decoration:none; font-weight:500;">🔗 Acessar</a>`
      : '<span style="color:#d1d5db;">-</span>';

    const nomes = c.participantes ? nomesMembros(parseIdsResponsaveis(c.participantes)) : '';

    return `<tr>
      <td style="font-weight:500;">${esc(c.titulo)}</td>
      <td style="font-size:12px;">${esc(c.tema || '-')}</td>
      <td style="color:#4b5563; font-size:12.5px;">${esc(c.publico || '-')}</td>
      <td style="font-size:12px;">${esc(c.modalidade || '-')}</td>
      <td style="color:#4b5563;">${fmtData(c.dataPrevista)}</td>
      <td style="color:#4b5563;">${fmtData(c.dataRealizada)}</td>
      <td><span style="display:inline-block; padding:2px 8px; border-radius:12px; font-size:11.5px; font-weight:600; background:${statusBg}; color:${statusColor};">${status}</span></td>
      <td style="font-size:11.5px; color:#4b5563;">${esc(nomes || '-')}</td>
      <td style="text-align:center;">${materiaisLink}</td>
      <td><div class="cell-actions" style="justify-content:center;">
        ${iconBtn('edit','edit-capacitacao','Editar',`data-idx="${i}"`)}
        ${iconBtn('del','del-capacitacao','Excluir',`data-idx="${i}"`)}
      </div></td>
    </tr>`;
  }).join('');
}

// ------------------------------------------
// SELETOR DE PARTICIPANTES
// ------------------------------------------
function populateCapParticipantes(selectedIds = []) {
  const c = $id('cap-participantes-options');
  if (!c) return;
  const membros = membrosOrdenados();
  if (!membros.length) {
    c.innerHTML = '<div style="font-size:12px;color:#4b5563;padding:8px;">Nenhum membro cadastrado.</div>';
  } else {
    c.innerHTML = membros.map(m =>
      `<label class="checkbox-label"><input type="checkbox" value="${esc(String(m.id))}" ${selectedIds.includes(String(m.id)) ? 'checked' : ''}> ${esc(m.name)}</label>`
    ).join('');
    c.querySelectorAll('input').forEach(i => i.addEventListener('change', atualizarTagsCapParticipantes));
  }
  atualizarTagsCapParticipantes();
}

function atualizarTagsCapParticipantes() {
  const opts = $id('cap-participantes-options');
  const tags = $id('cap-participantes-tags');
  if (!opts || !tags) return;
  const checked = Array.from(opts.querySelectorAll('input:checked'));
  tags.innerHTML = checked.map(ch => {
    const m = state.members.find(x => String(x.id) === ch.value);
    return m ? `<span class="assignee-tag">${esc(m.name)}</span>` : '';
  }).join('');
}

function getIdsParticipantesSelecionados() {
  const opts = $id('cap-participantes-options');
  if (!opts) return '[]';
  return JSON.stringify(Array.from(opts.querySelectorAll('input:checked')).map(i => i.value));
}

// ------------------------------------------
// KPIs DE CAPACITAÇÕES (aba "Capacitações")
// ------------------------------------------
function renderKpisCapacitacoes() {
  const caps = Array.isArray(state.trainings) ? state.trainings : [];
  let andamento = 0, concluidas = 0;

  caps.forEach(c => {
    const status = c.dataRealizada ? 'Concluída'
                 : c.dataPrevista  ? 'Em Andamento'
                 : 'Planejada';
    if (status === 'Em Andamento') andamento++;
    else if (status === 'Concluída') concluidas++;
  });

  $id('kpi-cap-total').innerText      = caps.length;
  $id('kpi-cap-andamento').innerText  = andamento;
  $id('kpi-cap-concluidas').innerText = concluidas;
}

// ------------------------------------------
// PAINEL DE INDICADORES: gráficos de Capacitações
// Recebe o id de membro do filtro geral do Painel de Indicadores (fid) —
// quando definido, só entram capacitações em que esse membro participou.
// ------------------------------------------
function renderGraficosCapacitacoes(fid) {
  let caps = Array.isArray(state.trainings) ? state.trainings : [];
  if (fid) {
    caps = caps.filter(c => c.participantes && parseIdsResponsaveis(c.participantes).includes(String(fid)));
  }
  const yid = ($id('dashYearFilter')||{value:''}).value;
  if (yid) {
    caps = caps.filter(c => {
      const dataRef = c.dataRealizada || c.dataPrevista;
      const year = dataRef ? String(dataRef).substring(0,4) : '';
      return year === String(yid);
    });
  }

  let pMes = {}, pModalidade = {}, pTema = {};
  
  // Contagens por ID de membro (apenas ativos) para não somar juntos membros homônimos.
  const membrosGrafico = state.members.filter(m => m.ativo !== false);
  const pMembro = {}; 
  membrosGrafico.forEach(m => pMembro[m.id] = 0);

  let qtdEmAndamento = 0, qtdConcluidas = 0;

  caps.forEach(c => {
    // KPIs do Dashboard Geral
    const status = c.dataRealizada ? 'Concluída' : (c.dataPrevista ? 'Em Andamento' : 'Planejada');
    if (status === 'Em Andamento') qtdEmAndamento++;
    else if (status === 'Concluída') qtdConcluidas++;

    // Mês — datas em YYYY-MM-DD
    const dataRef = c.dataRealizada || c.dataPrevista;
    if (dataRef) {
      const p = dataRef.split('-');
      if (p.length === 3) {
        const mesAno = p[1] + '/' + p[0]; // MM/YYYY
        pMes[mesAno] = (pMes[mesAno] || 0) + 1;
      }
    }

    // Modalidade
    const mod = c.modalidade || 'Não Definida';
    pModalidade[mod] = (pModalidade[mod] || 0) + 1;

    // Tema
    const tema = c.tema || 'Não Definido';
    pTema[tema] = (pTema[tema] || 0) + 1;

    // Participantes → contar capacitações por membro ATIVO
    if (c.participantes) {
      parseIdsResponsaveis(c.participantes).forEach(id => {
        if (id in pMembro) pMembro[id]++;
      });
    }
  });

  // Atualizar KPIs do Painel Geral
  const elDashCap = $id('kpi-dash-cap');
  if (elDashCap) elDashCap.innerText = qtdEmAndamento;
  const elDashCapConc = $id('kpi-dash-cap-conc');
  if (elDashCapConc) elDashCapConc.innerText = qtdConcluidas;

  [capMesChartInst, capModalidadeChartInst, capMembroChartInst, capTemaChartInst].forEach(c => { if (c) c.destroy(); });

  // Gráfico: Capacitações por Mês (chaves ordenadas cronologicamente, formato MM/YYYY)
  const chavesMes = Object.keys(pMes).sort((a, b) => {
    const [ma, ya] = a.split('/'), [mb, yb] = b.split('/');
    return (ya + ma).localeCompare(yb + mb);
  });
  const cMes = $id('capMesChart');
  const dadosMes = chavesMes.map(k => pMes[k]);
  if (cMes) {
    const ctxMes = cMes.getContext('2d');
    const gradMes = ctxMes.createLinearGradient(0, 0, 0, 260);
    gradMes.addColorStop(0, 'rgba(122,108,221,0.28)');
    gradMes.addColorStop(1, 'rgba(122,108,221,0)');
    capMesChartInst = new Chart(ctxMes, {
      type: 'line',
      data: {
        labels: chavesMes,
        datasets: [{
          label: 'Capacitações',
          data: dadosMes,
          borderColor: '#7A6CDD', backgroundColor: gradMes, fill: true,
          tension: 0.4, borderWidth: 2.5,
          pointRadius: 0, pointHoverRadius: 5, pointHitRadius: 12,
          pointHoverBackgroundColor: '#7A6CDD', pointHoverBorderColor: '#fff', pointHoverBorderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed.y} capacitação(ões)` } }, datalabels: { display: false } },
        scales: CHART_SCALES_BASE
      }
    });
  }

  // Gráfico: Capacitações por Modalidade
  const cMod = $id('capModalidadeChart');
  if (cMod) capModalidadeChartInst = new Chart(cMod.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(pModalidade),
      datasets: [{ data: Object.values(pModalidade), backgroundColor: ['#3D8FC4','#2CA98F','#D2596F','#7A6CDD','#E0904A'], borderWidth: 2, borderColor: '#fff', hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '66%',
      plugins: { legend: CHART_LEGEND_BASE, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed} capacitação(ões)` } }, datalabels: { ...CHART_DATALABELS_BASE, color: '#030712' } }
    }
  });

  // Gráfico: Capacitações por Tema
  const cTema = $id('capTemaChart');
  if (cTema) capTemaChartInst = new Chart(cTema.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(pTema),
      datasets: [{ data: Object.values(pTema), backgroundColor: ['#C99A2E','#D8483A','#6B9B37','#1E9AA3','#A94FA0','#55647A'], borderWidth: 2, borderColor: '#fff', hoverOffset: 6 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '66%',
      plugins: { legend: CHART_LEGEND_BASE, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed} capacitação(ões)` } }, datalabels: { ...CHART_DATALABELS_BASE, color: '#030712' } }
    }
  });

  // Gráfico: Capacitações por Membro
  // Mapeamos de volta para os Nomes usando membrosGrafico
  const nomesMembros = membrosGrafico.map(m => m.name);
  const dadosMembros = membrosGrafico.map(m => pMembro[m.id]);

  const cMembro = $id('capMembroChart');
  const maxMembro = Math.max(0, ...dadosMembros);
  if (cMembro) capMembroChartInst = new Chart(cMembro.getContext('2d'), {
    type: 'bar',
    data: {
      labels: nomesMembros,
      datasets: [{
        label: 'Capacitações',
        data: dadosMembros,
        backgroundColor: '#A94FA0',
        borderWidth: 0, borderRadius: 20, borderSkipped: false, maxBarThickness: 26
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed.y} capacitação(ões)` } }, datalabels: { display: false } },
      scales: CHART_SCALES_BASE
    }
  });
}

// Fragmento do relatório do Painel de Indicadores com os 4 gráficos de
// Capacitações (viram imagem estática, já que Chart.js não roda no servidor).
function graficosCapacitacoesPdfHtml() {
  return `<table style="margin-bottom:14px;"><tr>${_pdfGraficoCel('Volume de Capacitações ao Longo do Ano','capMesChart')}${_pdfGraficoCel('Volume de Capacitações por Tema','capTemaChart')}</tr></table>` +
    `<table style="margin-bottom:18px;"><tr>${_pdfGraficoCel('Distribuição por Modalidade de Treinamento','capModalidadeChart')}${_pdfGraficoCel('Volume de Capacitações por Membro','capMembroChart')}</tr></table>`;
}

// ------------------------------------------
// INTERAÇÕES E MODAIS
// ------------------------------------------
document.addEventListener('DOMContentLoaded', () => {
  const btnNovaCap = $id('btn-nova-capacitacao');
  if (btnNovaCap) btnNovaCap.addEventListener('click', abrirModalCapacitacaoNova);

  const btnSalvarCap = $id('btn-salvar-capacitacao');
  if (btnSalvarCap) btnSalvarCap.addEventListener('click', salvarFormCapacitacao);

  const btnLoadMoreCap = $id('btn-load-more-cap');
  if (btnLoadMoreCap) btnLoadMoreCap.addEventListener('click', () => { capPage++; renderCapacitacoes(); });

  const fIni = $id('f-cap-data-ini'), fFim = $id('f-cap-data-fim');
  if (fIni) fIni.addEventListener('change', () => renderCapacitacoes(true));
  if (fFim) fFim.addEventListener('change', () => renderCapacitacoes(true));

  // Toggle dropdown de participantes
  const trigger = $id('cap-participantes-trigger');
  if (trigger) trigger.addEventListener('click', () => {
    $id('cap-participantes-options').classList.toggle('show');
  });
});

let capIdOriginal = '';

function abrirModalCapacitacaoNova() {
  $id('cap-idrow').value          = '';
  capIdOriginal                   = '';
  $id('cap-titulo').value         = '';
  $id('cap-tema').value           = '';
  $id('cap-modalidade').value     = '';
  $id('cap-publico').value        = '';
  $id('cap-data-prevista').value  = '';
  $id('cap-data-realizada').value = '';
  $id('cap-materiais').value      = '';
  populateCapParticipantes([]);

  $id('modal-capacitacao-title').innerText = 'Nova Capacitação';
  abrirModal('modal-capacitacao');
}

function abrirEditarCapacitacao(obj) {
  $id('cap-idrow').value          = obj.idRow;
  capIdOriginal                   = obj.id;
  $id('cap-titulo').value         = obj.titulo;
  $id('cap-tema').value           = obj.tema      || '';
  $id('cap-modalidade').value     = obj.modalidade || '';
  $id('cap-publico').value        = obj.publico    || '';
  $id('cap-data-prevista').value  = obj.dataPrevista  || '';
  $id('cap-data-realizada').value = obj.dataRealizada || '';
  $id('cap-materiais').value      = obj.materiais || '';
  populateCapParticipantes(obj.participantes ? parseIdsResponsaveis(obj.participantes) : []);

  $id('modal-capacitacao-title').innerText = 'Editar Capacitação';
  abrirModal('modal-capacitacao');
}

function salvarFormCapacitacao() {
  const btn   = $id('btn-salvar-capacitacao');
  const idRow = $id('cap-idrow').value;

  const dados = {
    idRow,
    idEsperado:    capIdOriginal,
    titulo:        $id('cap-titulo').value.trim(),
    tema:          $id('cap-tema').value,
    publico:       $id('cap-publico').value.trim(),
    modalidade:    $id('cap-modalidade').value,
    dataPrevista:  $id('cap-data-prevista').value,
    dataRealizada: $id('cap-data-realizada').value,
    materiais:     $id('cap-materiais').value.trim(),
    participantes: getIdsParticipantesSelecionados()
  };

  if (!dados.titulo) return showAlerta('O Título é obrigatório.');

  btn.disabled = true;
  btn.innerText = idRow ? 'Atualizando...' : 'Salvando...';

  function tratarRespostaCap(r) {
    if (r.sucesso) {
      if (idRow) {
        const idx = state.trainings.findIndex(c => String(c.idRow) === String(idRow));
        if (idx >= 0) state.trainings[idx] = { ...state.trainings[idx], ...dados };
      } else {
        state.trainings.push({ ...dados, idRow: r.novaLinha, id: r.novoId });
      }
      fecharModal('modal-capacitacao');
      // Render otimista imediato e, quando o dado real do servidor chegar,
      // re-render (o merge otimista não tem os campos normalizados pelo
      // servidor). Sem o callback, state.trainings era substituído por baixo da
      // tabela sem redesenhá-la. Mesmo padrão de excluirCapacitacaoConfirm.
      renderCapacitacoes();
      renderKpisCapacitacoes();
      if (currentTab === 'indicadores') renderIndicadores();
      recarregarCapacitacoes(() => {
        renderCapacitacoes();
        renderKpisCapacitacoes();
        if (currentTab === 'indicadores') renderIndicadores();
      });
      feedbackBtn(btn, '✅ Salvo!', 'Salvar', null);
    }
    else { btn.disabled = false; btn.innerText = 'Salvar'; showAlerta(r.mensagem); }
  }

  if (idRow)
    google.script.run.withSuccessHandler(tratarRespostaCap).withFailureHandler(falha(btn, 'Salvar', null)).atualizarCapacitacao(dados);
  else
    google.script.run.withSuccessHandler(tratarRespostaCap).withFailureHandler(falha(btn, 'Salvar', null)).salvarCapacitacao(dados);
}

function recarregarCapacitacoes(cb) {
  google.script.run
    .withSuccessHandler(trainings => { state.trainings = trainings; if (cb) cb(); })
    .withFailureHandler(e => showAlerta('Falha ao sincronizar capacitações: ' + String(e)))
    .getCapacitacoesData();
}

function excluirCapacitacaoConfirm(idRow, id) {
  google.script.run
    .withSuccessHandler(r => {
      if (r && r.sucesso === false) { showAlerta(r.mensagem); return; }
      recarregarCapacitacoes(() => { renderCapacitacoes(); renderKpisCapacitacoes(); if (currentTab === 'indicadores') renderIndicadores(); });
    })
    .withFailureHandler(e => showAlerta(String(e)))
    .excluirCapacitacao(idRow, id);
}

</script>
