<script>
// ==========================================
// JS_Kanban.html — Módulo 1: Tarefas e Dashboard
// ==========================================

// ---------- Membros ----------
function sincronizarDropdownMembros() {
  const opcoes = optsMembros();
  ['memberFilterSelect','dashMemberFilter'].forEach(id => {
    const el = $id(id); if(!el) return;
    const v = el.value;
    el.innerHTML = opcoes;
    if(v) el.value = v;
  });
}

function renderMembers() {
  const tbody = $id('members-list');
  if(!tbody) return;
  const mostrarInativos = ($id('chk-membros-inativos')||{checked:false}).checked;
  // Índice ORIGINAL em state.members (usado pelos botões) preservado via indexOf.
  const visiveis = state.members.filter(m => mostrarInativos || m.ativo !== false);
  if(!visiveis.length) {
    tbody.innerHTML='<tr><td colspan="5" class="msg-empty">Nenhum membro '+(mostrarInativos?'':'ativo ')+'cadastrado.</td></tr>';
    return;
  }
  const ordenados = visiveis
    .map(m => ({ m, i: state.members.indexOf(m) }))
    .sort((a, b) => (a.m.name||'').localeCompare(b.m.name||'', 'pt-BR', { sensitivity: 'base' }));
  tbody.innerHTML = ordenados.map(({m, i}) => {
    const inativo = m.ativo === false;
    const btnStatus = inativo
      ? iconBtn('check', 'reativar-membro', 'Reativar membro', `data-idx="${i}"`)
      : `${iconBtn('edit','edit-membro','Editar',`data-idx="${i}"`)}${iconBtn('ban','inativar-membro','Inativar membro',`data-idx="${i}"`)}`;
    return `<tr${inativo?' style="opacity:0.6;"':''}>
    <td style="font-weight:600;">${esc(m.name)}${inativo?' <span class="tag-badge" style="background:#94a3b8;font-size:10px;margin-left:4px;">Inativo</span>':''}</td>
    <td><span class="member-role-badge">${esc(m.role)}</span></td>
    <td style="color:#64748b;">${esc(m.email)||'-'}</td>
    <td style="color:#64748b;">${esc(m.emailPessoal)||'-'}</td>
    <td style="text-align:right;">
      <div class="cell-actions" style="justify-content:flex-end;">${btnStatus}</div>
    </td>
  </tr>`;
  }).join('');
}

function abrirModalMembro() {
  $id('memberId').value=''; $id('memberName').value=''; $id('memberRole').value=''; $id('memberEmail').value=''; $id('memberEmailPessoal').value='';
  $id('modal-member-title').innerText='Novo Membro';
  abrirModal('modal-member');
}
function abrirEditarMembro(m) {
  $id('memberId').value=m.id; $id('memberName').value=m.name; $id('memberRole').value=m.role; $id('memberEmail').value=m.email||''; $id('memberEmailPessoal').value=m.emailPessoal||'';
  $id('modal-member-title').innerText='Editar Membro';
  abrirModal('modal-member');
}
function salvarMembro() {
  const btn=$id('btn-save-member');
  const dados={ id:$id('memberId').value, name:($id('memberName').value||'').trim(), role:($id('memberRole').value||'').trim(), email:($id('memberEmail').value||'').trim(), emailPessoal:($id('memberEmailPessoal').value||'').trim() };
  if(!dados.name||!dados.role||!dados.email||!dados.emailPessoal){ showAlerta('Preencha todos os campos.'); return; }
  btn.disabled=true; btn.innerText='Salvando...';
  google.script.run.withSuccessHandler(r=>{
    if (r && r.sucesso === false) { btn.disabled=false; btn.innerText='Salvar Cadastro'; showAlerta(r.mensagem || 'Não foi possível salvar.'); return; }
    feedbackBtn(btn,'✅ Salvo!','Salvar Cadastro',()=>{ fecharModal('modal-member'); recarregarKanban(()=>{ renderMembers(); sincronizarDropdownMembros(); }); });
  }).withFailureHandler(falha(btn,'Salvar Cadastro',null)).saveMember(dados);
}
// Membros são inativados/reativados (nunca excluídos), preservando o histórico.
// Atualização otimista: a tela reflete a mudança na hora; só reverte se o servidor falhar.
function inativarMembro(id) {
  const m = state.members.find(x => String(x.id) === String(id));
  if (m) m.ativo = false;
  renderMembers(); sincronizarDropdownMembros();
  google.script.run.withSuccessHandler(r=>{
    if (r && r.sucesso === false) { 
      if (m) m.ativo = true;
      renderMembers(); sincronizarDropdownMembros();
      showAlerta(r.mensagem || 'Não foi possível inativar.'); 
    }
  }).withFailureHandler(e=>{
    if (m) m.ativo = true;
    renderMembers(); sincronizarDropdownMembros();
    showAlerta(String(e));
  }).inativarMembro(id);
}
function reativarMembro(id) {
  const m = state.members.find(x => String(x.id) === String(id));
  if (m) m.ativo = true;
  renderMembers(); sincronizarDropdownMembros();
  google.script.run.withSuccessHandler(r=>{
    if (r && r.sucesso === false) { 
      if (m) m.ativo = false;
      renderMembers(); sincronizarDropdownMembros();
      showAlerta(r.mensagem || 'Não foi possível reativar.'); 
    }
  }).withFailureHandler(e=>{
    if (m) m.ativo = false;
    renderMembers(); sincronizarDropdownMembros();
    showAlerta(String(e));
  }).reativarMembro(id);
}

// ---------- Kanban Board ----------
function renderTasks() {
  const listas = { 'Backlog':'list-backlog','A Fazer':'list-todo','Em Andamento':'list-inprogress','Em Revisão':'list-review','Concluído':'list-done' };
  const counts = {};
  // Um innerHTML por COLUNA no fim, em vez de um createElement + innerHTML +
  // appendChild por CARTÃO (que fazia um parse de HTML e uma inserção na árvore
  // viva por cartão, a cada troca de aba, filtro e arrastar). Os containers são
  // resolvidos uma única vez aqui.
  const els = {}, htmlPorLista = {};
  Object.keys(listas).forEach(s => { els[s]=$id(listas[s]); htmlPorLista[s]=''; counts[s]=0; });
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const filterId = (() => { const el=$id('memberFilterSelect'); return el?el.value:''; })();

  state.tasks.forEach((task,i) => {
    if (task.archived) return; // arquivados não aparecem no quadro
    const status = task.status||'Backlog';
    if(!listas[status]) return;
    const ids = parseIdsResponsaveis(task.assigneeId);
    if(filterId && !ids.includes(String(filterId))) return;
    counts[status]++;
    const nomes = nomesMembros(ids)||'Sem responsável';
    let vencido=false, dtDisplay='';
    if(task.deadline){ const p=task.deadline.split('-'); if(p.length===3){ const d=new Date(+p[0],+p[1]-1,+p[2]); d.setHours(0,0,0,0); dtDisplay=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); if(d<hoje && status!=='Concluído') vencido=true; } }
    let age='Fila (0d)';
    if(status!=='Backlog'){ const ref=task.startDate||task.creationDate; if(ref){ const p=ref.split('-'); if(p.length===3){ const s=new Date(+p[0],+p[1]-1,+p[2]); s.setHours(0,0,0,0); let end=hoje; if(status==='Concluído'&&task.completionDate){ const cp=task.completionDate.split('-'); if(cp.length===3){end=new Date(+cp[0],+cp[1]-1,+cp[2]); end.setHours(0,0,0,0);} } const d=Math.floor((end-s)/86400000); age=d<=0?(status==='Concluído'?'Fechado hoje':'Iniciado hoje'):(status==='Concluído'?`Fechado em ${d}d`:`Correndo há ${d}d`); } } }
    const chips=labelChipsHTML(parseLabels(task.labels));
    // commentCount vem pronto do servidor: o quadro não recebe mais o histórico
    // dos cartões (só a contagem), então não há JSON para parsear aqui.
    const nComments = task.commentCount || 0;
    const comentariosHtml = nComments>0 ? `<span class="card-comments" title="${nComments} comentário(s)">${ICON.comment}${nComments}</span>` : '';
    // dragstart é delegado em .list-cards (ver JS_Utilitarios) — o cartão só
    // precisa carregar data-id, como o drop já esperava.
    htmlPorLista[status] +=
      `<div class="card prio-${esc(task.priority)}${vencido?' overdue':''}" draggable="true" data-id="${esc(task.id)}" data-idx="${i}">`+
        `<button class="btn-edit-card" data-acao="edit-card" data-idx="${i}" title="Abrir cartão">${ICON.edit}</button>`+
        `${chips?`<div class="card-labels">${chips}</div>`:''}`+
        `<div class="card-title">${esc(task.title)}</div>`+
        `<div class="card-assignee">${ICON.user} ${esc(nomes)}</div>`+
        `<div class="card-meta">`+
          `<span class="card-meta-left"><span class="meta-item">${ICON.clock} ${age}</span>${vencido?`<span class="meta-item meta-overdue">${ICON.alert} Atrasado</span>`:''}</span>`+
          `<span class="card-meta-right">${comentariosHtml}${dtDisplay?`<span class="meta-item">${ICON.calendar} ${dtDisplay}</span>`:''}</span>`+
        `</div>`+
      `</div>`;
  });
  Object.keys(listas).forEach(s => { if(els[s]) els[s].innerHTML = htmlPorLista[s]; });
  Object.keys(counts).forEach(s => { const cnt=$id('cnt-'+{'Backlog':'backlog','A Fazer':'todo','Em Andamento':'inprogress','Em Revisão':'review','Concluído':'done'}[s]); if(cnt) cnt.innerText=counts[s]; });
}

function drop(e, newStatus) {
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain');
  const idx=state.tasks.findIndex(t=>String(t.id)===String(id));
  if(idx<0) return;
  const task=state.tasks[idx];
  if(task.status===newStatus) return;
  const dateNow=hojeISO();
  state.tasks[idx].status=newStatus;
  if(newStatus==='Concluído') state.tasks[idx].completionDate=dateNow; else state.tasks[idx].completionDate='';
  if(newStatus!=='Backlog'&&!state.tasks[idx].startDate) state.tasks[idx].startDate=dateNow;
  renderTasks();
  google.script.run.withSuccessHandler(r=>{
    // Em falha de negócio (ex.: cartão excluído por outro usuário), desfaz a
    // mudança otimista recarregando o estado real do servidor.
    if (r && r.sucesso === false) { showAlerta(r.mensagem || 'Não foi possível mover o cartão.'); recarregarKanban(renderTasks); }
  }).withFailureHandler(e=>{ showAlerta(String(e)); recarregarKanban(renderTasks); }).updateTaskStatus(id, newStatus);
}

// ---------- Arquivados ----------
let archivedPage = 1;
const archivedLimit = 20;

function renderArquivados(resetPage = false) {
  if (resetPage) archivedPage = 1;
  const tbody = $id('archived-list');
  if (!tbody) return;

  // Sincroniza o dropdown de membros deste filtro (ordem alfabética)
  const selMembro = $id('f-archived-membro');
  if (selMembro) {
    const v = selMembro.value;
    selMembro.innerHTML = optsMembros();
    if (v) selMembro.value = v;
  }
  const filtroMembro = selMembro ? selMembro.value : '';

  const ini = $id('f-archived-data-ini') ? $id('f-archived-data-ini').value : '';
  const fim = $id('f-archived-data-fim') ? $id('f-archived-data-fim').value : '';

  // state.archivedTasks tem busca própria (getTarefasArquivadas), sob demanda
  // na primeira visita a esta aba. Antes saía de state.tasks.filter(archived),
  // o que obrigava o quadro a trafegar TODOS os cartões já criados a cada ação.
  let arquivados = (state.archivedTasks || []).slice();

  if (filtroMembro) {
    arquivados = arquivados.filter(t => parseIdsResponsaveis(t.assigneeId).includes(String(filtroMembro)));
  }

  if (ini || fim) {
    arquivados = arquivados.filter(t => {
      const d = t.completionDate;
      if (!d) return false;
      if (ini && d < ini) return false;
      if (fim && d > fim) return false;
      return true;
    });
  }

  const btnMore = $id('btn-load-more-archived');

  if (!arquivados.length) { 
    tbody.innerHTML = '<tr><td colspan="7" class="msg-empty">Nenhum cartão arquivado encontrado.</td></tr>'; 
    if (btnMore) btnMore.style.display = 'none';
    return; 
  }

  const hoje = new Date(); hoje.setHours(0,0,0,0);
  // Mais recentemente concluídos primeiro
  arquivados.sort((a,b) => (b.completionDate||'').localeCompare(a.completionDate||''));

  const exibidos = arquivados.slice(0, archivedPage * archivedLimit);
  if (btnMore) btnMore.style.display = (arquivados.length > exibidos.length) ? 'inline-block' : 'none';

  tbody.innerHTML = exibidos.map(task => {
    const nomes = nomesMembros(parseIdsResponsaveis(task.assigneeId))||'Sem responsável';

    let duracao = '-';
    if (task.startDate && task.completionDate) {
      const sp = task.startDate.split('-'), ep = task.completionDate.split('-');
      if (sp.length === 3 && ep.length === 3) {
        const s = new Date(+sp[0],+sp[1]-1,+sp[2]), e = new Date(+ep[0],+ep[1]-1,+ep[2]);
        const d = Math.floor((e - s) / 86400000);
        if (d >= 0) duracao = `${d} dia${d !== 1 ? 's' : ''}`;
      }
    }
    const prioColor = task.priority==='Alta'?'#ef4444':task.priority==='Media'?'#f59e0b':'#22c55e';

    return `<tr>
      <td style="font-weight:600;" title="${esc(task.title)}">${esc(task.title)}</td>
      <td>${esc(nomes)}</td>
      <td style="text-align:center;"><span class="tag-badge" style="background:${prioColor};">${esc(task.priority === 'Media' ? 'Média' : task.priority)}</span></td>
      <td>${fmtBr(task.startDate)}</td>
      <td>${fmtBr(task.completionDate)}</td>
      <td style="text-align:center;font-weight:600;color:#475569;">${duracao}</td>
      <td class="no-print" style="text-align:center;"><button class="btn-icon rev" title="Restaurar ao quadro" data-acao="restore-task" data-id="${esc(task.id)}">${ICON.rev}</button></td>
    </tr>`;
  }).join('');
}

function confirmarArquivarTarefa() {
  const id = $id('taskId').value;
  if (!id) return;
  showConfirm('Arquivar este cartão? Ele sai do quadro e vai para "Arquivados", de onde pode ser restaurado a qualquer momento.', function() {
    const btn = $id('btn-archive-task');
    if (btn) { btn.disabled = true; btn.innerText = 'A arquivar...'; }
    google.script.run.withSuccessHandler(function(r) {
      if (r.sucesso) {
        // O cartão sai do quadro (state.tasks) e a lista de arquivados passa a
        // estar desatualizada — invalidar faz a próxima visita à aba relê-la.
        const idx = state.tasks.findIndex(t => String(t.id) === String(id));
        if (idx >= 0) state.tasks.splice(idx, 1);
        invalidarArquivados();
        fecharModal('modal-task');
        renderTasks();
      } else {
        showAlerta(r.mensagem);
        if (btn) { btn.disabled = false; btn.innerText = 'Arquivar'; }
      }
    }).withFailureHandler(falha(btn, 'Arquivar', null)).arquivarTarefaManual(id);
  }, { tone: 'warning' });
}

function restaurarTarefa(id) {
  showConfirm('Restaurar este cartão de volta ao quadro Kanban?', function(fechar) {
    google.script.run.withSuccessHandler(function(r) {
      if (r.sucesso) {
        // Sai da lista de arquivados na hora (sem nova ida ao servidor); o
        // quadro precisa reler porque o cartão restaurado não está em
        // state.tasks — getKanbanData só devolve os ativos.
        const idx = (state.archivedTasks || []).findIndex(t => String(t.id) === String(id));
        if (idx >= 0) state.archivedTasks.splice(idx, 1);
        renderArquivados();
        recarregarKanban(renderTasks);
        fechar('Restaurado!');
      } else {
        showAlerta(r.mensagem);
        fechar();
      }
    }).withFailureHandler(e => {
      showAlerta(String(e));
      fechar();
    }).restaurarTarefaArquivada(id);
  }, { tone: 'restore', loadingText: 'A restaurar...' });
}

// ---------- Modal Tarefa ----------
// Etiquetas pré-definidas (paleta fixa, orientada à gestão da qualidade).
const LABELS_DISPONIVEIS = [
  { id:'auditoria',    nome:'Auditoria',        cor:'#2563eb' },
  { id:'nc',           nome:'Não Conformidade', cor:'#dc2626' },
  { id:'melhoria',     nome:'Melhoria',         cor:'#16a34a' },
  { id:'documentacao', nome:'Documentação',     cor:'#7c3aed' },
  { id:'treinamento',  nome:'Treinamento',      cor:'#ea580c' },
  { id:'urgente',      nome:'Urgente',          cor:'#db2777' }
];
function parseLabels(raw) {
  try { const a=JSON.parse(raw); return Array.isArray(a)?a.map(String):[]; } catch(e){ return []; }
}
function labelChipsHTML(ids) {
  return ids.map(id=>{ const l=LABELS_DISPONIVEIS.find(x=>x.id===id); return l?`<span class="label-chip" style="background:${l.cor};">${esc(l.nome)}</span>`:''; }).join('');
}
function populateLabels(selectedIds=[]) {
  const c=$id('taskLabelsContainer'); if(!c) return;
  c.innerHTML=LABELS_DISPONIVEIS.map(l=>`<label class="checkbox-label"><input type="checkbox" value="${l.id}" ${selectedIds.includes(l.id)?'checked':''}><span class="tag-badge" style="background:${l.cor};">${esc(l.nome)}</span></label>`).join('');
  c.querySelectorAll('input').forEach(i=>i.addEventListener('change',atualizarTagsLabels));
  atualizarTagsLabels();
}
function atualizarTagsLabels() {
  const checked=Array.from(($id('taskLabelsContainer')||{querySelectorAll:()=>[]}).querySelectorAll('input:checked')).map(c=>c.value);
  const tags=$id('selected-labels-tags'); if(tags) tags.innerHTML=labelChipsHTML(checked);
}
function populateAssignees(selectedIds=[]) {
  const c=$id('taskAssigneesContainer'); if(!c) return;
  // Ativos + eventuais membros inativos JÁ atribuídos a este cartão (para não
  // removê-los silenciosamente ao editar). Novos cartões só veem ativos.
  let lista = membrosOrdenados();
  const faltando = (selectedIds||[]).map(String).filter(id => !lista.some(m=>String(m.id)===id));
  if (faltando.length) lista = lista.concat(state.members.filter(m => faltando.includes(String(m.id))));
  if(!lista.length){ c.innerHTML='<div style="font-size:12px;color:#64748b;padding:8px;">Nenhum membro cadastrado.</div>'; atualizarTagsAssignee(); return; }
  c.innerHTML=lista.map(m=>`<label class="checkbox-label"><input type="checkbox" value="${esc(m.id)}" ${selectedIds.includes(String(m.id))?'checked':''}> ${esc(m.name)}${m.ativo===false?' <span style="color:#94a3b8;font-size:11px;">(inativo)</span>':''}</label>`).join('');
  c.querySelectorAll('input').forEach(i=>i.addEventListener('change',atualizarTagsAssignee));
  atualizarTagsAssignee();
}
function atualizarTagsAssignee() {
  const checked=Array.from(($id('taskAssigneesContainer')||{querySelectorAll:()=>[]}).querySelectorAll('input:checked'));
  const tags=$id('selected-assignees-tags'); if(!tags) return;
  tags.innerHTML=checked.map(c=>{ const m=state.members.find(x=>String(x.id)===c.value); return m?`<span class="assignee-tag">${esc(m.name)}</span>`:''; }).join('');
}
function abrirModalTarefa(status) {
  ['taskId','taskTitle','taskDesc','taskDeadline','taskCreation','taskCompletion','taskStartDate','taskUpdatedAt'].forEach(id=>{ const el=$id(id); if(el) el.value=''; });
  if($id('taskStatus')) $id('taskStatus').value=status;
  if($id('taskStatusDisplay')) $id('taskStatusDisplay').innerText=status;
  if($id('taskPriority')) $id('taskPriority').value='';
  if($id('taskNewComment')) $id('taskNewComment').value='';
  if($id('btn-delete-task')) $id('btn-delete-task').style.display='none';
  if($id('btn-archive-task')) { const b=$id('btn-archive-task'); b.style.display='none'; b.disabled=false; b.innerText='Arquivar'; }
  if($id('sidebar-add-title')) $id('sidebar-add-title').style.display='block';
  currentActivities=[]; renderActividades();
  populateAssignees([]);
  populateLabels([]);
  abrirModal('modal-task');
  setTimeout(()=>{ const tf=$id('taskTitle'); if(tf){tf.style.height='auto';tf.style.height=tf.scrollHeight+'px';} },10);
}
function abrirEditarTarefa(task) {
  if(!task) return;
  $id('taskId').value=task.id; $id('taskStatus').value=task.status; $id('taskStatusDisplay').innerText=task.status;
  $id('taskTitle').value=task.title; $id('taskDesc').value=task.description; $id('taskPriority').value=task.priority;
  $id('taskDeadline').value=task.deadline||''; $id('taskCreation').value=task.creationDate||''; $id('taskCompletion').value=task.completionDate||''; $id('taskStartDate').value=task.startDate||'';
  // Carimbo capturado agora: usado por salvarTarefa() para o servidor detectar
  // se este cartão foi alterado por outra pessoa enquanto o editor ficou aberto.
  $id('taskUpdatedAt').value=task.updatedAt||'';
  if($id('taskNewComment')) $id('taskNewComment').value='';
  if($id('btn-delete-task')) $id('btn-delete-task').style.display='block';
  if($id('btn-archive-task')) {
    const b=$id('btn-archive-task');
    b.disabled=false; b.innerText='Arquivar';
    b.style.display = (task.status === 'Concluído') ? 'block' : 'none';
  }
  if($id('sidebar-add-title')) $id('sidebar-add-title').style.display='none';
  let sel=[]; try{ sel=JSON.parse(task.assigneeId); if(!Array.isArray(sel)) sel=[task.assigneeId]; }catch(e){ sel=task.assigneeId?[String(task.assigneeId)]:[];}
  populateAssignees(sel);
  populateLabels(parseLabels(task.labels));
  // O histórico não vem mais no payload do quadro — é buscado agora, para este
  // cartão só. atividadesTaskId guarda de qual cartão é a busca em voo: sem
  // isso, abrir o cartão A e trocar rápido para o B faria a resposta (mais
  // lenta) de A sobrescrever o histórico de B na tela.
  currentActivities=[];
  atividadesTaskId = task.id || null;
  renderActividades('A carregar histórico...');
  if (task.id) {
    google.script.run
      .withSuccessHandler(function(acts){
        if (atividadesTaskId !== task.id) return; // outro cartão já foi aberto
        currentActivities = Array.isArray(acts) ? acts : [];
        renderActividades();
      })
      .withFailureHandler(function(e){
        if (atividadesTaskId !== task.id) return;
        renderActividades('Falha ao carregar o histórico: ' + String(e));
      })
      .getAtividadesTarefa(task.id);
  } else {
    renderActividades();
  }
  abrirModal('modal-task');
  setTimeout(()=>{ const tf=$id('taskTitle'); if(tf){tf.style.height='auto';tf.style.height=tf.scrollHeight+'px';} },10);
}
// msgEstado: usado enquanto o histórico é buscado (ou se a busca falhar) —
// sem isso, o feed mostraria "Nenhuma atividade registrada" durante a carga,
// afirmando algo falso sobre o cartão.
function renderActividades(msgEstado) {
  const feed=$id('activity-feed'); if(!feed) return;
  if(msgEstado){ feed.innerHTML='<div style="font-size:12px;color:#5e6c84;padding-left:10px;">'+esc(msgEstado)+'</div>'; return; }
  if(!currentActivities.length){ feed.innerHTML='<div style="font-size:12px;color:#5e6c84;padding-left:10px;">Nenhuma atividade registrada.</div>'; return; }
  feed.innerHTML=[...currentActivities].reverse().map(a=>`<div class="hist-item"><div class="hist-date">${a.author?`<span class="hist-author">${esc(a.author)}</span> · `:''}${esc(a.date)}</div><div class="hist-action">${a.type==='comment'?'<strong>Comentou:</strong> ':''}${esc(a.text)}</div></div>`).join('');
}
function adicionarComentario() {
  const box=$id('taskNewComment'); if(!box) return;
  const txt=box.value.trim(); if(!txt) return;
  // Mesmo formato de getNowTimestamp() ('dd/MM/yyyy HH:mm'). Esta data é só
  // para o feed mostrar o comentário na hora — quem grava é o servidor, com o
  // carimbo dele. Antes usava ' às ' e o feed exibia um formato antes de salvar
  // e outro ao reabrir o cartão.
  const agora=new Date(); const dt=agora.toLocaleDateString('pt-BR')+' '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  // _novo sinaliza ao servidor que este comentário precisa receber o autor
  currentActivities.push({type:'comment',text:txt,date:dt,_novo:true});
  box.value=''; renderActividades();
}
function salvarTarefa() {
  const titulo=($id('taskTitle')||{value:''}).value.trim();
  if(!titulo){ showAlerta('O título do cartão é obrigatório.'); return; }
  adicionarComentario();
  const btn=$id('btn-save-task'); btn.disabled=true; btn.innerText='Salvando...';
  const ids=Array.from(($id('taskAssigneesContainer')||{querySelectorAll:()=>[]}).querySelectorAll('input:checked')).map(c=>c.value);
  const labels=Array.from(($id('taskLabelsContainer')||{querySelectorAll:()=>[]}).querySelectorAll('input:checked')).map(c=>c.value);
  // Só os comentários NOVOS sobem: o histórico existente vive na aba
  // Atividades e o servidor apenas acrescenta. Antes subia o histórico inteiro
  // a cada salvamento, só para o servidor filtrar os _novo e descartar o resto.
  const novosComentarios = currentActivities.filter(a => a && a._novo);
  const dados={ id:$id('taskId').value, status:$id('taskStatus').value||'Backlog', title:titulo, description:$id('taskDesc').value||'', assigneeId:JSON.stringify(ids), priority:$id('taskPriority').value||'Media', labels:JSON.stringify(labels), deadline:$id('taskDeadline').value||'', creationDate:$id('taskCreation').value||'', completionDate:$id('taskCompletion').value||'', startDate:$id('taskStartDate').value||'', activities:JSON.stringify(novosComentarios), updatedAt:$id('taskUpdatedAt').value||'' };
  google.script.run.withSuccessHandler(r=>{
    if (r && r.sucesso === false) { btn.disabled=false; btn.innerText='Salvar Cartão'; showAlerta(r.mensagem || 'Não foi possível salvar o cartão.'); return; }
    // Só fecha o modal depois que o quadro já foi atualizado — antes disso o
    // modal sumia primeiro e o cartão só aparecia depois da releitura da
    // planilha, dando a impressão de que o cartão tinha sumido.
    recarregarKanban(()=>{ renderTasks(); btn.disabled=false; btn.innerText='Salvar Cartão'; fecharModal('modal-task'); });
  }).withFailureHandler(falha(btn,'Salvar Cartão',null)).saveTask(dados);
}
function confirmarExcluirTarefa() {
  showConfirm('Excluir este cartão e todo o seu histórico?', ()=>{
    const id=$id('taskId').value;
    google.script.run.withSuccessHandler(r=>{
      if (r && r.sucesso === false) { showAlerta(r.mensagem || 'Não foi possível excluir o cartão.'); return; }
      // Atualiza o estado local direto — evita uma segunda ida ao servidor
      // (mesmo padrão de confirmarArquivarTarefa/restaurarTarefa, logo acima)
      const idx = state.tasks.findIndex(t => String(t.id) === String(id));
      if (idx >= 0) state.tasks.splice(idx, 1);
      fecharModal('modal-task');
      renderTasks();
    }).withFailureHandler(e=>showAlerta(String(e))).deleteTask(id);
  });
}

// ---------- Painel de Indicadores: gráficos do Kanban ----------
// Recebe o id de membro do filtro geral do Painel de Indicadores (fid);
// os KPIs do quadro (Total, Concluídos, Em Atraso, Tempo Médio) ficam na
// aba do próprio Kanban e NÃO usam esse filtro — ver renderKanbanKpis().
function renderGraficosKanban(fid) {
  // ATIVOS + ARQUIVADOS. O quadro (state.tasks) passou a trazer só os ativos,
  // mas estes gráficos são métrica HISTÓRICA: sem os arquivados, "Tarefas
  // Concluídas" e "Concluídas por Membro" encolheriam sozinhos a cada 15 dias,
  // conforme o auto-arquivamento tirasse os cartões do quadro. Quem chama
  // garante o carregamento via garantirArquivados (ver mostrarTab).
  let tasks = state.tasks.concat(state.archivedTasks || []);
  if (fid) {
    tasks = tasks.filter(t => parseIdsResponsaveis(t.assigneeId).includes(String(fid)));
  }

  const sc = { 'Backlog':0, 'A Fazer':0, 'Em Andamento':0, 'Em Revisão':0, 'Concluído':0 };
  const pc = { 'Alta':0, 'Media':0, 'Baixa':0 };
  // Contagens por ID de membro (não por nome) para não somar juntos dois
  // membros homônimos. Os rótulos do gráfico resolvem o nome na exibição.
  // Eixo só com membros ATIVOS (inativos saem das telas); tarefas atribuídas a
  // inativos simplesmente não entram nas barras.
  const membrosGrafico = state.members.filter(m => m.ativo !== false);
  const mc = {}; membrosGrafico.forEach(m => mc[m.id] = 0);          // Em Andamento
  const mcConcluido = {}; membrosGrafico.forEach(m => mcConcluido[m.id] = 0); // Concluído

  tasks.forEach(t => {
    const st = t.status || 'Backlog';
    sc[st] = (sc[st] || 0) + 1;
    pc[t.priority] = (pc[t.priority] || 0) + 1;

    const ids = parseIdsResponsaveis(t.assigneeId);

    if (st === 'Concluído') {
      ids.forEach(id => { if (id in mcConcluido) mcConcluido[id]++; });
    } else if (st === 'Em Andamento') {
      // Demandas em andamento por membro: só conta quando o status é
      // exatamente "Em Andamento" (não Backlog/A Fazer/Em Revisão)
      ids.forEach(id => { if (id in mc) mc[id]++; });
    }
  });

  // Rótulos (nomes) e dados na mesma ordem dos membros ativos
  const nomesMembros_ = membrosGrafico.map(m => m.name);
  const dadosMc = membrosGrafico.map(m => mc[m.id]);
  const dadosMcConcluido = membrosGrafico.map(m => mcConcluido[m.id]);

  // Atualizar KPIs do Painel Geral
  const elDashTar = $id('kpi-dash-tarefas');
  if (elDashTar) elDashTar.innerText = sc['Em Andamento'] || 0;
  const elDashTarConc = $id('kpi-dash-tarefas-conc');
  if (elDashTarConc) elDashTarConc.innerText = sc['Concluído'] || 0;

  // Destroi gráficos anteriores
  [statusChartInst, priorityChartInst, memberChartInst, memberConcluidoChartInst].forEach(c => { if (c) c.destroy(); });

  // Gráfico: Distribuição por Status
  const cS = $id('statusChart');
  if (cS) statusChartInst = new Chart(cS.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(sc),
      datasets: [{ data: Object.values(sc), backgroundColor: ['#b2b3bd','#3f8cff','#ff9500','#6c5dd3','#34c759'], borderWidth: 2, borderColor: '#fff', hoverOffset: 5 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '66%',
      plugins: { legend: CHART_LEGEND_BASE, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed} cartão(s)` } }, datalabels: CHART_DATALABELS_BASE }
    }
  });

  // Gráfico: Distribuição por Prioridade
  const cP = $id('priorityChart');
  if (cP) priorityChartInst = new Chart(cP.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: ['Alta', 'Média', 'Baixa'],
      datasets: [{ data: [pc['Alta'], pc['Media'], pc['Baixa']], backgroundColor: ['#ef4444','#ff9500','#34c759'], borderWidth: 2, borderColor: '#fff', hoverOffset: 5 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '66%',
      plugins: { legend: CHART_LEGEND_BASE, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed} cartão(s)` } }, datalabels: CHART_DATALABELS_BASE }
    }
  });

  // Gráfico: Em Andamento por Membro
  const cM = $id('memberChart');
  if (cM) memberChartInst = new Chart(cM.getContext('2d'), {
    type: 'bar',
    data: {
      labels: nomesMembros_,
      datasets: [{
        label: 'Em Andamento',
        data: dadosMc,
        backgroundColor: dadosMc.map(v => v === 0 ? '#f0f2f5' : 'rgba(63,140,255,0.85)'),
        borderColor:     dadosMc.map(v => v === 0 ? '#e4e4e5' : '#3f8cff'),
        borderWidth: 1, borderRadius: 5, borderSkipped: false, maxBarThickness: 42
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed.y} em andamento` } }, datalabels: CHART_DATALABELS_BASE },
      scales: CHART_SCALES_BASE
    }
  });

  // Gráfico: Concluídas por Membro
  const cMC = $id('memberConcluidoChart');
  if (cMC) memberConcluidoChartInst = new Chart(cMC.getContext('2d'), {
    type: 'bar',
    data: {
      labels: nomesMembros_,
      datasets: [{
        label: 'Concluídas',
        data: dadosMcConcluido,
        backgroundColor: dadosMcConcluido.map(v => v === 0 ? '#f0f2f5' : 'rgba(52,199,89,0.85)'),
        borderColor:     dadosMcConcluido.map(v => v === 0 ? '#e4e4e5' : '#34c759'),
        borderWidth: 1, borderRadius: 5, borderSkipped: false, maxBarThickness: 42
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { ...CHART_TOOLTIP_BASE, callbacks: { label: ctx => ` ${ctx.parsed.y} concluída(s)` } }, datalabels: { ...CHART_DATALABELS_BASE, color: ctx => ctx.dataset.data[ctx.dataIndex] === 0 ? '#64748b' : '#fff' } },
      scales: CHART_SCALES_BASE
    }
  });
}

// ---------- Helpers ----------
// Carga sob demanda dos cartões arquivados — mesma ideia de garantirRestoData:
// só busca na primeira visita à aba, e uma chamada concorrente entra na fila em
// vez de disparar um segundo getTarefasArquivadas().
var archivedLoaded = false;
var archivedLoading = false;
var archivedFilaCallbacks = [];
function garantirArquivados(cb) {
  if (archivedLoaded) { if (cb) cb(); return; }
  if (cb) archivedFilaCallbacks.push(cb);
  if (archivedLoading) return;
  archivedLoading = true;
  google.script.run
    .withFailureHandler(function(e) {
      archivedLoading = false;
      archivedFilaCallbacks = [];
      showAlerta('Falha ao carregar os cartões arquivados: ' + (e.message || String(e)));
    })
    .withSuccessHandler(function(lista) {
      state.archivedTasks = Array.isArray(lista) ? lista : [];
      archivedLoaded = true;
      archivedLoading = false;
      var fila = archivedFilaCallbacks; archivedFilaCallbacks = [];
      fila.forEach(function(fn) {
        try { fn(); } catch (err) { console.error('Erro ao renderizar arquivados:', err); }
      });
    })
    .getTarefasArquivadas();
}

// Invalida o cache dos arquivados. Chamada após arquivar/restaurar — a lista
// mudou no servidor e a próxima visita à aba precisa relê-la.
function invalidarArquivados() { archivedLoaded = false; state.archivedTasks = []; }

// Recarrega só Tarefas + Membros (usado após ações do Kanban/Membros)
function recarregarKanban(cb) {
  google.script.run.withSuccessHandler(data => {
    state.tasks = data.tasks; state.members = data.members;
    sincronizarDropdownMembros();
    if (cb) cb();
  }).withFailureHandler(e => showAlerta('Falha ao sincronizar: ' + String(e))).getKanbanData();
}

// Recarrega só Unidades/Riscos/Planos/Entregas (usado após ações da tela de
// Riscos/Acompanhamento) — evita reler Documentos e Capacitações, que essa
// tela não usa. Mesma ideia de recarregarDocs()/recarregarUnidades(), só que
// para o módulo de Riscos. Não mexe em restoDataLoaded/state.docs/state.trainings.
function recarregarRiscosPlanos(cb) {
  google.script.run.withSuccessHandler(data => {
    state.units = data.units; state.risks = data.risks;
    state.plans = data.plans; state.deliveries = data.deliveries;
    state.history = data.history || [];
    sincronizarSelectsUnidade();
    if (cb) cb();
  }).withFailureHandler(e => showAlerta('Falha ao sincronizar: ' + String(e))).getRiscosData();
}
