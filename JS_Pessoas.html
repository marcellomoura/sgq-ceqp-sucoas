<script>
// ==========================================
// MÓDULO 6 — GESTÃO DE PESSOAS
// ==========================================

var DIAS_SEMANA = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var DIAS_ABREV  = ['Seg','Ter','Qua','Qui','Sex','Sáb'];

function diaParaId(d) {
  return d.toLowerCase().replace(/ç/g,'c').replace(/[áâ]/g,'a').replace(/ã/g,'a');
}

// ─── ESCALA SEMANAL ────────────────────────────────────────────────────────────

function renderEscala() {
  var ativos = membrosOrdenados(); // só ativos (inativos saem das telas)
  renderEscalaGrid(ativos);
  var tbody = $id('lista-escala');
  if (!tbody) return;
  if (!ativos.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="msg-empty">Nenhum membro cadastrado.</td></tr>';
    return;
  }
  // id → índice em state.members, pré-computado (evita indexOf O(n²) por linha)
  var idxById = {}; state.members.forEach(function(m, i){ idxById[m.id] = i; });
  tbody.innerHTML = ativos.map(function(m) {
    var origIdx = idxById[m.id];
    var dias = Array.isArray(m.diasSemana) ? m.diasSemana : [];
    var pres = m.diaPresencial || '';
    var presList = pres ? pres.split(', ') : [];
    var dayTds = DIAS_SEMANA.map(function(d) {
      var ativo      = dias.indexOf(d) !== -1;
      var presencial = presList.indexOf(d) !== -1;
      if (!ativo) return '<td style="text-align:center;"><span class="escala-vazio">—</span></td>';
      var horInfo = (m.horarios && m.horarios[d]) ? m.horarios[d] : '';
      var icon = presencial
        ? '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'
        : '✓';
      return '<td style="text-align:center;">' +
        '<div style="display:flex; flex-direction:column; align-items:center; gap:2px;">' +
        '<span class="escala-check' + (presencial ? ' presencial' : '') + '" title="' + esc(d) + (presencial ? ' (presencial)' : '') + '">' + icon + '</span>' +
        (horInfo ? '<span style="font-size:9.5px;color:#64748b;font-weight:normal;white-space:nowrap;">' + esc(horInfo) + '</span>' : '') +
        '</div>' +
        '</td>';
    }).join('');
    return '<tr>' +
      '<td><div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="member-avatar">' + esc(m.name.charAt(0)) + '</div>' +
        '<div><div style="font-weight:600;font-size:13px;">' + esc(m.name) + '</div>' +
        '<div style="font-size:11px;color:#64748b;">' + esc(m.role) + '</div></div>' +
      '</div></td>' +
      dayTds +
      '<td style="text-align:center;">' +
        (presList.length > 0
          ? presList.map(function(p){ return '<span class="tag-badge" style="background:#2563eb;font-size:11px;margin-right:2px;display:inline-block;margin-bottom:2px;">' + esc(p.substring(0,3)) + '</span>'; }).join('')
          : '<span style="color:#94a3b8;font-size:12px;">—</span>') +
      '</td>' +
      '<td><div class="cell-actions" style="justify-content:center;">' +
        iconBtn('edit','edit-escala','Editar Escala','data-idx="' + origIdx + '"') +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function renderEscalaGrid(members) {
  var grid = $id('escala-grid');
  if (!grid) return;
  var hoje = new Date();
  var diaSemanaHoje = hoje.getDay(); // 0=Dom … 6=Sáb
  var mapDia = { 'Segunda':1,'Terça':2,'Quarta':3,'Quinta':4,'Sexta':5,'Sábado':6 };
  grid.innerHTML = DIAS_SEMANA.map(function(dia, idx) {
    var numDia    = mapDia[dia];
    var ehHoje    = diaSemanaHoje === numDia;
    var presenciais = members.filter(function(m){ return m.diaPresencial && m.diaPresencial.split(', ').indexOf(dia) !== -1; });
    var trabalhando = members.filter(function(m){ return Array.isArray(m.diasSemana) && m.diasSemana.indexOf(dia) !== -1; });
    return '<div class="escala-col' + (ehHoje ? ' today' : '') + '">' +
      '<div class="escala-col-title">' + DIAS_ABREV[idx] + (ehHoje ? ' <span class="today-dot">●</span>' : '') + '</div>' +
      '<div class="escala-col-count">' + trabalhando.length + ' trabalha' + (trabalhando.length !== 1 ? 'm' : '') + '</div>' +
      (presenciais.length
        ? '<div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">' + presenciais.map(function(m){ return '<div class="escala-member-pill">' + esc(m.name.split(' ')[0]) + '</div>'; }).join('') + '</div>'
        : '<div class="escala-empty-day">Ninguém presencial</div>') +
    '</div>';
  }).join('');
}

function abrirModalEscala(m) {
  $id('ee-membro-nome').innerText = m.name + ' — ' + m.role;
  $id('ee-membro-id').value = m.id;
  var dias = Array.isArray(m.diasSemana) ? m.diasSemana : [];
  var presList = m.diaPresencial ? m.diaPresencial.split(', ') : [];
  var horarios = m.horarios || {};
  DIAS_SEMANA.forEach(function(d) {
    var idDia = diaParaId(d);
    var cb = $id('ee-dia-' + idDia);
    var inp = $id('ee-hora-' + idDia);
    if (cb) {
      cb.checked = dias.indexOf(d) !== -1;
      if (inp) {
        inp.value = horarios[d] || '';
        inp.disabled = !cb.checked;
      }
    }
  });
  document.querySelectorAll('[name="ee-presencial"]').forEach(function(cb) {
    cb.checked = presList.indexOf(cb.value) !== -1;
  });
  abrirModal('modal-escala');
}

function confirmarEscala() {
  var btn = $id('btn-confirmar-escala');
  var membroId = $id('ee-membro-id').value;
  var diasSelecionados = DIAS_SEMANA.filter(function(d) {
    var cb = $id('ee-dia-' + diaParaId(d));
    return cb && cb.checked;
  });
  var horarios = {};
  for (var hi = 0; hi < diasSelecionados.length; hi++) {
    var d = diasSelecionados[hi];
    var inp = $id('ee-hora-' + diaParaId(d));
    if (inp && inp.value.trim()) {
      var val = inp.value.trim();
      // Vírgula quebraria o parsing da escala na leitura (os dias são separados
      // por vírgula na planilha). Bloqueia e sugere outro separador.
      if (val.indexOf(',') !== -1)
        return showAlerta('O horário de "' + d + '" não pode conter vírgula. Use outro separador, ex.: "08h-12h / 14h-18h".');
      horarios[d] = val;
    }
  }
  
  var presList = [];
  document.querySelectorAll('[name="ee-presencial"]:checked').forEach(function(cb) {
    presList.push(cb.value);
  });
  var diaPresencial = presList.join(', ');
  
  for (var i = 0; i < presList.length; i++) {
    if (diasSelecionados.indexOf(presList[i]) === -1)
      return showAlerta('O dia presencial deve ser trabalhado ("' + presList[i] + '" é inválido).');
  }

  btn.disabled = true; btn.innerText = 'A guardar...';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.sucesso) {
        var m = state.members.find(function(x){ return String(x.id) === String(membroId); });
        if (m) {
          m.diasSemana = diasSelecionados;
          m.diaPresencial = diaPresencial;
          m.horarios = horarios;
        }
        feedbackBtn(btn,'✅ Salvo!','Confirmar',function(){ fecharModal('modal-escala'); renderEscala(); });
      } else { btn.disabled = false; btn.innerText = 'Confirmar'; showAlerta(r.mensagem); }
    })
    .withFailureHandler(falha(btn,'Confirmar',null))
    .salvarEscala({ membroId: membroId, diasSemana: diasSelecionados, diaPresencial: diaPresencial, horarios: horarios });
}

// ─── FÉRIAS / AFASTAMENTOS ────────────────────────────────────────────────────────
// Um registro por (Membro + Ano) — o usuário navega entre anos pelo
// dropdown de ano no cabeçalho e edita direto na linha do membro, igual à
// Escala Semanal. Nada é excluído/arquivado: anos antigos continuam
// acessíveis normalmente, só trocando o ano no dropdown.

var afastamentosCache = [];         // todos os registros, de todos os anos
var anoAfastamentoAtual = new Date().getFullYear();
var anosExtras = [];                // anos adicionados manualmente nesta sessão, ainda sem registro salvo
var feriasFiltersInitialized = false;

function carregarFerias() {
  if (!feriasFiltersInitialized) {
    feriasFiltersInitialized = true;
    var el = $id('f-ferias-membro');
    if (el) el.addEventListener('change', renderFerias);
    preencherDropdownMembrosFerias();
    initControlesAno();
  }
  // Toda vez que se entra na aba, ela abre no ano vigente — dali o
  // usuário navega livremente pelos anos já cadastrados no dropdown.
  anoAfastamentoAtual = new Date().getFullYear();
  fecharNovoAno();
  msgTabela('lista-ferias', 9, 'A carregar...');
  google.script.run
    .withFailureHandler(function(e) { msgTabela('lista-ferias', 9, 'Falha ao carregar: ' + String(e), true); })
    .withSuccessHandler(function(data) {
      afastamentosCache = data || [];
      renderAnoTabs();
      renderFerias();
    })
    .getAfastamentos();
}

function preencherDropdownMembrosFerias() {
  var sel = $id('f-ferias-membro');
  if (!sel) return;
  sel.innerHTML = '<option value="">Todos os membros</option>' +
    membrosOrdenados().map(function(m){ return '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>'; }).join('');
}

// ─── Seletor de ano (dropdown no cabeçalho) ──────────────────────────────────
// Preenche o <select> de anos com todos os anos que têm registro + os
// adicionados manualmente nesta sessão + o ano vigente, sempre em ordem.
function renderAnoTabs() {
  var sel = $id('f-ferias-ano');
  if (!sel) return;

  var anos = new Set(afastamentosCache.map(function(r){ return parseInt(r.ano, 10); }).filter(function(n){ return !isNaN(n); }));
  anosExtras.forEach(function(a){ anos.add(a); });
  anos.add(new Date().getFullYear());
  var lista = Array.from(anos).sort(function(a,b){ return a - b; });
  if (lista.indexOf(anoAfastamentoAtual) === -1) anoAfastamentoAtual = lista[lista.length - 1];

  sel.innerHTML = lista.map(function(ano) {
    return '<option value="' + ano + '"' + (ano === anoAfastamentoAtual ? ' selected' : '') + '>' + ano + '</option>';
  }).join('');
}

// Fecha e limpa a caixa de "Novo ano"
function fecharNovoAno() {
  var box = $id('ano-novo-inline');
  if (box) box.style.display = 'none';
  var inp = $id('input-novo-ano');
  if (inp) inp.value = '';
}

// Liga (uma única vez) os controles de ano do cabeçalho: troca de ano,
// abrir/fechar a caixa e confirmar o cadastro de um novo ano.
function initControlesAno() {
  var sel = $id('f-ferias-ano');
  if (sel) sel.addEventListener('change', function() {
    anoAfastamentoAtual = parseInt(this.value, 10);
    renderFerias();
  });
  var btnAdd = $id('btn-add-ano-afastamento');
  if (btnAdd) btnAdd.addEventListener('click', function() {
    var box = $id('ano-novo-inline');
    var mostrar = box.style.display === 'none';
    box.style.display = mostrar ? 'inline-flex' : 'none';
    if (mostrar) { $id('input-novo-ano').value = ''; $id('input-novo-ano').focus(); }
  });
  var btnCancel = $id('btn-cancelar-novo-ano');
  if (btnCancel) btnCancel.addEventListener('click', fecharNovoAno);
  var btnConfirm = $id('btn-confirmar-novo-ano');
  if (btnConfirm) btnConfirm.addEventListener('click', function() {
    var v = parseInt($id('input-novo-ano').value, 10);
    if (!v || v < 2000 || v > 2100) return showAlerta('Informe um ano válido (entre 2000 e 2100).');
    if (anosExtras.indexOf(v) === -1) anosExtras.push(v);
    anoAfastamentoAtual = v;
    fecharNovoAno();
    renderAnoTabs();
    renderFerias();
  });
  // Enter confirma; Esc cancela — direto na caixa de digitar
  var inp = $id('input-novo-ano');
  if (inp) inp.addEventListener('keydown', function(e) {
    if (e.key === 'Enter')  { e.preventDefault(); $id('btn-confirmar-novo-ano').click(); }
    if (e.key === 'Escape') { fecharNovoAno(); }
  });
}

function parseDataStr(s) {
  if (!s) return null;
  var p = s.split('-');
  if (p.length !== 3) return null;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return isNaN(d.getTime()) ? null : d;
}

function renderFerias() {
  var tbody = $id('lista-ferias');
  if (!tbody) return;
  var hoje = new Date(); hoje.setHours(0,0,0,0);

  // Só os registros do ano em exibição — cada membro tem no máximo 1
  var registrosDoAno = afastamentosCache.filter(function(r){ return parseInt(r.ano, 10) === anoAfastamentoAtual; });
  var porMembro = {};
  registrosDoAno.forEach(function(r){ porMembro[r.membroId] = r; });

  // KPI — calculado só sobre o ano selecionado
  var emFerias = 0;
  registrosDoAno.forEach(function(r) {
    var list = [];
    (r.ferias || []).forEach(function(f){ if (f && f.inicio && f.fim) list.push(f); });
    (r.abonosFixos || []).forEach(function(d){ if (d) list.push({inicio: d, fim: d}); });
    if (r.abonoAniv && r.abonoAniv.inicio) list.push(r.abonoAniv);
    (r.licencas || []).forEach(function(lc){ if (lc && lc.inicio && lc.fim) list.push(lc); });
    (r.demais || []).forEach(function(d){ if (d && d.inicio && d.fim) list.push({inicio: d.inicio, fim: d.fim}); });
    list.some(function(p) {
      var ini = parseDataStr(p.inicio), fim = parseDataStr(p.fim || p.inicio);
      return ini && fim && ini <= hoje && fim >= hoje;
    }) && emFerias++;
  });
  var kpiEl = $id('kpi-f-agora'); if (kpiEl) kpiEl.innerText = emFerias;

  // Filtro por membro (mesmo select do cabeçalho)
  var fM = ($id('f-ferias-membro') || {value:''}).value;
  var membrosFiltrados = membrosOrdenados().filter(function(m){ return !fM || String(m.id) === fM; });

  if (!membrosFiltrados.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="msg-empty">Nenhum membro cadastrado.</td></tr>';
    return;
  }

  // Helpers de formatação — definidos uma vez por render, fora do loop de linhas
  var TRACO = '<span style="color:#94a3b8;font-size:12px;">—</span>';
  var fmtDM = function(isoStr) {
    if (!isoStr) return '';
    var p = isoStr.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] : isoStr;
  };
  var getHtmlFerias = function(p) {
    if (!p || !p.inicio || !p.fim) return TRACO;
    var ini = parseDataStr(p.inicio), fim = parseDataStr(p.fim);
    var dias = (ini && fim) ? Math.floor((fim - ini) / 86400000) + 1 : null;
    var agora = ini && fim && ini <= hoje && fim >= hoje;
    return '<span style="display:inline-block; margin-right:4px; margin-bottom:4px; margin-top:4px; font-size:11.5px;' + (agora ? 'background:#dcfce7; border: 1px solid #86efac; border-radius: 4px; padding: 2px 6px; font-weight:600; color:#15803d;' : 'color:#334155; padding: 2px 0px;') + '">' +
      fmtDM(p.inicio) + ' a ' + fmtDM(p.fim) + ' <span style="color:#64748b; font-weight:normal;">(' + dias + 'd)</span>' +
      '</span>';
  };

  // id → índice em state.members, pré-computado (evita indexOf O(n²) por linha)
  var idxByIdF = {}; state.members.forEach(function(m, i){ idxByIdF[m.id] = i; });
  tbody.innerHTML = membrosFiltrados.map(function(m) {
    var origIdx = idxByIdF[m.id];
    // Fallback com as MESMAS chaves lidas adiante (licencas/demais no plural) —
    // antes usava "licenca" (singular), chave que o código nunca lê.
    var afs = porMembro[m.id] || { ferias: [], abonosFixos: [], abonoAniv: null, licencas: [], demais: [] };

    var htmlF1 = TRACO, htmlF2 = TRACO, htmlF3 = TRACO;
    if (Array.isArray(afs.ferias)) {
      if (afs.ferias[0]) htmlF1 = getHtmlFerias(afs.ferias[0]);
      if (afs.ferias[1]) htmlF2 = getHtmlFerias(afs.ferias[1]);
      if (afs.ferias[2]) htmlF3 = getHtmlFerias(afs.ferias[2]);
    }

    var htmlAbono = TRACO;
    if (afs.abonosFixos && afs.abonosFixos.length > 0) {
      var tagsData = afs.abonosFixos.map(function(d) {
        var dt = parseDataStr(d);
        var agora = dt && dt.getTime() === hoje.getTime();
        return '<span style="display:inline-block; font-size:11px;' + (agora ? 'background:#fef9c3; border: 1px solid #fef08a; border-radius: 4px; padding: 2px 6px; font-weight:600; color:#854d0e;' : 'background:#f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 2px 6px; color:#475569;') + '">' + fmtDM(d) + '</span>';
      });
      htmlAbono = '<div style="display:flex; flex-wrap:wrap; gap:4px; align-items:center;">' + tagsData.join('') + '</div>';
    }

    var htmlAbonoAniv = TRACO;
    if (afs.abonoAniv && afs.abonoAniv.inicio) {
      var dtA = parseDataStr(afs.abonoAniv.inicio);
      var agoraA = dtA && dtA.getTime() === hoje.getTime();
      htmlAbonoAniv = '<span style="display:inline-block; font-size:11.5px; margin-top:4px; white-space:nowrap;' + (agoraA ? 'background:#d1fae5; border: 1px solid #a7f3d0; border-radius: 4px; padding: 2px 6px; font-weight:600; color:#047857;' : 'color:#334155; padding: 2px 0px;') + '">' +
        fmtDM(afs.abonoAniv.inicio) + '</span>';
    }

    var htmlLicenca = TRACO;
    if (afs.licencas && afs.licencas.length > 0) {
      htmlLicenca = afs.licencas.map(function(lc) {
        if (!lc || !lc.inicio || !lc.fim) return '';
        var iniL = parseDataStr(lc.inicio), fimL = parseDataStr(lc.fim);
        var diasL = (iniL && fimL) ? Math.floor((fimL - iniL) / 86400000) + 1 : null;
        var agoraL = iniL && fimL && iniL <= hoje && fimL >= hoje;
        return '<div style="font-size:11.5px; margin:2px 0; line-height:1.35;' + (agoraL ? 'background:#f3e8ff; border: 1px solid #e9d5ff; border-radius: 4px; padding: 2px 6px; font-weight:600; color:#6b21a8;' : 'color:#334155;') + '">' +
          fmtDM(lc.inicio) + ' a ' + fmtDM(lc.fim) + ' <span style="color:#64748b; font-weight:normal;">(' + diasL + 'd)</span></div>';
      }).join('');
      if (!htmlLicenca) htmlLicenca = TRACO;
    }

    var htmlDemais = TRACO;
    if (afs.demais && afs.demais.length > 0) {
      htmlDemais = afs.demais.map(function(d) {
        if (!d || !d.descricao) return '';
        var temPeriodo = d.inicio && d.fim;
        var iniD = temPeriodo ? parseDataStr(d.inicio) : null, fimD = temPeriodo ? parseDataStr(d.fim) : null;
        var agoraD = iniD && fimD && iniD <= hoje && fimD >= hoje;
        var periodoTxt = temPeriodo ? ' <span style="color:#64748b; font-weight:normal;">(' + fmtDM(d.inicio) + ' a ' + fmtDM(d.fim) + ')</span>' : '';
        return '<div style="font-size:11px; margin:2px 0; line-height:1.35;' + (agoraD ? 'background:#f1f5f9; border:1px solid #e2e8f0; border-radius:4px; padding:2px 6px; font-weight:600; color:#334155;' : 'color:#334155;') + '">' + esc(d.descricao) + periodoTxt + '</div>';
      }).join('');
      if (!htmlDemais) htmlDemais = TRACO;
    }

    // Destaca a linha se algum afastamento está ativo hoje
    var listaAtivos = [].concat(afs.ferias || [], afs.abonoAniv ? [afs.abonoAniv] : [], afs.licencas || []);
    (afs.abonosFixos || []).forEach(function(d){ if (d) listaAtivos.push({inicio: d, fim: d}); });
    (afs.demais || []).forEach(function(d){ if (d && d.inicio && d.fim) listaAtivos.push({inicio: d.inicio, fim: d.fim}); });
    var isQualquerAtivo = listaAtivos.some(function(p) {
      if (!p || !p.inicio) return false;
      var i = parseDataStr(p.inicio), f = parseDataStr(p.fim || p.inicio);
      return i && f && i <= hoje && f >= hoje;
    });

    return '<tr' + (isQualquerAtivo ? ' style="background:#f8fafc;"' : '') + '>' +
      '<td><div style="display:flex;align-items:center;gap:10px;">' +
        '<div class="member-avatar">' + esc(m.name.charAt(0)) + '</div>' +
        '<div><div style="font-weight:600;font-size:13px;">' + esc(m.name) + '</div>' +
        '<div style="font-size:11px;color:#64748b;">' + esc(m.role) + '</div></div>' +
      '</div></td>' +
      '<td>' + htmlF1 + '</td>' +
      '<td>' + htmlF2 + '</td>' +
      '<td>' + htmlF3 + '</td>' +
      '<td>' + htmlAbono + '</td>' +
      '<td>' + htmlAbonoAniv + '</td>' +
      '<td>' + htmlLicenca + '</td>' +
      '<td>' + htmlDemais + '</td>' +
      '<td><div class="cell-actions" style="justify-content:center;">' +
        iconBtn('edit','edit-ferias','Editar Afastamentos','data-idx="' + origIdx + '"') +
      '</div></td>' +
    '</tr>';
  }).join('');
}

// Abre o modal já fixado no membro clicado — igual à Escala Semanal. O ano
// editado é sempre o da aba selecionada no momento (anoAfastamentoAtual).
function abrirModalFerias(m) {
  $id('ef-membro-nome').innerText = m.name + ' — ' + m.role;
  $id('ef-membro-id').value = m.id;
  $id('modal-ferias-title').innerText = 'Afastamentos — ' + anoAfastamentoAtual;
  var registro = afastamentosCache.find(function(r) {
    return String(r.membroId) === String(m.id) && parseInt(r.ano, 10) === anoAfastamentoAtual;
  });
  fillModalWithData(registro || null);
  abrirModal('modal-ferias');
}

// ── Helpers dos botões "Adicionar" (revelam campos sob demanda) ──────────────
function atualizarBotaoFerias() {
  var vis = 0;
  for (var n = 1; n <= 3; n++) { if ($id('ef-ferias-block' + n).style.display !== 'none') vis++; }
  $id('btn-add-ferias').style.display = (vis >= 3) ? 'none' : '';
}
function adicionarFeriasBlock() {
  for (var n = 1; n <= 3; n++) {
    if ($id('ef-ferias-block' + n).style.display === 'none') { $id('ef-ferias-block' + n).style.display = ''; break; }
  }
  atualizarBotaoFerias();
}
function removerFeriasBlock(n) {
  $id('ef-ferias-ini' + n).value = '';
  $id('ef-ferias-fim' + n).value = '';
  $id('ef-ferias-block' + n).style.display = 'none';
  atualizarBotaoFerias();
}
// Linha de "Licença Servidor/Prêmio": período início/fim (várias por membro)
function licencaRowHtml(item) {
  item = item || {};
  return '<div class="licenca-item" style="display:grid; grid-template-columns: 1fr 1fr 28px; gap:6px; align-items:end; margin-bottom:6px;">' +
    '<div><label class="field-label" style="font-size:10px;margin-bottom:2px;">Início</label><input type="date" class="ef-licenca-ini field-input" style="font-size:11px;padding:4px;" value="' + (item.inicio || '') + '"></div>' +
    '<div><label class="field-label" style="font-size:10px;margin-bottom:2px;">Fim</label><input type="date" class="ef-licenca-fim field-input" style="font-size:11px;padding:4px;" value="' + (item.fim || '') + '"></div>' +
    '<button type="button" class="btn-rem-afast" data-afast-acao="rem-licenca" title="Remover licença" style="margin-bottom:4px;">&times;</button>' +
  '</div>';
}
// Linha de "Demais Afastamentos": descrição livre + período opcional
function demaisRowHtml(item) {
  item = item || {};
  return '<div class="demais-item" style="display:grid; grid-template-columns: 1fr 120px 120px 28px; gap:6px; align-items:end; margin-bottom:6px;">' +
    '<div><label class="field-label" style="font-size:10px;margin-bottom:2px;">Descrição</label><input type="text" class="ef-demais-desc field-input" style="font-size:11px;padding:4px;" placeholder="Descreva o afastamento..." value="' + esc(item.descricao || '') + '"></div>' +
    '<div><label class="field-label" style="font-size:10px;margin-bottom:2px;">Início</label><input type="date" class="ef-demais-ini field-input" style="font-size:11px;padding:4px;" value="' + (item.inicio || '') + '"></div>' +
    '<div><label class="field-label" style="font-size:10px;margin-bottom:2px;">Fim</label><input type="date" class="ef-demais-fim field-input" style="font-size:11px;padding:4px;" value="' + (item.fim || '') + '"></div>' +
    '<button type="button" class="btn-rem-afast" data-afast-acao="rem-demais" title="Remover" style="margin-bottom:4px;">&times;</button>' +
  '</div>';
}

// Delegação única para os controles do modal de afastamentos
document.addEventListener('click', function(e) {
  var el = e.target.closest('[data-afast-acao]');
  if (!el) return;
  var acao = el.getAttribute('data-afast-acao');
  if (acao === 'add-ferias')       adicionarFeriasBlock();
  else if (acao === 'rem-ferias')  removerFeriasBlock(parseInt(el.getAttribute('data-n'), 10));
  else if (acao === 'add-licenca') $id('ef-licenca-list').insertAdjacentHTML('beforeend', licencaRowHtml());
  else if (acao === 'rem-licenca') { var itL = el.closest('.licenca-item'); if (itL) itL.remove(); }
  else if (acao === 'add-demais')  $id('ef-demais-list').insertAdjacentHTML('beforeend', demaisRowHtml());
  else if (acao === 'rem-demais')  { var it = el.closest('.demais-item'); if (it) it.remove(); }
});

function clearModalAfastamentos() {
  for (var n = 1; n <= 3; n++) {
    $id('ef-ferias-ini' + n).value = '';
    $id('ef-ferias-fim' + n).value = '';
    $id('ef-ferias-block' + n).style.display = 'none';
  }
  atualizarBotaoFerias();

  $id('ef-abono1').value = '';
  $id('ef-abono2').value = '';
  $id('ef-abono3').value = '';
  $id('ef-abono4').value = '';
  $id('ef-abono5').value = '';

  $id('ef-abono-niver').value = '';

  $id('ef-licenca-list').innerHTML = '';
  $id('ef-demais-list').innerHTML = '';
}

function fillModalWithData(afs) {
  clearModalAfastamentos();
  if (!afs) return;
  
  // Férias — só revela os blocos que já têm período gravado
  if (afs.ferias && Array.isArray(afs.ferias)) {
    for (var k = 0; k < 3; k++) {
      if (afs.ferias[k] && (afs.ferias[k].inicio || afs.ferias[k].fim)) {
        $id('ef-ferias-ini' + (k+1)).value = afs.ferias[k].inicio || '';
        $id('ef-ferias-fim' + (k+1)).value = afs.ferias[k].fim || '';
        $id('ef-ferias-block' + (k+1)).style.display = '';
      }
    }
    atualizarBotaoFerias();
  }

  // abonos 1 to 5
  if (afs.abonosFixos && Array.isArray(afs.abonosFixos)) {
    for (var i = 0; i < 5; i++) {
       if (afs.abonosFixos[i]) {
         $id('ef-abono' + (i+1)).value = afs.abonosFixos[i] || '';
       }
    }
  }

  // aniversario
  if (afs.abonoAniv) {
    // We parse it back into the field. Since it has inicio and fim same, just use inicio
    $id('ef-abono-niver').value = afs.abonoAniv.inicio || '';
  }

  // licencas — uma linha por licença existente
  if (afs.licencas && Array.isArray(afs.licencas)) {
    afs.licencas.forEach(function(it) { $id('ef-licenca-list').insertAdjacentHTML('beforeend', licencaRowHtml(it)); });
  }

  // demais afastamentos — renderiza uma linha por item existente
  if (afs.demais && Array.isArray(afs.demais)) {
    afs.demais.forEach(function(it) { $id('ef-demais-list').insertAdjacentHTML('beforeend', demaisRowHtml(it)); });
  }
}

function confirmarFerias() {
  var btn = $id('btn-confirmar-ferias');
  var membroId = $id('ef-membro-id').value;
  var membro = state.members.find(function(x){ return String(x.id) === String(membroId); });
  if (!membro) return showAlerta('Membro não encontrado.');

  var ferias = [];
  for (var i = 1; i <= 3; i++) {
    var iniVal = $id('ef-ferias-ini' + i).value;
    var fimVal = $id('ef-ferias-fim' + i).value;
    if (iniVal && fimVal) {
      if (iniVal > fimVal) {
        return showAlerta('Nas férias (Período ' + i + '), a data de início deve ser anterior ao fim.');
      }
      ferias.push({ inicio: iniVal, fim: fimVal });
    } else if (iniVal || fimVal) {
      return showAlerta('Nas férias (Período ' + i + '), preencha ambas as datas de início e fim.');
    }
  }

  var abonos = [];
  for (var i = 1; i <= 5; i++) {
    var dtVal = $id('ef-abono' + i).value;
    if (dtVal) abonos.push(dtVal);
  }

  var abonoAniversario = $id('ef-abono-niver').value;

  var licencas = [];
  var itensL = document.querySelectorAll('#ef-licenca-list .licenca-item');
  for (var L = 0; L < itensL.length; L++) {
    var lIni = itensL[L].querySelector('.ef-licenca-ini').value;
    var lFim = itensL[L].querySelector('.ef-licenca-fim').value;
    if (!lIni && !lFim) continue; // linha vazia — ignora
    if (!lIni || !lFim) return showAlerta('Na licença, preencha início e fim (ou remova a linha em branco).');
    if (lIni > lFim) return showAlerta('Na licença, a data de início deve ser anterior ao fim.');
    licencas.push({ inicio: lIni, fim: lFim });
  }

  var demais = [];
  var itens = document.querySelectorAll('#ef-demais-list .demais-item');
  for (var j = 0; j < itens.length; j++) {
    var desc = itens[j].querySelector('.ef-demais-desc').value.trim();
    var dIni = itens[j].querySelector('.ef-demais-ini').value;
    var dFim = itens[j].querySelector('.ef-demais-fim').value;
    if (!desc && !dIni && !dFim) continue; // linha vazia — ignora
    if (!desc) return showAlerta('Em "Demais Afastamentos", descreva o afastamento.');
    if ((dIni && !dFim) || (!dIni && dFim)) return showAlerta('Em "Demais Afastamentos", preencha início e fim (ou deixe ambos vazios).');
    if (dIni && dFim && dIni > dFim) return showAlerta('Em "Demais Afastamentos", a data de início deve ser anterior ao fim.');
    demais.push({ descricao: desc, inicio: dIni, fim: dFim });
  }

  var dados = {
    membroId: membroId, membroNome: membro.name, ano: anoAfastamentoAtual,
    ferias: ferias,
    abonos: abonos,
    abonoAniversario: abonoAniversario,
    licencas: licencas,
    demais: demais
  };

  btn.disabled = true; btn.innerText = 'A guardar...';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.sucesso) feedbackBtn(btn,'✅ Salvo!','Confirmar',function(){ fecharModal('modal-ferias'); carregarFerias(); });
      else { btn.disabled = false; btn.innerText = 'Confirmar'; showAlerta(r.mensagem); }
    })
    .withFailureHandler(falha(btn,'Confirmar',null))
    .salvarAfastamento(dados);
}
</script>
