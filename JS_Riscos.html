<script>
// ==========================================
// MÓDULO 4 — RISCOS
// ==========================================

// Regra de negócio (espelho da do servidor, ver Modulo_Riscos.js): plano com
// "TODAS" no responsável cobra todas as subcomissões; unidade é subcomissão
// quando "Subcomissão" aparece no nome. Único ponto de verdade no cliente.
function planoEhGlobal(quem) { return String(quem||'').toUpperCase().includes('TODAS'); }
function ehSubcomissao(nomeUnidade) { const n = String(nomeUnidade||'').toLowerCase(); return n.includes('subcomissão') || n.includes('subcomissao'); }

function renderMatriz() {
  msgTabela('lista-riscos', 12, 'A carregar...');
  for (let p=1;p<=5;p++) for(let i=1;i<=5;i++) { const el=$id(`cell-${p}-${i}`); if(el) el.innerHTML=''; }

  const ativos = state.risks.filter(r => r.status !== 'Arquivado');
  
  ativos.forEach((r, idx) => {
    // Busca a reavaliação mais recente no histórico, se houver
    const ref = 'R' + r.id;
    const hist = state.history ? state.history.filter(h => h.id === ref && h.tipo === 'Risco') : [];
    let curProb = r.probabilidade, curImp = r.impacto, curNivel = r.nivel;
    let originalScore = r.probabilidade * r.impacto;
    let trendIcon = '';
    
    if (hist.length > 0) {
      // hist está ordenado cronologicamente pois foi lido da aba do topo ao fim.
      const ultimo = hist[hist.length - 1];
      curProb = ultimo.prob;
      curImp = ultimo.impacto;
      curNivel = ultimo.nivel;
      
      const prevScore = hist.length > 1 ? (hist[hist.length - 2].prob * hist[hist.length - 2].impacto) : originalScore;
      const curScore = curProb * curImp;
      if (curScore < prevScore) trendIcon = '<span style="color:#16a34a; font-weight:bold; margin-left:4px;" title="Risco reduziu">⬇️</span>';
      else if (curScore > prevScore) trendIcon = '<span style="color:#dc2626; font-weight:bold; margin-left:4px;" title="Risco aumentou">⬆️</span>';
      else trendIcon = '<span style="color:#94a3b8; font-weight:bold; margin-left:4px;" title="Risco manteve">➖</span>';
    }
    
    // Anexa dados dinâmicos ao objeto para uso na tabela
    r._curProb = curProb; r._curImp = curImp; r._curNivel = curNivel; r._trend = trendIcon;

    const cel = $id(`cell-${curProb}-${curImp}`);
    if (cel) {
      if (!cel.querySelector('.badge-cluster')) cel.innerHTML = '<div class="badge-cluster"></div>';
      const b = document.createElement('span');
      b.className = 'risk-badge'; b.textContent = 'R' + r.id; b.title = r.nome;
      cel.querySelector('.badge-cluster').appendChild(b);
    }
  });

  if (!ativos.length) { msgTabela('lista-riscos', 12, 'Nenhum risco ativo mapeado.'); return; }
  $id('lista-riscos').innerHTML = ativos.map((r, i) => {
    const origIdx = state.risks.findIndex(x => x.id === r.id);
    return `<tr>
    <td style="text-align:center;font-weight:700;color:#64748b;">${i + 1}</td>
    <td style="text-align:center;font-weight:700;color:#2563eb;white-space:nowrap;">R-${r.id}</td>
    <td>${esc(r.macroetapa)}</td><td><span style="display:inline-block; font-weight:600; color:#1e293b; border:1px solid #cbd5e1; border-radius:6px; padding:4px 10px; background:#f8fafc;">${esc(r.nome)}</span></td><td>${esc(r.causa)}</td>
    <td>${esc(r.consequencia)}</td><td>${esc(r.categoria)}</td>
    <td style="text-align:center;font-weight:700;">${r._curProb * r._curImp}</td>
    <td style="text-align:center; white-space:nowrap;">${badge(r._curNivel)}${r._trend}</td>
    <td>${esc(r.tipoTratamento)}</td><td>${esc(formatUnidadeUI(r.responsavel))}</td><td>${esc(r.planoAcao)}</td>
    <td class="no-print"><div class="cell-actions" style="justify-content:center;">
      ${iconBtn('rev','reav-risco','Reavaliar',`onclick="abrirModalReavaliar(${origIdx})"`)}
      ${iconBtn('edit','edit-risco','Editar Risco',`data-idx="${origIdx}"`)}
    </div></td>
  </tr>`
  }).join('');
}

function abrirModalMapearRisco() {
  try {
    ['r-macro','r-cat','r-nome','r-causa','r-conseq','r-trat','r-resp'].forEach(id => { const el = $id(id); if (el) el.value = ''; });
    if ($id('r-prob')) $id('r-prob').value = '';
    if ($id('r-imp')) $id('r-imp').value = '';
    atualizarLegendaRisco('r');
    sincronizarSelectsUnidade();
    abrirModal('modal-risco-novo');
  } catch (err) {
    console.error('Erro ao abrir modal de mapear risco:', err);
    showAlerta('Não foi possível abrir o formulário: ' + (err.message || String(err)));
  }
}

function salvarRisco() {
  const btn = $id('btn-salvar-risco');
  const dados = {
    macroetapa: $id('r-macro').value, categoria: $id('r-cat').value,
    nome: ($id('r-nome').value||'').trim(), causa: ($id('r-causa').value||'').trim(),
    consequencia: ($id('r-conseq').value||'').trim(),
    probabilidade: Number($id('r-prob').value), impacto: Number($id('r-imp').value),
    tipoTratamento: $id('r-trat').value, responsavel: $id('r-resp').value
  };
  if (!dados.macroetapa || !dados.categoria || !dados.nome || !dados.causa || !dados.consequencia || !dados.tipoTratamento || !dados.responsavel) return showAlerta('Preencha todos os campos do risco.');
  if (!dados.probabilidade || !dados.impacto) return showAlerta('Selecione a Probabilidade e o Impacto.');
  btn.disabled = true; btn.innerText = 'A guardar...';
  google.script.run.withSuccessHandler(r => {
    if (r.sucesso) feedbackBtn(btn,'✅ Mapeado!','Salvar Risco',()=>{ fecharModal('modal-risco-novo'); recarregarRiscosPlanos(renderMatriz); });
    else { btn.disabled=false; btn.innerText='Salvar Risco'; showAlerta(r.mensagem); }
  }).withFailureHandler(falha(btn,'Salvar Risco',null)).salvarRisco(dados);
}

function abrirEditarRisco(idx) {
  const r = state.risks[idx]; if(!r) return;
  $id('er-id').value = r.id; 
  $id('er-prob-original').value = r.probabilidade;
  $id('er-imp-original').value = r.impacto;

  const hist = state.history ? state.history.filter(h => h.id === 'R'+r.id && h.tipo === 'Risco') : [];
  const temReavaliacao = hist.length > 0;

  $id('label-risco-editar').innerText = `Risco: R${r.id} — ${r.nome}`;

  $id('er-macro').value = r.macroetapa; $id('er-cat').value = r.categoria;
  $id('er-nome').value = r.nome; $id('er-causa').value = r.causa; $id('er-conseq').value = r.consequencia;
  
  $id('er-prob').value = temReavaliacao ? (r._curProb || r.probabilidade) : r.probabilidade; 
  $id('er-imp').value = temReavaliacao ? (r._curImp || r.impacto) : r.impacto;
  $id('er-prob').disabled = false;
  $id('er-imp').disabled = false;

  $id('er-trat').value = r.tipoTratamento;
  $id('er-resp').innerHTML = gerarOptsProprietariosRisco(); $id('er-resp').value = r.responsavel;
  atualizarLegendaRisco('er');
  abrirModal('modal-risco-editar');
}
function confirmarEdicaoRisco() {
  const btn = $id('btn-confirmar-risco');
  const pVal = $id('er-prob').value;
  const iVal = $id('er-imp').value;
  const dados = {
    id: $id('er-id').value, macroetapa: $id('er-macro').value, categoria: $id('er-cat').value,
    nome: $id('er-nome').value.trim(), causa: $id('er-causa').value.trim(), consequencia: $id('er-conseq').value.trim(),
    probabilidade: Number(pVal), impacto: Number(iVal),
    tipoTratamento: $id('er-trat').value, responsavel: $id('er-resp').value
  };
  if (!dados.nome || !dados.causa || !dados.consequencia || !dados.probabilidade || !dados.impacto) return showAlerta('Preencha os campos obrigatórios, incluindo Probabilidade e Impacto.');
  btn.disabled = true; btn.innerText = 'A atualizar...';
  google.script.run.withSuccessHandler(r => {
    if (r.sucesso) feedbackBtn(btn,'✅ Salvo!','Confirmar',()=>{ fecharModal('modal-risco-editar'); recarregarRiscosPlanos(renderMatriz); });
    else { btn.disabled=false; btn.innerText='Confirmar'; showAlerta(r.mensagem); }
  }).withFailureHandler(falha(btn,'Confirmar',null)).atualizarRisco(dados);
}

function excluirRisco(id) {
  google.script.run.withSuccessHandler(() => recarregarRiscosPlanos(renderMatriz))
    .withFailureHandler(e => showAlerta(String(e))).excluirRisco(id);
}

function abrirModalReavaliar(idx) {
  const r = state.risks[idx]; if (!r) return;
  $id('rev-id-risco').value = r.id;
  $id('rev-info').innerText = `Risco: R${r.id} — ${r.nome} \nNível Atual: ${r._curNivel} (${r._curProb*r._curImp})`;
  $id('rev-prob').value = r._curProb || r.probabilidade;
  $id('rev-imp').value = r._curImp || r.impacto;
  $id('rev-trat').value = r.tipoTratamento;
  $id('rev-resp').innerHTML = gerarOptsProprietariosRisco(); $id('rev-resp').value = r.responsavel;
  $id('rev-justif').value = '';
  
  const hTable = $id('rev-historico-lista');
  const hist = state.history ? state.history.filter(h => h.id === 'R'+r.id && h.tipo === 'Risco') : [];
  if (hist.length) {
    hTable.innerHTML = hist.map(h => `<tr>
      <td>${h.data}</td>
      <td>${h.prob}</td><td>${h.impacto}</td><td>${badge(h.nivel)}</td>
      <td>${esc(h.tratamento || '-')}</td><td>${esc(formatUnidadeUI(h.responsavel) || '-')}</td>
      <td>${esc(h.justificativa)}</td>
    </tr>`).join('');
  } else {
    hTable.innerHTML = '<tr><td colspan="7" class="msg-empty">Nenhum histórico encontrado.</td></tr>';
  }
  
  $id('rev-acao').value = 'reavaliar';
  toggleCamposReavaliacao();
  atualizarLegendaRisco('rev');
  
  abrirModal('modal-reavaliar-risco');
}

function toggleCamposReavaliacao() {
  const acao = $id('rev-acao').value;
  const notasDiv = $id('rev-campos-notas');
  
  if (acao === 'superado') {
    notasDiv.style.display = 'none';
  } else {
    notasDiv.style.display = 'block';
    const disable = (acao === 'manter');
    $id('rev-prob').disabled = disable;
    $id('rev-imp').disabled = disable;
    $id('rev-trat').disabled = disable;
    $id('rev-resp').disabled = disable;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const btnRevRisco = $id('btn-salvar-reaval');
  if (btnRevRisco) btnRevRisco.addEventListener('click', () => {
    const btn = btnRevRisco;
    const acao = $id('rev-acao').value;
    const idRisco = $id('rev-id-risco').value;
    
    if (acao === 'superado') {
      const justificativa = $id('rev-justif').value.trim();
      if (!justificativa) return showAlerta('Descreva a justificativa para superar/arquivar este risco.');
      btn.disabled = true; btn.innerText = 'A arquivar...';
      google.script.run.withSuccessHandler(r => {
        if (r && r.sucesso === false) { btn.disabled=false; btn.innerText='Salvar Ação'; showAlerta(r.mensagem); return; }
        feedbackBtn(btn,'✅ Superado!','Salvar Ação',()=>{ fecharModal('modal-reavaliar-risco'); recarregarRiscosPlanos(renderMatriz); });
      }).withFailureHandler(falha(btn,'Salvar Ação',null)).excluirRisco(idRisco);
      return;
    }

    const dados = {
      idRisco: idRisco,
      probabilidade: Number($id('rev-prob').value),
      impacto: Number($id('rev-imp').value),
      tipoTratamento: $id('rev-trat').value,
      responsavel: $id('rev-resp').value,
      justificativa: $id('rev-justif').value.trim() || 'Reavaliação periódica.'
    };
    if (!dados.probabilidade || !dados.impacto) return showAlerta('Probabilidade e Impacto são obrigatórios.');
    if (!dados.tipoTratamento || !dados.responsavel) return showAlerta('Tipo de Tratamento e Proprietário do Risco são obrigatórios.');
    btn.disabled = true; btn.innerText = 'A salvar...';
    google.script.run.withSuccessHandler(r => {
      if (r.sucesso) feedbackBtn(btn,'✅ Salvo!','Salvar Ação',()=>{ fecharModal('modal-reavaliar-risco'); recarregarRiscosPlanos(renderMatriz); });
      else { btn.disabled=false; btn.innerText='Salvar Ação'; showAlerta(r.mensagem); }
    }).withFailureHandler(falha(btn,'Salvar Ação',null)).reavaliarRisco(dados);
  });
});

// ==========================================
// MÓDULO 4 — PLANOS DE AÇÃO (5W2H)
// ==========================================
function formatRiscoUI(val) {
  if (!val || val === '-') return val || '';
  const idx = state.risks.findIndex(x => 'R' + x.id === String(val));
  if (idx !== -1) {
    return `Risco ${idx + 1} — ${state.risks[idx].nome}`;
  }
  return val;
}

function carregarRiscosLivres() {
  const sel = $id('p-risco');
  sel.innerHTML = '<option value="">A carregar riscos sem plano...</option>';
  const idsComPlano = new Set(state.plans.map(p => p.riscoVinculado));
  const livres = state.risks.filter(r => !idsComPlano.has('R' + r.id));
  if (!livres.length) { sel.innerHTML = '<option value="">Nenhum risco sem plano de ação.</option>'; return; }
  sel.innerHTML = '<option value="" disabled selected>Selecione o risco...</option>' +
    livres.map(r => {
      const idx = state.risks.findIndex(x => x.id === r.id);
      return `<option value="R${r.id}">Risco ${idx + 1} — ${esc(r.nome)}</option>`;
    }).join('');
}

function abrirModalNovoPlano() {
  try {
    ['p-risco','p-what','p-why','p-where','p-when','p-how','p-who','p-howmuch'].forEach(id => { const el = $id(id); if (el) el.value = ''; });
    sincronizarSelectsUnidade();
    carregarRiscosLivres();
    abrirModal('modal-plano-novo');
  } catch (err) {
    console.error('Erro ao abrir modal de novo plano:', err);
    showAlerta('Não foi possível abrir o formulário de novo plano: ' + (err.message || String(err)));
  }
}

function salvarPlano() {
  const btn = $id('btn-salvar-plano');
  const dados = {
    riscoVinculado: $id('p-risco').value, what: ($id('p-what').value||'').trim(),
    why: ($id('p-why').value||'').trim(), who: $id('p-who').value,
    where: ($id('p-where').value||'').trim(), whenPrevisto: $id('p-when').value,
    whenFinalizado: '', how: ($id('p-how').value||'').trim(),
    howMuch: ($id('p-howmuch').value||'').trim() || 'Sem custos'
  };
  if (!dados.riscoVinculado || !dados.what || !dados.why || !dados.who || !dados.where || !dados.whenPrevisto || !dados.how) return showAlerta('Preencha todos os campos do plano.');
  btn.disabled = true; btn.innerText = 'A guardar...';
  google.script.run.withSuccessHandler(r => {
    if (r.sucesso) feedbackBtn(btn,'✅ Registrado!','Salvar Plano de Ação',()=>{ fecharModal('modal-plano-novo'); recarregarRiscosPlanos(renderAcompanhamento); });
    else { btn.disabled=false; btn.innerText='Salvar Plano de Ação'; showAlerta(r.mensagem); }
  }).withFailureHandler(falha(btn,'Salvar Plano de Ação',null)).salvarPlano(dados);
}

function renderAcompanhamento() {
  $id('kpi-p-conc').innerText = state.plans.filter(p=>p.status==='Concluído').length;
  $id('kpi-p-and').innerText  = state.plans.filter(p=>p.status==='Em Andamento').length;
  $id('kpi-p-atr').innerText  = state.plans.filter(p=>p.status==='Atrasado').length;

  const fU = ($id('f-acomp-unidade')||{value:''}).value;
  const fS = ($id('f-acomp-status') ||{value:''}).value;
  const ativosRiscosIds = new Set(state.risks.filter(r => r.status !== 'Arquivado').map(r => 'R'+r.id));
  const filtrados = state.plans.filter(p => ativosRiscosIds.has(p.riscoVinculado) && (!fU || p.who === fU) && (!fS || p.status === fS));
  if (!filtrados.length) { msgTabela('lista-acomp', 12, 'Nenhum plano ativo encontrado.'); return; }

  $id('lista-acomp').innerHTML = filtrados.map((p) => {
    const oi = state.plans.findIndex(x => x.riscoVinculado === p.riscoVinculado);
    const alerta = p.revisaoPendente === 'Sim' ? '<span style="color:#eab308; margin-left:8px;" title="Revisão Pendente (Risco Reavaliado)">⚠️</span>' : '';
    const acaoRev = p.revisaoPendente === 'Sim' ? iconBtn('warning','rev-plano','Revisar Plano',`onclick="abrirModalRevisarPlano(${oi})"`) : '';
    return `<tr>
      <td style="font-weight:700;color:#2563eb;">${esc(formatRiscoUI(p.riscoVinculado))}${alerta}</td>
      <td>${esc(p.what)}</td><td>${esc(p.why)}</td><td>${esc(formatUnidadeUI(p.who))}</td>
      <td>${esc(p.where)}</td><td>${fmtBr(p.whenPrevisto)}</td><td>${fmtBr(p.whenFinalizado)}</td>
      <td>${esc(p.how)}</td><td>${esc(p.howMuch)}</td>
      <td style="text-align:center;">${badge(p.status)}</td>
      <td class="no-print"><div class="cell-actions" style="justify-content:center;">
        ${acaoRev}
        ${iconBtn('edit','edit-plano','Editar',`data-idx="${oi}"`)}
        ${iconBtn('history','acomp-entregas','Acompanhamento',`data-idx="${oi}"`)}
      </div></td>
    </tr>`;
  }).join('');
}

function abrirEditarPlano(idx) {
  const p = state.plans[idx]; if(!p) return;
  $id('ep-risco').value = p.riscoVinculado; $id('label-plano-editar').innerText = `Risco: ${p.riscoVinculado}`;
  $id('ep-what').value = p.what === '-' ? '' : p.what; $id('ep-why').value = p.why === '-' ? '' : p.why;
  $id('ep-who').innerHTML = gerarOptsUnidades(true); $id('ep-who').value = p.who;
  $id('ep-where').value = p.where === '-' ? '' : p.where;
  $id('ep-when').value = p.whenPrevisto; $id('ep-fin').value = p.whenFinalizado;
  $id('ep-how').value = p.how === '-' ? '' : p.how; $id('ep-cost').value = p.howMuch === '-' ? '' : p.howMuch;
  abrirModal('modal-plano-editar');
}
function confirmarEdicaoPlano() {
  const btn = $id('btn-confirmar-plano');
  const dados = {
    riscoVinculado: $id('ep-risco').value, what: $id('ep-what').value.trim(),

    where: $id('ep-where').value.trim(), whenPrevisto: $id('ep-when').value,

  };

  google.script.run.withSuccessHandler(r => {
    if (r.sucesso) feedbackBtn(btn,'✅ Salvo!','Confirmar',()=>{ fecharModal('modal-plano-editar'); recarregarRiscosPlanos(renderAcompanhamento); });

function excluirPlano(riscoVinculado) {
  google.script.run.withSuccessHandler(() => recarregarRiscosPlanos(renderAcompanhamento))
    .withFailureHandler(e => showAlerta(String(e))).excluirPlano(riscoVinculado);
}

function abrirModalRevisarPlano(idx) {
  const p = state.plans[idx]; if (!p) return;
  $id('revp-risco').value = p.riscoVinculado;
  $id('revp-justif').value = '';
  document.querySelector('input[name="revp-acao"][value="manter"]').click(); // reset to manter
  
  $id('revp-what').value = p.what === '-' ? '' : p.what; $id('revp-why').value = p.why === '-' ? '' : p.why;
  $id('revp-who').innerHTML = gerarOptsUnidades(true); $id('revp-who').value = p.who;
  $id('revp-where').value = p.where === '-' ? '' : p.where;
  $id('revp-when').value = p.whenPrevisto; $id('revp-fin').value = p.whenFinalizado;
  $id('revp-how').value = p.how === '-' ? '' : p.how; $id('revp-cost').value = p.howMuch === '-' ? '' : p.howMuch;
  abrirModal('modal-revisar-plano');
}

document.addEventListener('DOMContentLoaded', () => {
  const btnRevPlano = $id('btn-salvar-revisar-plano');
  if (btnRevPlano) btnRevPlano.addEventListener('click', () => {
    const btn = btnRevPlano;
    const acao = document.querySelector('input[name="revp-acao"]:checked').value;
    const dados = {
      riscoVinculado: $id('revp-risco').value,
      acao: acao,
      justificativa: $id('revp-justif').value.trim()
    };
    
    if (acao === 'alterar') {
      dados.what = $id('revp-what').value.trim(); dados.why = $id('revp-why').value.trim();
      dados.who = $id('revp-who').value; dados.where = $id('revp-where').value.trim();
      dados.whenPrevisto = $id('revp-when').value; dados.whenFinalizado = $id('revp-fin').value;
      dados.how = $id('revp-how').value.trim(); dados.howMuch = $id('revp-cost').value.trim() || 'Sem custos';
      if (!dados.what || !dados.why || !dados.who || !dados.whenPrevisto) return showAlerta('Preencha os campos obrigatórios do novo plano.');
    }
    
    btn.disabled = true; btn.innerText = 'A processar...';
    google.script.run.withSuccessHandler(r => {
      if (r.sucesso) feedbackBtn(btn,'✅ Concluído!','Confirmar',()=>{ fecharModal('modal-revisar-plano'); recarregarRiscosPlanos(renderAcompanhamento); });
      else { btn.disabled=false; btn.innerText='Confirmar'; showAlerta(r.mensagem); }
    }).withFailureHandler(falha(btn,'Confirmar',null)).revisarPlano(dados);
  });
});

// ==========================================
// ACOMPANHAMENTO DE ENTREGAS (modal inline no Plano de Ação)
// ==========================================
// ==========================================

function abrirModalAcompEntregas(idx) {
  const p = state.plans[idx]; if (!p) return;
  const global = planoEhGlobal(p.who);
  let unidadesCobradas;
  if (global) {
    // "Todas as Subcomissões" cobra APENAS unidades com "Subcomissão" no nome
    unidadesCobradas = state.units.filter(function(u) { return ehSubcomissao(u.unidade); });
  } else {
    // Plano atribuído a uma unidade específica — só ela é cobrada
    unidadesCobradas = state.units.filter(function(u) {
      return String(u.id) === String(p.who) || (u.sigla + ' - ' + u.unidade) === p.who;
    });
    if (!unidadesCobradas.length && p.who) {
      // Unidade renomeada/excluída depois do plano: mantém a cobrança
      // pelo texto gravado no plano para o registro não sumir
      unidadesCobradas = [{ id: p.who, sigla: '', unidade: formatUnidadeUI(p.who) }];
    }
  }

  $id('acomp-ent-info').innerHTML =
    '<strong>Risco:</strong> ' + esc(formatRiscoUI(p.riscoVinculado)) +
    ' &nbsp;·&nbsp; <strong>Ação:</strong> ' + esc(p.what) +
    ' &nbsp;·&nbsp; <strong>Prazo:</strong> ' + fmtBr(p.whenPrevisto);

  if (!unidadesCobradas.length) {
    $id('acomp-ent-lista').innerHTML =
      '<p class="msg-empty">Nenhuma Subcomissão encontrada. ' +
      'Cadastre unidades com "Subcomissão" no nome para acompanhar entregas aqui.</p>';
    $id('modal-acomp-entregas').dataset.idx = idx;
    abrirModal('modal-acomp-entregas');
    return;
  }

  $id('modal-acomp-entregas').dataset.idx = idx;

  $id('acomp-ent-lista').innerHTML = unidadesCobradas.map(function(u, i) {
    const chave = u.id || (u.sigla ? (u.sigla + ' - ' + u.unidade) : u.unidade);
    const ent = state.deliveries.find(function(e) {
      return e.riscoVinculado === p.riscoVinculado && e.unidade === chave;
    });
    const entregue = ent ? ent.entregue : '';
    const sei      = ent && ent.processoSei && ent.processoSei !== '-' ? ent.processoSei : '';
    const dataEnt  = ent && ent.dataEntrega ? ent.dataEntrega : '';
    const rowClass = entregue === 'Sim' ? 'entregue' : (entregue === 'Não' ? 'pendente' : '');
    const selClass = rowClass ? (' ' + rowClass) : '';
    return (
      '<div class="acomp-ent-row ' + rowClass + '" data-unidade="' + esc(chave) + '" style="display:flex; align-items:center; gap:16px; flex-wrap:nowrap;">' +
        '<div class="acomp-unit-info" style="flex:1; min-width:200px;">' +
          '<div class="acomp-unit-sigla">' + esc(u.sigla || '') + '</div>' +
          '<div class="acomp-unit-nome" style="white-space:normal; line-height:1.2; margin-top:2px;">' + esc(u.unidade) + '</div>' +
        '</div>' +
        '<div class="acomp-field-group acomp-status-wrap" style="width:160px; flex-shrink:0;">' +
          '<span class="acomp-field-label">Status</span>' +
          '<select class="acomp-status-select acomp-status' + selClass + '" data-row="' + i + '" style="width:100%;">' +
            '<option value=""' + (!entregue ? ' selected' : '') + '>— Selecione —</option>' +
            '<option value="Sim"' + (entregue === 'Sim' ? ' selected' : '') + '>Sim — Entregue</option>' +
            '<option value="Não"' + (entregue === 'Não' ? ' selected' : '') + '>Não — Pendente</option>' +
          '</select>' +
        '</div>' +
        '<div class="acomp-sei-wrap" style="display:flex; align-items:center; gap:12px; flex-shrink:0;">' +
          '<div class="acomp-field-group">' +
            '<span class="acomp-field-label">Data de Entrega</span>' +
            '<input type="date" class="acomp-data" value="' + esc(dataEnt) + '" style="width:130px; height:32px; padding:0 8px;">' +
          '</div>' +
          '<div class="acomp-field-group">' +
            '<span class="acomp-field-label">Nº Processo SEI <span style="color:#dc2626;">*</span></span>' +
            '<input type="text" class="acomp-sei" placeholder="Ex: 00060-000..." value="' + esc(sei) + '" style="width:150px; height:32px; padding:0 8px;">' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  // Atualiza só o visual ao mudar status — os campos de Data/SEI ficam
  // sempre visíveis para manter todas as linhas alinhadas entre si
  $id('acomp-ent-lista').querySelectorAll('.acomp-status').forEach(function(sel) {
    sel.addEventListener('change', function() {
      const row  = this.closest('.acomp-ent-row');
      row.classList.remove('entregue', 'pendente');
      this.classList.remove('entregue', 'pendente');
      if (this.value === 'Sim')      { row.classList.add('entregue'); this.classList.add('entregue'); }
      else if (this.value === 'Não') { row.classList.add('pendente'); this.classList.add('pendente'); }
    });
  });

  abrirModal('modal-acomp-entregas');
}

function salvarAcompEntregas() {
  const btn = $id('btn-salvar-acomp-entregas');
  const idxModal = $id('modal-acomp-entregas').dataset.idx;
  const p = state.plans[idxModal]; if (!p) return;

  const rows = $id('acomp-ent-lista').querySelectorAll('.acomp-ent-row');
  const entregas = [];
  let valido = true;

  rows.forEach(function(row) {
    const unidade  = row.dataset.unidade;
    const status   = row.querySelector('.acomp-status').value;
    const sei      = row.querySelector('.acomp-sei').value.trim();
    const dataEnt  = row.querySelector('.acomp-data').value;

    if (!status) return; // linha sem seleção — ignora

    if (status === 'Sim' && !sei) {
      showAlerta('Informe o número SEI para: ' + unidade);
      valido = false;
      return;
    }

    entregas.push({
      unidade:      unidade,
      entregue:     status,
      dataEntrega:  status === 'Sim' ? (dataEnt || hojeISO()) : '',
      processoSei:  status === 'Sim' ? sei : ''
    });
  });

  if (!valido) return;
  if (!entregas.length) { fecharModal('modal-acomp-entregas'); return; }

  btn.disabled = true; btn.innerText = 'A gravar...';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.sucesso) feedbackBtn(btn, '✅ Salvo!', 'Salvar Registros', function() {
        fecharModal('modal-acomp-entregas');
        recarregarRiscosPlanos(renderAcompanhamento);
      });
      else { btn.disabled = false; btn.innerText = 'Salvar Registros'; showAlerta(r.mensagem); }
    })
    .withFailureHandler(falha(btn, 'Salvar Registros', null))
    .salvarEntregasEmLote(p.riscoVinculado, entregas);
}

// ---------- PDF ----------
// A grade da Matriz (cores + badges) é capturada como imagem real da tela
// (_capturarElementoComoImg, em JS_Utilitarios.html — usa html2canvas só
// nesses dois elementos pequenos, sem esconder nada nem piscar a tela) —
// reaproveita exatamente a mesma cor, fonte e badge que já estão corretos
// na tela, em vez de redesenhar. O conversor de PDF do Apps Script não
// pinta background-color, mas <img> sempre renderiza (mesma técnica já
// usada e funcional nos gráficos do Dashboard).
// Assíncrono (html2canvas devolve Promise) — ver Promise.resolve() em
// _gerarPdfReal/_dispararEnvioPdfReal, que aceitam tanto Promise quanto
// string dos demais relatórios (síncronos).
async function montarHtmlMatrizPdf() {
  const matrizEl  = document.querySelector('#area-matriz .matrix-table');
  const legendaEl = document.querySelector('#area-matriz .legend-row');
  const [matrizImg, legendaImg] = await Promise.all([
    _capturarElementoComoImg(matrizEl),
    _capturarElementoComoImg(legendaEl)
  ]);

  const matrizHtml = matrizImg
    ? `<img src="${matrizImg}" style="display:block;width:100%;margin-bottom:14px;">` : '';
  const legendaHtml = legendaImg
    ? `<img src="${legendaImg}" style="display:block;width:100%;margin:0 auto 20px;">` : '';

  const riscosHtml = _pdfSecaoTitulo('Mapeamento de Riscos') +
    `<table><thead><tr>
      <th style="text-align:center;">ID</th><th>Macroetapa</th><th>Risco</th><th>Causa</th><th>Consequência</th>
      <th>Categoria</th><th style="text-align:center;">P×I</th><th style="text-align:center;">Nível</th>
      <th>Tratamento</th><th>Proprietário</th><th>Plano de Ação</th>
    </tr></thead><tbody>${_tbodyParaPdf('lista-riscos')}</tbody></table>`;

  return matrizHtml + legendaHtml + riscosHtml;
}

// Corpo do relatório de Acompanhamento de Ações — KPIs + tabela de planos.
function montarHtmlAcompanhamentoPdf() {
  const getTxt = id => { const el = $id(id); return el ? el.innerText : ''; };
  const kpiHtml = `<table style="margin-bottom:18px;"><tr>
    ${_pdfKpiCell('Concluídas', getTxt('kpi-p-conc'), '#059669')}
    ${_pdfKpiCell('Em Andamento', getTxt('kpi-p-and'), '#ca8a04')}
    ${_pdfKpiCell('Atrasadas', getTxt('kpi-p-atr'), '#dc2626')}
  </tr></table>`;

  const planosHtml = `<table><thead><tr>
    <th>Risco</th><th>Ação (What)</th><th>Por que (Why)</th><th>Quem (Who)</th><th>Onde</th>
    <th>Prazo</th><th>Finalização</th><th>Como (How)</th><th>Custo</th><th style="text-align:center;">Status</th>
  </tr></thead><tbody>${_tbodyParaPdf('lista-acomp')}</tbody></table>`;

  return kpiHtml + planosHtml;
}

function atualizarLegendaRisco(prefix) {
  const probVal = $id(prefix + '-prob').value;
  const impVal = $id(prefix + '-imp').value;
  const leg = $id(prefix + '-nivel-legenda');
  const val = $id(prefix + '-nivel-valor');

  if (!probVal || !impVal) {
    if (leg && val) {
      leg.style.backgroundColor = '#f8fafc';
      leg.style.borderColor = '#e2e8f0';
      leg.style.color = '#64748b';
      val.innerText = '--';
    }
    return;
  }

  const p = Number(probVal);
  const i = Number(impVal);
  const s = p * i;
  let text = '', bg = '', cor = '', border = '';
  if (s >= 15) { text = 'Crítico (' + s + ')'; bg = '#fee2e2'; cor = '#dc2626'; border = '#f87171'; }
  else if (s >= 10) { text = 'Alto (' + s + ')'; bg = '#ffedd5'; cor = '#ea580c'; border = '#fb923c'; }
  else if (s >= 5) { text = 'Médio (' + s + ')'; bg = '#fef9c3'; cor = '#ca8a04'; border = '#facc15'; }
  else { text = 'Baixo (' + s + ')'; bg = '#dcfce3'; cor = '#16a34a'; border = '#4ade80'; }
  
  if (leg && val) {
    leg.style.backgroundColor = bg;
    leg.style.borderColor = border;
    leg.style.color = cor;
    val.innerText = text;
  }
}
