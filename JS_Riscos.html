<script>
  // ==========================================
  // MÓDULO 4 — RISCOS
  // ==========================================

  // Regra de negócio (espelho da do servidor, ver Modulo_Riscos.js): plano com
  // "TODAS" no responsável cobra todas as subcomissões; unidade é subcomissão
  // quando "Subcomissão" aparece no nome. Único ponto de verdade no cliente.
  function planoEhGlobal(quem) { return String(quem || '').toUpperCase().includes('TODAS'); }
  function ehSubcomissao(nomeUnidade) { const n = String(nomeUnidade || '').toLowerCase(); return n.includes('subcomissão') || n.includes('subcomissao'); }

  // riscoVinculado → PRIMEIRA posição em state.plans. Substitui o
  // state.plans.findIndex(...) que era chamado por linha dentro dos map() de
  // render (O(n²)); o "primeiro vence" replica a semântica do findIndex.
  function _indicePlanosPorRisco() {
    const idx = new Map();
    (state.plans || []).forEach((x, i) => {
      if (!idx.has(x.riscoVinculado)) idx.set(x.riscoVinculado, i);
    });
    return idx;
  }

  function renderMatriz() {
    msgTabela('lista-riscos', 12, 'A carregar...');
    for (let p = 1; p <= 5; p++) for (let i = 1; i <= 5; i++) { const el = $id(`cell-${p}-${i}`); if (el) el.innerHTML = ''; }

    const ativos = state.risks.filter(r => r.status !== 'Arquivado');

    ativos.forEach((r, idx) => {
      // r.probabilidade/.impacto/.nivel já vêm do servidor como a versão mais
      // recente do risco (linha de maior Versao) — não precisa mais reler o
      // histórico pra achar o valor "atual". O histórico só entra aqui pra
      // decidir a seta de tendência (comparação com a versão anterior).
      const ref = 'R' + r.id;
      const hist = state.history ? state.history.filter(h => h.id === ref && h.tipo === 'Risco') : [];
      let trendIcon = '';

      // hist.length <= 1 significa "nunca foi reavaliado de verdade" (só o
      // cadastro inicial) — não tem o que comparar, não mostra seta.
      if (hist.length > 1) {
        const prevScore = hist[hist.length - 2].prob * hist[hist.length - 2].impacto;
        const curScore = r.probabilidade * r.impacto;
        if (curScore < prevScore) trendIcon = '<span style="color:#2CA98F; font-weight:bold; margin-left:4px;" title="Risco reduziu">⬇️</span>';
        else if (curScore > prevScore) trendIcon = '<span style="color:#D8483A; font-weight:bold; margin-left:4px;" title="Risco aumentou">⬆️</span>';
        else trendIcon = '<span style="color:#6b7280; font-weight:bold; margin-left:4px;" title="Risco manteve">➖</span>';
      }

      // Mantém os campos _cur* (usados por outras telas) espelhando os
      // valores atuais, agora sem precisar derivar do histórico.
      r._curProb = r.probabilidade; r._curImp = r.impacto; r._curNivel = r.nivel; r._trend = trendIcon;

      const cel = $id(`cell-${r.probabilidade}-${r.impacto}`);
      if (cel) {
        if (!cel.querySelector('.badge-cluster')) cel.innerHTML = '<div class="badge-cluster"></div>';
        const b = document.createElement('span');
        b.className = 'risk-badge'; b.textContent = 'R' + r.id; b.title = r.nome;
        cel.querySelector('.badge-cluster').appendChild(b);
      }
    });

    if (!ativos.length) { $id('lista-riscos').innerHTML = '<div class="msg-empty" style="text-align: center; padding: 24px; color: #6b7280; font-size: 13px;">Nenhum risco ativo mapeado.</div>'; return; }
    // Índice id → posição em state.risks, montado uma vez. Antes era um
    // findIndex por linha DENTRO do map (O(n²)) — mesma correção já aplicada em
    // renderDocumentos.
    const idxPorIdRisco = new Map(state.risks.map((x, i) => [x.id, i]));
    $id('lista-riscos').innerHTML = ativos.map((r, i) => {
      const origIdx = idxPorIdRisco.has(r.id) ? idxPorIdRisco.get(r.id) : -1;
      // "Editar Risco" fica oculto quando o risco já tem um plano de ação
      // RESOLVIDO (Revisao_Pendente='Não') vinculado — a partir daí, mudar
      // Prob./Impacto só pela via formal "Reavaliar" (mantém o histórico
      // auditável). Mas enquanto a reavaliação estiver pendente de decisão
      // (recém-reavaliado, ainda sem "Manter/Cancelar/Alterar" no plano), o
      // botão reaparece — permite corrigir um erro de digitação na própria
      // reavaliação recém-feita sem precisar empilhar outra reavaliação só
      // para consertar o texto/números.
      // Ignora só Cancelado/Substituído (planos MORTOS/substituídos — nunca
      // mais recebem Revisao_Pendente='Sim', então contá-los aqui fazia
      // "temPlanoResolvido" ficar sempre true assim que o risco tivesse
      // qualquer plano antigo no histórico). "Concluído" continua contando
      // como plano resolvido de verdade (tratamento formalmente encerrado) —
      // Editar Risco deve continuar oculto nesse caso, não reaparecer.
      const planosAtivosDoRisco = state.plans.filter(p => p.riscoVinculado === 'R' + r.id &&
        p.status !== 'Cancelado' && p.status !== 'Substituído');
      const temPlanoResolvido = planosAtivosDoRisco.some(p => p.revisaoPendente !== 'Sim');
      return `<div class="grid-row-hover risco-row">
    <div style="text-align:center;font-weight:700;color:#4b5563;">${i + 1}</div>
    <div style="text-align:center;font-weight:700;color:#2b7fff;white-space:nowrap;">R-${r.id}</div>
    <div style="font-weight: 500;">${esc(r.macroetapa)}</div>
    <div><span style="display:inline-block; font-weight:600; color:#030712; border:1px solid #d1d5db; border-radius:6px; padding:4px 10px; background:#f9fafb;">${esc(r.nome)}</span></div>
    <div style="line-height: 1.4; color: #4b5563;">${esc(r.causa)}</div>
    <div style="line-height: 1.4; color: #4b5563;">${esc(r.consequencia)}</div>
    <div>${esc(r.categoria)}</div>
    <div style="text-align:center;font-weight:700;">${r._curProb * r._curImp}</div>
    <div style="text-align:center;white-space:nowrap;">${badge(r._curNivel)}${r._trend}</div>
    <div>${esc(r.tipoTratamento)}</div>
    <div>${esc(formatUnidadeUI(r.responsavel))}</div>
    <div style="line-height: 1.4; color: #4b5563;">${esc(r.planoAcao)}</div>
    <div class="no-print" style="display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;">
      ${temPlanoResolvido ? '' : iconBtn('edit', 'edit-risco', 'Editar Risco', `data-idx="${origIdx}"`)}
      ${iconBtn('rev', 'reav-risco', 'Reavaliar', `data-idx="${origIdx}"`)}
      ${iconBtn('history', 'hist-risco', 'Histórico de Reavaliações', `data-id="${r.id}"`)}
    </div>
  </div>`
    }).join('');
  }

  function abrirModalMapearRisco() {
    try {
      ['r-macro', 'r-cat', 'r-nome', 'r-causa', 'r-conseq', 'r-trat', 'r-resp'].forEach(id => { const el = $id(id); if (el) el.value = ''; });
      if ($id('r-prob')) $id('r-prob').value = '';
      if ($id('r-imp')) $id('r-imp').value = '';
      atualizarLegendaRisco('r');
      sincronizarSelectsUnidade();
      abrirModal('modal-risco-novo');
    } catch (err) {
      console.error('Erro ao abrir modal de mapear risco:', err);
      showAlerta('Não foi possível abrir o formulário: ' + (err.message || String(err)));
    }
  }

  function salvarRisco() {
    const btn = $id('btn-salvar-risco');
    const dados = {
      macroetapa: $id('r-macro').value, categoria: $id('r-cat').value,
      nome: ($id('r-nome').value || '').trim(), causa: ($id('r-causa').value || '').trim(),
      consequencia: ($id('r-conseq').value || '').trim(),
      probabilidade: Number($id('r-prob').value), impacto: Number($id('r-imp').value),
      tipoTratamento: $id('r-trat').value, responsavel: $id('r-resp').value
    };
    if (!dados.macroetapa || !dados.categoria || !dados.nome || !dados.causa || !dados.consequencia || !dados.tipoTratamento || !dados.responsavel) return showAlerta('Preencha todos os campos do risco.');
    if (!dados.probabilidade || !dados.impacto) return showAlerta('Selecione a Probabilidade e o Impacto.');
    btn.disabled = true; btn.innerText = 'A guardar...';
    google.script.run.withSuccessHandler(r => {
      if (r.sucesso) feedbackBtn(btn, '✅ Mapeado!', 'Salvar Risco', () => { fecharModal('modal-risco-novo'); recarregarRiscosPlanos(renderMatriz); });
      else { btn.disabled = false; btn.innerText = 'Salvar Risco'; showAlerta(r.mensagem); }
    }).withFailureHandler(falha(btn, 'Salvar Risco', null)).salvarRisco(dados);
  }

  function abrirEditarRisco(idx) {
    const r = state.risks[idx]; if (!r) return;
    $id('er-id').value = r.id;
    $id('er-id-row').value = r.idRow;
    $id('er-prob-original').value = r.probabilidade;
    $id('er-imp-original').value = r.impacto;

    const hist = state.history ? state.history.filter(h => h.id === 'R' + r.id && h.tipo === 'Risco') : [];
    // hist[0] é sempre o cadastro inicial (ver comentário em renderMatriz); só
    // length > 1 significa que houve reavaliação de verdade.
    const temReavaliacao = hist.length > 1;

    $id('label-risco-editar').innerText = `Risco: R${r.id} — ${r.nome}`;

    $id('er-macro').value = r.macroetapa; $id('er-cat').value = r.categoria;
    $id('er-nome').value = r.nome; $id('er-causa').value = r.causa; $id('er-conseq').value = r.consequencia;

    ['er-macro', 'er-cat', 'er-nome', 'er-causa', 'er-conseq'].forEach(id => { $id(id).disabled = temReavaliacao; });

    $id('er-prob').value = temReavaliacao ? (r._curProb || r.probabilidade) : r.probabilidade;
    $id('er-imp').value = temReavaliacao ? (r._curImp || r.impacto) : r.impacto;
    $id('er-prob').disabled = false;
    $id('er-imp').disabled = false;

    $id('er-trat').value = r.tipoTratamento;
    $id('er-resp').innerHTML = gerarOptsProprietariosRisco(); $id('er-resp').value = r.responsavel;
    atualizarLegendaRisco('er');
    abrirModal('modal-risco-editar');
  }
  function confirmarEdicaoRisco() {
    const btn = $id('btn-confirmar-risco');
    const pVal = $id('er-prob').value;
    const iVal = $id('er-imp').value;
    const dados = {
      id: $id('er-id').value, idRow: $id('er-id-row').value, macroetapa: $id('er-macro').value, categoria: $id('er-cat').value,
      nome: $id('er-nome').value.trim(), causa: $id('er-causa').value.trim(), consequencia: $id('er-conseq').value.trim(),
      probabilidade: Number(pVal), impacto: Number(iVal),
      tipoTratamento: $id('er-trat').value, responsavel: $id('er-resp').value
    };
    if (!dados.nome || !dados.causa || !dados.consequencia || !dados.probabilidade || !dados.impacto) return showAlerta('Preencha os campos obrigatórios, incluindo Probabilidade e Impacto.');
    btn.disabled = true; btn.innerText = 'A atualizar...';
    google.script.run.withSuccessHandler(r => {
      if (r.sucesso) feedbackBtn(btn, '✅ Salvo!', 'Salvar Risco', () => { fecharModal('modal-risco-editar'); recarregarRiscosPlanos(renderMatriz); });
      else { btn.disabled = false; btn.innerText = 'Salvar Risco'; showAlerta(r.mensagem); }
    }).withFailureHandler(falha(btn, 'Salvar Risco', null)).atualizarRisco(dados);
  }

  function abrirModalReavaliar(idx) {
    const r = state.risks[idx]; if (!r) return;
    $id('rev-id-risco').value = r.id;
    $id('rev-id-row').value = r.idRow;
    $id('rev-info').innerText = `Risco: R${r.id} — ${r.nome} \nNível Atual: ${r._curNivel} (${r._curProb * r._curImp})`;
    $id('rev-prob').value = r._curProb || r.probabilidade;
    $id('rev-imp').value = r._curImp || r.impacto;
    $id('rev-trat').value = r.tipoTratamento;
    $id('rev-resp').innerHTML = gerarOptsProprietariosRisco(); $id('rev-resp').value = r.responsavel;
    $id('rev-justif').value = '';



    $id('rev-acao').value = '';
    toggleCamposReavaliacao();
    atualizarLegendaRisco('rev');

    abrirModal('modal-reavaliar-risco');
  }

  // Somente leitura — usado na aba Arquivados, onde o risco já está
  // Superado/Arquivado e não faz sentido abrir o modal de Reavaliar (que
  // permite editar/reavaliar). Recebe o ID do risco (não o índice), mesmo
  // padrão de confirmarRestaurarRisco.
  function abrirHistoricoRisco(id) {
    const r = state.risks.find(x => String(x.id) === String(id)); if (!r) return;
    $id('hist-risco-info').innerText = `Risco: R${r.id} — ${r.nome}`;

    const hTable = $id('hist-risco-lista');
    const hist = state.history ? state.history.filter(h => h.id === 'R' + r.id && h.tipo === 'Risco') : [];
    if (hist.length) {
      hTable.innerHTML = hist.map(h => {
        let planoTexto = '-';
        if (h.idPlano) {
          const p = state.plans.find(x => x.id === h.idPlano);
          planoTexto = p ? p.what : h.idPlano;
        }
        return `<tr>
      <td>${(h.data||'').split('-').reverse().join('/')}</td>
      <td>${h.prob}</td><td>${h.impacto}</td><td>${badge(h.nivel)}</td>
      <td>${esc(h.tratamento || '-')}</td><td>${esc(formatUnidadeUI(h.responsavel) || '-')}</td>
      <td>${esc(planoTexto)}</td>
      <td>${esc(h.justificativa)}</td>
    </tr>`;
      }).join('');
    } else {
      hTable.innerHTML = '<tr><td colspan="8" class="msg-empty">Nenhum histórico encontrado.</td></tr>';
    }

    abrirModal('modal-historico-risco');
  }

  function toggleCamposReavaliacao() {
    const acao = $id('rev-acao').value;
    const notasDiv = $id('rev-campos-notas');

    if (acao === 'superado' || acao === '') {
      notasDiv.style.display = 'none';
    } else {
      notasDiv.style.display = 'block';
      const disable = (acao === 'manter');
      $id('rev-prob').disabled = disable;
      $id('rev-imp').disabled = disable;
      $id('rev-trat').disabled = disable;
      $id('rev-resp').disabled = disable;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const btnRevRisco = $id('btn-salvar-reaval');
    if (btnRevRisco) btnRevRisco.addEventListener('click', () => {
      const btn = btnRevRisco;
      const acao = $id('rev-acao').value;
      const idRisco = $id('rev-id-risco').value;

      if (!acao) return showAlerta('Selecione uma ação.');

      if (acao === 'superado') {
        const justificativa = $id('rev-justif').value.trim();
        if (!justificativa) return showAlerta('Descreva a justificativa para superar/arquivar este risco.');
        btn.disabled = true; btn.innerText = 'A arquivar...';
        google.script.run.withSuccessHandler(r => {
          if (r && r.sucesso === false) { btn.disabled = false; btn.innerText = 'Salvar Ação'; showAlerta(r.mensagem); return; }
          feedbackBtn(btn, '✅ Superado!', 'Salvar Ação', () => { fecharModal('modal-reavaliar-risco'); recarregarRiscosPlanos(renderMatriz); });
        }).withFailureHandler(falha(btn, 'Salvar Ação', null)).excluirRisco(idRisco);
        return;
      }

      const riscoAtual = state.risks.find(x => String(x.id) === String(idRisco));
      if (acao === 'reavaliar' && riscoAtual) {
        if (
          Number($id('rev-prob').value) === riscoAtual._curProb &&
          Number($id('rev-imp').value) === riscoAtual._curImp &&
          $id('rev-trat').value === riscoAtual.tipoTratamento &&
          $id('rev-resp').value === riscoAtual.responsavel
        ) {
          return showAlerta('Você não alterou nenhuma nota ou responsabilidade. Se o objetivo é apenas confirmar que o risco continua igual, por favor, altere a Ação no topo para "Manter Avaliação Atual".');
        }
      }

      const dados = {
        idRisco: idRisco,
        idRow: $id('rev-id-row').value,
        probabilidade: Number($id('rev-prob').value),
        impacto: Number($id('rev-imp').value),
        tipoTratamento: $id('rev-trat').value,
        responsavel: $id('rev-resp').value,
        justificativa: $id('rev-justif').value.trim() || 'Reavaliação periódica.'
      };
      if (!dados.probabilidade || !dados.impacto) return showAlerta('Probabilidade e Impacto são obrigatórios.');
      if (!dados.tipoTratamento || !dados.responsavel) return showAlerta('Tipo de Tratamento e Proprietário do Risco são obrigatórios.');
      btn.disabled = true; btn.innerText = 'A salvar...';
      google.script.run.withSuccessHandler(r => {
        if (r.sucesso) feedbackBtn(btn, '✅ Salvo!', 'Salvar Ação', () => { fecharModal('modal-reavaliar-risco'); recarregarRiscosPlanos(renderMatriz); });
        else { btn.disabled = false; btn.innerText = 'Salvar Ação'; showAlerta(r.mensagem); }
      }).withFailureHandler(falha(btn, 'Salvar Ação', null)).reavaliarRisco(dados);
    });
  });

  // ==========================================
  // MÓDULO 4 — PLANOS DE AÇÃO (5W2H)
  // ==========================================
  function formatRiscoUI(val) {
    if (!val || val === '-') return val || '';
    const idx = state.risks.findIndex(x => 'R' + x.id === String(val));
    if (idx !== -1) {
      return `Risco ${idx + 1} — ${state.risks[idx].nome}`;
    }
    return val;
  }

  function carregarRiscosLivres() {
    const sel = $id('p-risco');
    sel.innerHTML = '<option value="">A carregar riscos sem plano...</option>';
    const idsComPlano = new Set(state.plans.map(p => p.riscoVinculado));
    const livres = state.risks.filter(r => !idsComPlano.has('R' + r.id));
    if (!livres.length) { sel.innerHTML = '<option value="">Nenhum risco sem plano de ação.</option>'; return; }
    const idxPorIdRisco = new Map(state.risks.map((x, i) => [x.id, i]));
    sel.innerHTML = '<option value="" disabled selected>Selecione o risco...</option>' +
      livres.map(r => {
        const idx = idxPorIdRisco.has(r.id) ? idxPorIdRisco.get(r.id) : -1;
        return `<option value="R${r.id}">Risco ${idx + 1} — ${esc(r.nome)}</option>`;
      }).join('');
  }

  function abrirModalNovoPlano() {
    try {
      ['p-risco', 'p-what', 'p-why', 'p-where', 'p-when', 'p-how', 'p-who', 'p-howmuch'].forEach(id => { const el = $id(id); if (el) el.value = ''; });
      sincronizarSelectsUnidade();
      carregarRiscosLivres();
      abrirModal('modal-plano-novo');
    } catch (err) {
      console.error('Erro ao abrir modal de novo plano:', err);
      showAlerta('Não foi possível abrir o formulário de novo plano: ' + (err.message || String(err)));
    }
  }

  function salvarPlano() {
    const btn = $id('btn-salvar-plano');
    const dados = {
      riscoVinculado: $id('p-risco').value, what: ($id('p-what').value || '').trim(),
      why: ($id('p-why').value || '').trim(), who: $id('p-who').value,
      where: ($id('p-where').value || '').trim(), whenPrevisto: $id('p-when').value,
      whenFinalizado: '', how: ($id('p-how').value || '').trim(),
      howMuch: ($id('p-howmuch').value || '').trim() || 'Sem custos'
    };
    if (!dados.riscoVinculado || !dados.what || !dados.why || !dados.who || !dados.where || !dados.whenPrevisto || !dados.how) return showAlerta('Preencha todos os campos do plano.');
    btn.disabled = true; btn.innerText = 'A guardar...';
    google.script.run.withSuccessHandler(r => {
      if (r.sucesso) feedbackBtn(btn, '✅ Registrado!', 'Salvar Plano de Ação', () => { fecharModal('modal-plano-novo'); recarregarRiscosPlanos(renderAcompanhamento); });
      else { btn.disabled = false; btn.innerText = 'Salvar Plano de Ação'; showAlerta(r.mensagem); }
    }).withFailureHandler(falha(btn, 'Salvar Plano de Ação', null)).salvarPlano(dados);
  }

  function renderAcompanhamento() {
    $id('kpi-p-conc').innerText = state.plans.filter(p => p.status === 'Concluído').length;
    $id('kpi-p-and').innerText = state.plans.filter(p => p.status === 'Em Andamento').length;
    $id('kpi-p-atr').innerText = state.plans.filter(p => p.status === 'Atrasado').length;

    const fU = ($id('f-acomp-unidade') || { value: '' }).value;
    const fS = ($id('f-acomp-status') || { value: '' }).value;

    const ativosRiscosMap = new Map();
    state.risks.filter(r => r.status !== 'Arquivado').forEach(r => ativosRiscosMap.set('R' + r.id, r));

    const filtrados = state.plans.filter(p => ativosRiscosMap.has(p.riscoVinculado) && (!fU || p.who === fU) && (!fS || p.status === fS));

    const container = $id('container-planos');
    if (!container) return;

    // idx de cada plano em state.plans, pré-computado (evita indexOf O(n²) por
    // linha dentro do map — mesmo padrão de idxPorIdRisco/_indicePlanosPorRisco).
    const idxPlano = new Map(state.plans.map((pl, i) => [pl, i]));

    if (!filtrados.length) {
      container.innerHTML = '<div class="msg-empty" style="text-align:center; padding: 30px; background: #f9fafb; border: 1px dashed #d1d5db; border-radius: 6px; color: #4b5563;">Nenhum plano ativo encontrado.</div>';
      return;
    }

    // Agrupar planos filtrados por risco
    const planosPorRisco = {};
    filtrados.forEach(p => {
      if (!planosPorRisco[p.riscoVinculado]) planosPorRisco[p.riscoVinculado] = [];
      planosPorRisco[p.riscoVinculado].push(p);
    });

    const html = Object.keys(planosPorRisco).map(ref => {
      const r = ativosRiscosMap.get(ref);
      const planos = planosPorRisco[ref];
      if (!r) return '';

      // histRisco contém todas as versões do risco (da mais antiga para a mais nova)
      const histRisco = state.history ? state.history.filter(h => h.id === 'R' + r.id && h.tipo === 'Risco') : [];
      
      let versoesHtml = histRisco.map((v, idxHist) => {
        const p = v.idPlano ? state.plans.find(x => x.id === v.idPlano) : null;
        
        const isLatest = (idxHist === histRisco.length - 1);
        const vNum = idxHist + 1;
        const dataA = v.data && v.data !== '-' ? v.data : '';

        let planCardHtml = '';
        if (p) {
          const oi = idxPlano.get(p);

        return String(u.id) === String(p.who) || (u.sigla + ' - ' + u.unidade) === p.who;

  // ---------- PDF ----------
  // A grade da Matriz (cores + badges) é capturada como imagem real da tela
  // (_capturarElementoComoImg, em JS_Utilitarios.html — usa html2canvas só
  // nesses dois elementos pequenos, sem esconder nada nem piscar a tela) —
  // reaproveita exatamente a mesma cor, fonte e badge que já estão corretos
  // na tela, em vez de redesenhar. O conversor de PDF do Apps Script não
  // pinta background-color, mas <img> sempre renderiza (mesma técnica já
  // usada e funcional nos gráficos do Dashboard).
  // Assíncrono (html2canvas devolve Promise) — ver Promise.resolve() em
  // _gerarPdfReal/_dispararEnvioPdfReal, que aceitam tanto Promise quanto
  // string dos demais relatórios (síncronos).
  // #lista-riscos é um <div> (linhas em CSS Grid, não <tr>) — _tbodyParaPdf
  // clonaria essas <div> direto para dentro de um <tbody>, o que é HTML
  // inválido (só <tr> pode ficar num <tbody>). O conversor de PDF "corrige"
  // isso sozinho tirando as <div> de dentro da tabela, e o resultado é a
  // linha aparecendo solta (com o visual cru da tela) e a tabela real vazia,
  // só com o cabeçalho. Este helper remonta cada linha como <tr><td> de
  // verdade, célula a célula, preservando o estilo/cor de cada uma.
  function _linhasMatrizParaPdf_() {
    const lista = $id('lista-riscos');
    if (!lista) return '';
    const clone = lista.cloneNode(true);
    clone.querySelectorAll('.no-print').forEach(el => el.remove());
    _converterBadgesParaPdf(clone);
    return Array.from(clone.children).filter(function (row) {
      return row.classList && row.classList.contains('grid-row-hover');
    }).map(function (row) {
      const celulas = Array.from(row.children).map(function (cel) {
        return '<td style="' + (cel.getAttribute('style') || '') + '">' + cel.innerHTML + '</td>';
      }).join('');
      return '<tr>' + celulas + '</tr>';
    }).join('');
  }

  async function montarHtmlMatrizPdf() {
    const matrizEl = document.querySelector('#area-matriz .matrix-table');
    const legendaEl = document.querySelector('#area-matriz .legend-row');
    const [matrizImg, legendaImg] = await Promise.all([
      _capturarElementoComoImg(matrizEl),
      _capturarElementoComoImg(legendaEl)
    ]);

    const matrizHtml = matrizImg
      ? `<img src="${matrizImg}" style="display:block;width:100%;margin-bottom:14px;">` : '';
    const legendaHtml = legendaImg
      ? `<img src="${legendaImg}" style="display:block;width:100%;margin:0 auto 20px;">` : '';

    const riscosHtml = _pdfSecaoTitulo('Mapeamento de Riscos') +
      `<table><thead><tr>
      <th style="text-align:center;">#</th><th style="text-align:center;">ID</th><th>Macroetapa</th><th>Risco</th><th>Causa</th><th>Consequência</th>
      <th>Categoria</th><th style="text-align:center;">P×I</th><th style="text-align:center;">Nível</th>
      <th>Tratamento</th><th>Proprietário</th><th>Plano de Ação</th>
    </tr></thead><tbody>${_linhasMatrizParaPdf_()}</tbody></table>`;

    return matrizHtml + legendaHtml + riscosHtml;
  }

  // Corpo do relatório de Acompanhamento de Ações — KPIs + tabela de planos.
  function montarHtmlAcompanhamentoPdf() {
    const container = $id('container-planos');
    if (!container) return '';

    const clone = container.cloneNode(true);
    clone.querySelectorAll('.no-print').forEach(el => el.remove());
    _converterBadgesParaPdf(clone);

    // O layout usa .plan-single-line que é display: grid. 
    // O conversor de PDF não lida bem com grid, então transformamos em <table>.
    clone.querySelectorAll('.plan-single-line').forEach(function (grid) {
      // O grid possui 9 divs filhas.
      const divs = Array.from(grid.children);
      
      // Proporções do grid CSS para as larguras da tabela:
      // minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr) minmax(0,1fr) minmax(0,0.8fr) minmax(0,0.8fr)
      // Percentuais aproximados: 16%, 16%, 11%, 11%, 9%, 9%, 11%, 9%, 8%
      const widths = ['16%', '16%', '11%', '11%', '9%', '9%', '11%', '9%', '8%'];
      
      let theadCells = '';
      let tbodyCells = '';
      
      divs.forEach((div, i) => {
         const w = widths[i] || 'auto';
         const labelDiv = div.querySelector('.plan-field-label');
         const valueDiv = div.querySelector('.plan-field-value');
         const label = labelDiv ? labelDiv.innerHTML : '';
         const value = valueDiv ? valueDiv.innerHTML : div.innerHTML; // Fallback se a estrutura for diferente
         
         theadCells += `<th style="width:${w}; font-size:9.5px; color:#6b7280; border-bottom:1px solid #e5e7eb; padding:6px 4px; text-align:left; text-transform:uppercase; font-weight:bold;">${label}</th>`;
         tbodyCells += `<td style="width:${w}; font-size:11px; color:#111827; padding:8px 4px; vertical-align:top;">${value}</td>`;
      });
      
      grid.outerHTML = `<table style="width:100%; border-collapse:collapse; margin-top:8px;">
          <thead><tr>${theadCells}</tr></thead>
          <tbody><tr>${tbodyCells}</tr></tbody>
        </table>`;
    });

    return clone.innerHTML;
  }

  function atualizarLegendaRisco(prefix) {
    const probVal = $id(prefix + '-prob').value;
    const impVal = $id(prefix + '-imp').value;
    const leg = $id(prefix + '-nivel-legenda');
    const val = $id(prefix + '-nivel-valor');

    if (!probVal || !impVal) {
      if (leg && val) {
        leg.style.backgroundColor = '#f9fafb';
        leg.style.borderColor = '#e5e7eb';
        leg.style.color = '#4b5563';
        val.innerText = '--';
      }
      return;
    }

    const p = Number(probVal);
    const i = Number(impVal);
    const s = p * i;
    // Nível a partir do score; as cores saem de CORES_STATUS (fonte única, ver
    // JS_Utilitarios.html) — a borda usa a própria cor do texto.
    const nivel = s >= 15 ? 'Crítico' : s >= 10 ? 'Alto' : s >= 5 ? 'Médio' : 'Baixo';
    const [bg, cor] = CORES_STATUS[nivel];

    if (leg && val) {
      leg.style.backgroundColor = bg;
      leg.style.borderColor = cor;
      leg.style.color = cor;
      val.innerText = nivel + ' (' + s + ')';
    }
  }

  // ==========================================
  // ABA ARQUIVADOS (Riscos e Planos)
  // ==========================================
  function renderRiscosArquivados() {
    const arquivadosRiscos = state.risks.filter(r => r.status === 'Arquivado');
    const container = $id('container-arquivados');

    if (!container) return;

    if (!arquivadosRiscos.length) {
      container.innerHTML = '<div class="msg-empty" style="text-align:center; padding: 30px; background: #f9fafb; border: 1px dashed #d1d5db; border-radius: 6px; color: #4b5563;">Nenhum risco ou plano arquivado no momento.</div>';
      return;
    }

    // idx de cada plano em state.plans, pré-computado (evita indexOf O(n²)).
    const idxPlano = new Map(state.plans.map((pl, i) => [pl, i]));
    const idsArquivados = new Set(arquivadosRiscos.map(r => 'R' + r.id));
    const planosArquivados = state.plans.filter(p => idsArquivados.has(p.riscoVinculado));
    const planosPorRisco = {};
    planosArquivados.forEach(p => {
      if (!planosPorRisco[p.riscoVinculado]) planosPorRisco[p.riscoVinculado] = [];
      planosPorRisco[p.riscoVinculado].push(p);
    });

    const html = arquivadosRiscos.map((r, idx) => {
      const ref = 'R' + r.id;
      const planos = planosPorRisco[ref] || [];

      let planosHtml = '';
      if (planos.length === 0) {
        planosHtml = '<div style="font-size:13px; color:#6b7280; font-style:italic;">Nenhum plano de ação associado a este risco.</div>';
      } else {
        planosHtml = `<div style="margin-top: 12px; border-top: 1px solid #e5e7eb; padding-top: 12px;">
        <div style="display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,0.85fr) minmax(0,0.85fr) minmax(0,1.5fr) minmax(0,0.8fr) minmax(0,1fr) minmax(0,0.9fr); gap: 8px; padding: 0 20px 8px; font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e5e7eb; margin-bottom: 8px; text-align: left;">
          <div>Ação (What)</div>
          <div>Por que (Why)</div>
          <div>Quem (Who)</div>
          <div>Onde</div>
          <div>Prazo</div>
          <div>Finalização</div>
          <div>Como (How)</div>
          <div>Custo</div>
          <div style="text-align:center;">Status</div>
          <div class="no-print" style="text-align:center;">Ações</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          ${planos.map(p => {
          const oi = idxPlano.get(p);
          let rowStyle = 'display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) minmax(0,0.85fr) minmax(0,0.85fr) minmax(0,1.5fr) minmax(0,0.8fr) minmax(0,1fr) minmax(0,0.9fr); gap: 8px; align-items: center; font-size: 13px; color: #111827; padding: 8px 20px; border-bottom: 1px solid #f3f4f6; transition: background 0.2s; text-align: left; word-break: break-word;';
          if (p.status === 'Cancelado') {
            rowStyle += ' text-decoration: line-through; opacity: 0.6;';
          } else if (p.status === 'Substituído') {
            rowStyle += ' opacity: 0.6;';
          } else if (p.revisaoPendente === 'Sim') {
            rowStyle += ' background-color: #fffbeb;';
          }
          return `<div style="${rowStyle}" onmouseover="this.style.backgroundColor='#f9fafb'" onmouseout="this.style.backgroundColor='${p.revisaoPendente === 'Sim' && p.status !== 'Cancelado' && p.status !== 'Substituído' ? '#fffbeb' : 'transparent'}'">
              <div style="font-weight: 500;">${esc(p.what)}</div>
              <div>${esc(p.why)}</div>
              <div>${esc(formatUnidadeUI(p.who))}</div>
              <div>${esc(p.where)}</div>
              <div>${fmtBr(p.whenPrevisto)}</div>
              <div>${fmtBr(p.whenFinalizado)}</div>
              <div>${esc(p.how)}</div>
              <div>${esc(p.howMuch)}</div>
              <div style="text-align:center;">${badge(p.status)}</div>
              <div class="no-print" style="display: flex; justify-content: center; gap: 4px; flex-wrap: wrap;">
                ${iconBtn('history', 'acomp-entregas', 'Acompanhamento / Entregas', `data-idx="${oi}"`)}
              </div>
            </div>`;
        }).join('')}
        </div>
      </div>`;
      }

      // r.probabilidade/.impacto/.nivel/.tipoTratamento/.responsavel já vêm do
      // servidor como a versão mais recente do risco — não precisa mais
      // derivar do histórico.
      const curProb = r.probabilidade, curImp = r.impacto, curNivel = r.nivel;
      const curTratamento = r.tipoTratamento, curResp = r.responsavel;

      return `<div class="grid-row-hover" style="background-color: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.02); margin-bottom: 8px;">
      <div style="display: grid; grid-template-columns: 50px 50px minmax(0,1.4fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1fr) 55px 90px minmax(0,1.2fr) minmax(0,1.2fr) minmax(0,1.5fr) 70px; gap: 8px; align-items: center; padding: 12px 20px; font-size: 13px; color: #111827; text-align: left; word-break: break-word;">
        <div style="text-align:center;font-weight:700;color:#4b5563;">${idx + 1}</div>
        <div style="text-align:center;font-weight:700;color:#6b7280;white-space:nowrap;">R-${r.id}</div>
        <div style="font-weight: 500;">${esc(r.macroetapa)}</div>
        <div><span style="display:inline-block; font-weight:600; color:#030712; border:1px solid #d1d5db; border-radius:6px; padding:4px 10px; background:#f9fafb;">${esc(r.nome)}</span></div>
        <div style="line-height: 1.4; color: #4b5563;">${esc(r.causa)}</div>
        <div style="line-height: 1.4; color: #4b5563;">${esc(r.consequencia)}</div>
        <div>${esc(r.categoria)}</div>
        <div style="text-align:center;font-weight:700;">${curProb * curImp}</div>
        <div style="text-align:center;white-space:nowrap;">${badge(curNivel)}</div>
        <div>${esc(curTratamento)}</div>
        <div>${esc(formatUnidadeUI(curResp))}</div>
        <div style="line-height: 1.4; color: #4b5563;">${esc(r.planoAcao)}</div>
        <div class="no-print" style="display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;">
          ${iconBtn('clock', 'hist-risco', 'Ver Histórico de Reavaliações', `data-id="${r.id}"`)}
          ${iconBtn('restore', 'restore-risco', 'Restaurar Risco para Ativo', `data-id="${r.id}"`)}
        </div>
      </div>
      <div style="padding: 0 16px 12px; border-top: 1px solid #f3f4f6; margin-top: 4px;">
        <div style="font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 8px;">Planos de Ação (5W2H) Vinculados:</div>
        ${planosHtml}
      </div>
    </div>`;
    }).join('');

    container.innerHTML = html;
  }

  function confirmarRestaurarRisco(id) {
    showConfirm('Deseja restaurar este risco? Ele voltará a aparecer na Matriz de Risco como Ativo.', () => {
      google.script.run.withSuccessHandler(r => {
        if (r.sucesso) { recarregarRiscosPlanos(renderRiscosArquivados); }
        else { showAlerta(r.mensagem); }
      }).withFailureHandler(e => showAlerta(String(e))).restaurarRisco(id);
    }, { tone: 'restore', loadingText: 'A restaurar...' });
  }

  function montarHtmlRiscoArquivadoPdf() {
    const container = $id('container-arquivados');
    if (!container) return '';

    // Limpa elementos marcados com no-print antes de jogar pro PDF
    const clone = container.cloneNode(true);
    clone.querySelectorAll('.no-print').forEach(e => e.remove());

    // Mesmo problema documentado em montarHtmlAcompanhamentoPdf: os blocos em
    // display:grid (linha de dados do risco e o bloco de planos vinculados,
    // cabeçalho + linhas — ver renderRiscosArquivados) não são confiáveis no
    // conversor de PDF do Apps Script: ficavam sem cabeçalho e com colunas
    // desalinhadas/sobrepostas. Substitui os dois por <table> real.
    clone.querySelectorAll('.grid-row-hover').forEach(function (card) {
      // Linha de dados do risco (primeiro filho do card) — mesmo cabeçalho de
      // colunas usado no relatório da Matriz de Risco (montarHtmlMatrizPdf),
      // já que as duas telas mostram exatamente os mesmos 12 campos.
      const riscoGrid = card.firstElementChild;
      if (riscoGrid && riscoGrid.children.length) {
        const celulasRisco = Array.from(riscoGrid.children).map(function (c) {
          return '<td style="' + (c.getAttribute('style') || '') + '">' + c.innerHTML + '</td>';
        }).join('');
        riscoGrid.outerHTML = '<table><thead><tr>' +
          '<th style="text-align:center;">#</th><th style="text-align:center;">ID</th><th>Macroetapa</th><th>Risco</th><th>Causa</th><th>Consequência</th>' +
          '<th>Categoria</th><th style="text-align:center;">P×I</th><th style="text-align:center;">Nível</th>' +
          '<th>Tratamento</th><th>Proprietário</th><th>Plano de Ação</th>' +
          '</tr></thead><tbody><tr>' + celulasRisco + '</tr></tbody></table>';
      }

      const secaoPlanos = card.querySelector('div[style*="padding: 0 16px 12px"]');
      const planosWrap = secaoPlanos ? secaoPlanos.lastElementChild : null;
      const header = planosWrap ? planosWrap.firstElementChild : null;
      const linhasWrap = planosWrap ? planosWrap.lastElementChild : null;
      if (!header || !linhasWrap || header === linhasWrap) return;

      const theadCels = Array.from(header.children).map(function (c) {
        return '<th style="' + (c.getAttribute('style') || '') + '">' + c.innerHTML + '</th>';
      }).join('');
      const corpo = Array.from(linhasWrap.children).map(function (row) {
        const celulas = Array.from(row.children).map(function (c) {
          return '<td style="' + (c.getAttribute('style') || '') + '">' + c.innerHTML + '</td>';
        }).join('');
        return '<tr>' + celulas + '</tr>';
      }).join('');

      planosWrap.innerHTML = '<table><thead><tr>' + theadCels + '</tr></thead><tbody>' + corpo + '</tbody></table>';
    });

    return _pdfSecaoTitulo('Riscos Superados / Arquivados') + clone.innerHTML;
  }

  // Mesmo padrão dos demais relatórios: o tipo 'risco-arquivado' está em
  // CFG_PDF e gerarPdfLocal/_gerarPdfReal cuidam do estado do botão e da espera
  // pelos dados. Os handlers antigos chamavam _gerarPdfReal/_dispararEnvioPdfReal
  // com a assinatura errada (passavam o HTML onde se espera o tipo) e encadeavam
  // .finally() num retorno undefined — o TypeError síncrono deixava o botão preso
  // em "A gerar..." até um F5.
  document.addEventListener('DOMContentLoaded', () => {
    const btnPdfRiscoArq = $id('btn-pdf-risco-arquivado');
    if (btnPdfRiscoArq) btnPdfRiscoArq.addEventListener('click', () => gerarPdfLocal('risco-arquivado'));

    const btnEmailRiscoArq = $id('btn-email-risco-arquivado');
    if (btnEmailRiscoArq) btnEmailRiscoArq.addEventListener('click', () => abrirModalEmail('risco-arquivado'));
  });
</script>
