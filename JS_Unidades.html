<script>
// ==========================================
// MÓDULO 2 — UNIDADES
// ==========================================
function renderUnidades() {
  const tbody = $id('lista-unidades');
  let units = Array.isArray(state.units) ? state.units : [];
  
  const chkInativas = $id('chk-unidades-inativas');
  if (chkInativas && !chkInativas.checked) {
    units = units.filter(u => u.ativo !== false);
  }

  if (!units.length) { tbody.innerHTML = '<div class="msg-empty" style="text-align: center; padding: 24px; color: #6b7280; font-size: 13px;">Nenhuma unidade cadastrada.</div>'; return; }
  const ordenadas = units
    .map(u => ({ u, i: state.units.indexOf(u) }))
    .sort((a, b) => a.u.unidade.localeCompare(b.u.unidade, 'pt-BR', { sensitivity: 'base' }));
  tbody.innerHTML = ordenadas.map(({u, i}) => {
    const inativo = u.ativo === false;
    const acaoStatus = inativo
      ? iconBtn('check', 'reativar-unidade', 'Reativar unidade', `data-idx="${i}"`)
      : `${iconBtn('edit','edit-unidade','Editar',`data-idx="${i}"`)}
         ${iconBtn('ban', 'inativar-unidade', 'Inativar unidade', `data-idx="${i}"`)}`;
    
    // O campo aceita texto livre (unidade sem Drive). Só vira o botão clicável
    // "Acessar" quando é http(s) de verdade; qualquer outro texto (ex.: 'Não
    // possui') aparece escapado, como texto puro. O teste é o mesmo regex de
    // linkA() — mais estrito que o startsWith('http') antigo, que aceitava lixo
    // como 'httpfoo' e ainda prefixava 'https://' em texto comum, gerando link
    // quebrado.
    const dv = String(u.linkDrive || '').trim();
    const celulaDrive = !dv ? '-'
      : /^https?:\/\//i.test(dv)
        ? `<a href="${esc(dv)}" target="_blank" rel="noopener noreferrer" style="color:#2b7fff; text-decoration:none; font-weight:500;">🔗 Acessar</a>`
        : `<span style="color:#4b5563; font-size:12px;">${esc(dv)}</span>`;

    return `<div class="grid-row-hover unid-row${inativo ? ' unid-row--inativa' : ''}">
    <div class="unid-c-sigla">${esc(u.sigla)}${inativo?' '+badgeInativo():''}</div>
    <div class="unid-c-nome">${esc(u.unidade)}</div>
    <div class="unid-c-email">${esc(u.email)}</div>
    <div class="unid-c-drive">${celulaDrive}</div>
    <div class="no-print unid-c-acoes">
      ${acaoStatus}
    </div>
  </div>`;
  }).join('');
}

// Sigla no momento em que a edição foi aberta — o servidor confere esse
// valor antes de gravar, já que o id da unidade é a posição da linha
var unidadeSiglaOriginal = '';

function abrirModalUnidade() {
  $id('eu-id').value = ''; $id('eu-nome').value = ''; $id('eu-sigla').value = ''; $id('eu-email').value = ''; $id('eu-link-drive').value = '';
  unidadeSiglaOriginal = '';
  $id('modal-unidade-title').innerText = 'Nova Unidade';
  abrirModal('modal-unidade');
}
function abrirEditarUnidade(u) {
  $id('eu-id').value = u.idRow; $id('eu-nome').value = u.unidade; $id('eu-sigla').value = u.sigla; $id('eu-email').value = u.email; $id('eu-link-drive').value = u.linkDrive || '';
  unidadeSiglaOriginal = u.sigla || '';
  $id('modal-unidade-title').innerText = 'Editar Unidade';
  abrirModal('modal-unidade');
}
function confirmarUnidade() {
  const btn = $id('btn-confirmar-unidade');
  const idRow = $id('eu-id').value;
  const dados = { idRow: idRow, unidade: $id('eu-nome').value.trim(), sigla: $id('eu-sigla').value.trim(), email: $id('eu-email').value.trim(), linkDrive: $id('eu-link-drive').value.trim(), siglaOriginal: unidadeSiglaOriginal };
  if (!dados.unidade || !dados.sigla || !dados.email) return showAlerta('Preencha todos os campos.');
  btn.disabled = true; btn.innerText = idRow ? 'A atualizar...' : 'A guardar...';
  const chamada = idRow
    ? google.script.run.withSuccessHandler(tratarRespostaUnidade).withFailureHandler(falha(btn, 'Salvar Unidade', null)).atualizarUnidade(dados)
    : google.script.run.withSuccessHandler(tratarRespostaUnidade).withFailureHandler(falha(btn, 'Salvar Unidade', null)).salvarUnidade(dados);

  function tratarRespostaUnidade(r) {
    if (r.sucesso) { recarregarUnidades(renderUnidades); feedbackBtn(btn, '✅ Salvo!', 'Salvar Unidade', () => fecharModal('modal-unidade')); }
    else { btn.disabled = false; btn.innerText = 'Salvar Unidade'; showAlerta(r.mensagem); }
  }
}

// Atualização otimista: a tela reflete a mudança na hora; só reverte se o servidor falhar.
function inativarUnidade(idRow, sigla) {
  const u = state.units.find(x => String(x.idRow) === String(idRow));
  if (u) u.ativo = false;
  renderUnidades(); sincronizarSelectsUnidade();
  google.script.run.withSuccessHandler(r => {
    if (r && r.sucesso === false) {
      if (u) u.ativo = true;
      renderUnidades(); sincronizarSelectsUnidade();
      showAlerta(r.mensagem);
    }
  }).withFailureHandler(e => {
    if (u) u.ativo = true;
    renderUnidades(); sincronizarSelectsUnidade();
    showAlerta(String(e));
  }).inativarUnidade(idRow, sigla || '');
}

function reativarUnidade(idRow, sigla) {
  const u = state.units.find(x => String(x.idRow) === String(idRow));
  if (u) u.ativo = true;
  renderUnidades(); sincronizarSelectsUnidade();
  google.script.run.withSuccessHandler(r => {
    if (r && r.sucesso === false) {
      if (u) u.ativo = false;
      renderUnidades(); sincronizarSelectsUnidade();
      showAlerta(r.mensagem);
    }
  }).withFailureHandler(e => {
    if (u) u.ativo = false;
    renderUnidades(); sincronizarSelectsUnidade();
    showAlerta(String(e));
  }).reativarUnidade(idRow, sigla || '');
}

// Recarga LEVE do módulo de Unidades: lê só a aba Unidades (getUnitsData) em
// vez das 7 abas de getRestoData, e ressincroniza os selects de unidade.
function recarregarUnidades(cb) {
  google.script.run.withSuccessHandler(r => {
    state.units = r.units;
    sincronizarSelectsUnidade();
    if (cb) cb();
  }).withFailureHandler(e => showAlerta('Falha ao sincronizar: ' + String(e))).getUnitsData();
}
</script>
