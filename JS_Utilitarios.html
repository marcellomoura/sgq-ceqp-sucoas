// JS_Utilitarios.html

// demanda (getTarefasArquivadas), como trainings/history — declarados aqui para
// que nenhum consumidor dependa de uma chave que "aparece" só após a carga.
var state = { tasks: [], archivedTasks: [], members: [], units: [], docs: [], risks: [], plans: [], deliveries: [], history: [], trainings: [], afastamentos: [], visitas: [] };

// Helper: formata links que não iniciam com http
function prefixHttp(l) {
  if (!l || /\s/.test(l) || !l.includes('.')) return l;
  return /^https?:\/\//i.test(l) ? l : 'https://' + l;
}

// ==========================================
// Paginação compartilhada — Logs, Capacitações e Arquivados
// Renderiza o controle "Anterior / Página X de Y (N registros) / Próxima"
// dentro de containerId e conecta os callbacks direto nos botões. Como o
// innerHTML é reescrito a cada chamada, os listeners antigos morrem com os nós
// removidos (sem vazamento nem binding duplicado). Fonte de dados isolada: cada
// tela passa seus próprios onPrev/onNext, então trocar uma delas para paginação
// de servidor no futuro não afeta as demais nem este helper.
// ==========================================
function renderPaginacao(containerId, opts) {
  const el = $id(containerId);
  if (!el) return;
  opts = opts || {};
  const totalRegistros = opts.totalRegistros || 0;

  // Sem registros a lista já mostra "nenhum ..."; o controle some.
  if (totalRegistros <= 0) { el.innerHTML = ''; return; }

  const totalPaginas = Math.max(1, opts.totalPaginas || 1);
  const pagina       = Math.min(Math.max(1, opts.pagina || 1), totalPaginas);
  const plural       = totalRegistros === 1 ? 'registro' : 'registros';

  el.innerHTML =
    `<button type="button" class="btn secondary btn-sm" data-pag="prev"${pagina <= 1 ? ' disabled' : ''}>Anterior</button>` +
    `<span class="paginacao-info">Página ${pagina} de ${totalPaginas} (${totalRegistros} ${plural})</span>` +
    `<button type="button" class="btn secondary btn-sm" data-pag="next"${pagina >= totalPaginas ? ' disabled' : ''}>Próxima</button>`;

  const btnPrev = el.querySelector('[data-pag="prev"]');
  const btnNext = el.querySelector('[data-pag="next"]');
  if (btnPrev && opts.onPrev) btnPrev.addEventListener('click', opts.onPrev);
  if (btnNext && opts.onNext) btnNext.addEventListener('click', opts.onNext);
}
var statusChartInst = null, memberChartInst = null, priorityChartInst = null, memberConcluidoChartInst = null;
var capMesChartInst = null, capModalidadeChartInst = null, capMembroChartInst = null, capTemaChartInst = null;

// Lê o valor atual de uma variável CSS (:root) — canvas/Chart.js não resolve
// var() sozinho como o CSS normal resolve, então os gráficos precisam buscar
// o valor explicitamente. Mantém os gráficos sincronizados com a paleta do
// CSS.html sem duplicar cores em hex; chamado depois que CSS.html já carregou
// (script incluído no fim do body, depois do <style>).
function corVar(nome) {
  return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
}

// Mesma ideia de corVar(), mas para os gradientes translúcidos dos gráficos de
// linha: canvas precisa de rgba() com os 3 componentes numéricos separados,
// não aceita substituir por um hex direto. Converte o hex do token pra RGB.
function corVarRgba(nome, alpha) {
  const hex = corVar(nome).replace('#', '');
  const r = parseInt(hex.substring(0, 2), 16);
  const g = parseInt(hex.substring(2, 4), 16);
  const b = parseInt(hex.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

const ICON = {
  edit: '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',

  archive: '<svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><polyline points="9 14 12 17 15 14"/></svg>',

  // "Inativar" (Unidades e Membros): círculo com barra diagonal, o símbolo

function $id(id) { return document.getElementById(id); }
function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function fmtBr(d) { if (!d || !String(d).includes('-')) return d || '-'; const p = String(d).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d; }
// Data de hoje (fuso do navegador) como 'yyyy-MM-dd', sem passar por UTC —
// evita o desvio de 1 dia que new Date().toISOString() causa à noite no
// horário de Brasília (espelha _dataLocalISO_ do servidor).
function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function badge(st, mapa) { const c = (mapa || CORES_STATUS)[st] || 'badge-neutral'; return `<span class="status-badge ${c}">${esc(st)}</span>`; }
// Selo "Inativo" (membro/unidade desativado) — antes digitado igual em dois
// arquivos; estado neutro/desligado, por isso continua cinza, fora da paleta.
function badgeInativo() { return '<span class="tag-badge tag-badge--inativo badge-neutral">Inativo</span>'; }
// Iniciais da bolinha de avatar: 1ª letra do primeiro nome + 1ª letra do
// segundo nome (ex.: "Maria Clara" -> "MC"); com um nome só, usa 1 letra.
function iniciaisMembro(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '';
  return partes.length > 1 ? (partes[0][0] + partes[1][0]).toUpperCase() : partes[0][0].toUpperCase();
}
// Hex das 12 cores pastel, na mesma ordem de .avatar-pastel-1..12 (CSS.html) —
// usado quando é preciso o valor bruto (ex.: stroke de SVG, backgroundColor de
// gráfico Chart.js), não uma classe. Lido ao vivo via corVar() (mesmos tokens
// --tag-*-text usados pelas classes .avatar-pastel-N) em vez de hex fixo, para
// funcionar tanto em canvas (que não resolve var() sozinho) quanto em DOM.
const PALETA_PASTEL_HEX = [
  corVar('--tag-lavender-text'), corVar('--tag-mint-text'), corVar('--tag-rose-text'),
  corVar('--tag-sky-text'), corVar('--tag-peach-text'), corVar('--tag-gold-text'),
  corVar('--tag-brick-text'), corVar('--tag-lime-text'), corVar('--tag-turquoise-text'),
  corVar('--tag-orchid-text'), corVar('--tag-slate-text'), corVar('--tag-cinnamon-text')
];
function _hashPastel(nome) {
  const s = String(nome || '');
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(hash) % 12;
}
// Escolhe uma das 12 classes .avatar-pastel-N (CSS.html) de forma determinística
// a partir de um nome — o mesmo nome sempre cai na mesma cor (membros, e
// também etiquetas do Kanban), sem precisar guardar a cor em nenhum lugar.
function corPastelPorNome(nome) { return 'avatar-pastel-' + (_hashPastel(nome) + 1); }
// Mesma escolha de corPastelPorNome(), mas devolve o hex puro.
function corPastelHex(nome) { return PALETA_PASTEL_HEX[_hashPastel(nome)]; }

// Monta um mapa nome→índice de cor (0-11) para TODOS os membros ativos de uma
// vez: tenta o hash de cada um (_hashPastel) e, se colidir com alguém que já
// ganhou aquele índice, avança pro próximo tom livre da paleta (com volta ao
// início). Diferente de resolver a colisão "por gráfico": aqui é resolvida uma
// única vez pra todo mundo, então a mesma cor vale no avatar e em qualquer
// gráfico — de verdade alinhados, não só cada um consistente consigo mesmo.
// Ordem estável (a de membrosOrdenados()), então não muda de uma chamada pra
// outra enquanto a lista de membros não mudar.
function _mapaCoresMembros() {
  const mapa = {};
  const usados = new Set();
  const total = PALETA_PASTEL_HEX.length;
  membrosOrdenados().forEach(function (m) {
    let idx = _hashPastel(m.name);
    let tentativas = 0;
    while (usados.has(idx) && tentativas < total) {
      idx = (idx + 1) % total;
      tentativas++;
    }
    usados.add(idx);
    mapa[m.name] = idx;
  });
  return mapa;
}

// Cor de um membro (classe .avatar-pastel-N), usada nos avatares. Membro
// inativo/histórico (não está em membrosOrdenados(), ex.: responsável de um
// cartão arquivado antigo) cai no hash puro de corPastelPorNome — sem garantia
// de colisão nesse caso raro, mas nunca quebra.
function corMembroPorNome(nome) {
  const idx = _mapaCoresMembros()[nome];
  return idx !== undefined ? 'avatar-pastel-' + (idx + 1) : corPastelPorNome(nome);
}

// Mesma lógica, hex puro — usada nos 4 gráficos "por Membro" do Painel.
function corMembroHex(nome) {
  const idx = _mapaCoresMembros()[nome];
  return idx !== undefined ? PALETA_PASTEL_HEX[idx] : corPastelHex(nome);
}

// Renderiza o perfil do usuário logado no rodapé da barra lateral.
function renderUserAvatar() {
  const container = $id('sidebar-user-container');
  if (!container || !state.currentUserEmail) return;
  const emailLower = String(state.currentUserEmail).trim().toLowerCase();
  
  // Tenta achar na lista de membros pelo email funcional ou pessoal
  let m = state.members.find(x => 
    String(x.email||'').trim().toLowerCase() === emailLower || 
    String(x.emailPessoal||'').trim().toLowerCase() === emailLower
  );
  
  let nomeExibicao = m ? m.name : (emailLower === 'sistema' ? 'Sistema' : 'Usuário Externo');
  
  container.innerHTML = 
    `<div class="member-avatar ${corMembroPorNome(nomeExibicao)} sidebar-user-avatar">${esc(iniciaisMembro(nomeExibicao))}</div>` +
    `<div class="sidebar-user-info">` +
      `<span class="sidebar-user-name">${esc(nomeExibicao)}</span>` +
    `</div>`;
}

// Só renderiza como link URLs http(s) — qualquer outro valor (ex.:
// "javascript:...") aparece como texto simples, sem virar clicável.
// comIcone reaproveita o estilo do link "🔗 Acessar" de Capacitações
// (JS_Capacitacoes.html) sem afetar quem já chama linkA() sem esse parâmetro.
function linkA(url, txt, cor, comIcone) {
  if (!url || url === '-') return '-';
  if (!/^https?:\/\//i.test(String(url).trim())) return esc(url);
  // var() resolve normalmente em style="" no DOM (só canvas/PDF é que não
  // resolvem) — e nenhuma das listas que usam linkA() (Documentos,
  // Capacitações, Visitas) entra em PDF: os 5 CFG_PDF não as incluem.
  // O #2563eb (azul da paleta antiga) virou --accent na Fase 1b — como os dois
  // ramos passaram a usar a mesma cor, o ternário de cor saiu (§8.20, V2).
  const corFinal = cor || 'var(--accent)';
  const peso = comIcone ? 500 : 600;
  const icone = comIcone ? '🔗 ' : '';
  const semQuebra = comIcone ? 'white-space:nowrap;' : '';
  return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:${corFinal};font-weight:${peso};text-decoration:none;${semQuebra}">${icone}${txt}</a>`;
}
function formatUnidadeUI(val) {
  if (!val || val === '-') return val || '';
  const u = state.units.find(x => String(x.id) === String(val));
  return u ? u.sigla : val;
}
function iconBtn(cls, acao, title, attrs) { return `<button type="button" class="btn-icon ${cls}" title="${title}" data-acao="${acao}" ${attrs||''}>${ICON[cls] || ICON.del}</button>`; }
// esc(txt): as mensagens de erro carregam texto de exceção vindo do servidor
// (buscarLogs etc.). Não é vetor explorável hoje, mas era o único innerHTML do
// arquivo que interpolava texto sem escapar.
function msgTabela(tbodyId, cols, txt, err) { 
  const el = $id(tbodyId); 
  if (!el) return;
  if (el.tagName.toLowerCase() === 'tbody') {
    el.innerHTML = `<tr><td colspan="${cols}" class="${err?'msg-error':'msg-empty'}">${esc(txt)}</td></tr>`;
  } else {
    el.innerHTML = `<div class="${err?'msg-error':'msg-empty'}">${esc(txt)}</div>`;
  }
}
function feedbackBtn(btn, ok, orig, cb) { btn.disabled=false; btn.innerText=ok; setTimeout(()=>{ btn.innerText=orig; if(cb) cb(); }, 1400); }
function falha(btn, orig, statusEl) {
  return function(e) {
    if(btn){btn.disabled=false; btn.innerText=orig;}
    const msg='Erro de comunicação: '+(e&&e.message?e.message:String(e));
    // #dc2626 era o valor de --danger na paleta ANTIGA (ver §8.7); ficou preso
    // aqui quando a paleta foi recalibrada para a escada Menta/Dourado/Tijolo.
    if(statusEl){statusEl.innerText=msg; statusEl.style.color='var(--danger)';}
    else showAlerta(msg);
  };
}

// ---------- Helpers de membros (compartilhados por Kanban, Dashboard, Pessoas) ----------
// Cópia ordenada por nome (pt-BR) — a ordem original de state.members é
// preservada porque os botões de editar/excluir usam o índice original.
// Só membros ATIVOS, ordenados por nome — usado em seletores de responsável,
// filtros, escala e afastamentos. Para resolver NOMES de qualquer membro
// (inclusive inativos, em cartões/gráficos antigos) use nomesMembros/state.members.
function membrosOrdenados() {
  return state.members.filter(m => m.ativo !== false)
    .sort((a, b) => (a.name||'').localeCompare(b.name||'', 'pt-BR', { sensitivity: 'base' }));
}
// A coluna Responsável_ID guarda um JSON de ids ("[\"MEM-1\"]"), mas dados
// antigos podem ter um id solto — os dois formatos são aceitos aqui.
function parseIdsResponsaveis(val) {
  try {
    const ids = JSON.parse(val);
    return Array.isArray(ids) ? ids.map(String) : (val ? [String(val)] : []);
  } catch(e) { return val ? [String(val)] : []; }
}
function nomesMembros(ids) {
  return ids.map(id => { const m = state.members.find(x => String(x.id) === String(id)); return m ? m.name : ''; })
    .filter(n => n).join(', ');
}
// Options "Todos" + membros em ordem alfabética (filtros de membro)
function optsMembros() {
  return '<option value="">Todos os Membros</option>' +
    membrosOrdenados().map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
}

// Alertas e confirmações
function showAlerta(msg) { $id('alerta-msg').innerText=msg; abrirModal('modal-alerta'); }
// showConfirm(msg, cb, opts?) — por padrão usa o visual de exclusão (vermelho,
// lixeira, "Excluir"). Passe opts.tone='warning' para o visual de arquivamento
// (âmbar, caixa, "Arquivar"). Sempre reaplica tudo, então não fica visual
// "vazado" de uma confirmação para a próxima.
function showConfirm(msg, cb, opts) {
  opts = opts || {};
  let cfg;
  if (opts.tone === 'warning') {
    cfg = { cor:'var(--warning)', bg:'var(--warning-bg)', titulo:'Confirmar Arquivamento', label:'Arquivar',
        icon:'<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>' };
  } else if (opts.tone === 'restore') {
    cfg = { cor:'var(--warning)', bg:'var(--warning-bg)', titulo:'Confirmar Restauração', label:'Restaurar',
        icon:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>' };
  } else {
    cfg = { cor:'var(--danger)', bg:'var(--danger-bg)', titulo:'Confirmação de Exclusão', label:'Excluir',
        icon:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>' };
  }
  $id('confirm-msg').innerText = msg;
  $id('confirm-title').innerText = opts.title || cfg.titulo;
  const btn = $id('btn-confirmar-excluir');
  btn.innerText = opts.confirmLabel || cfg.label;
  btn.dataset.loadingText = opts.loadingText || 'A processar...';
  // O botão é .btn.danger no HTML — um botão "fantasma" (fundo claro, texto e
  // borda vermelhos). Aqui ele vira sólido, então o texto PRECISA ser
  // sobrescrito junto com o fundo: sem esta linha o texto fica vermelho sobre
  // vermelho (Excluir, invisível), vermelho sobre dourado (Arquivar/Restaurar)
  // e vermelho sobre verde (feedback de sucesso, ~linha 970). Mesma convenção
  // de .btn.success e .btn-action-icon: fundo colorido + texto inverso.
  btn.style.background = cfg.cor; btn.style.borderColor = cfg.cor;
  btn.style.color = 'var(--text-inverse)';

// Dropdowns de unidade (opts pré-gerados para não refazer a cada chamada)
function gerarOptsUnidades(comTodas) {
  let html = '<option value="" disabled selected>Selecione...</option>';
  const ordenadas = [...state.units].filter(u => u.ativo !== false).sort((a, b) => a.unidade.localeCompare(b.unidade, 'pt-BR', { sensitivity: 'base' }));
  ordenadas.forEach(u => { const label = esc(u.sigla); html+=`<option value="${esc(u.id)}">${label}</option>`; });
  if (comTodas) html += '<option value="Todas as Subcomissões">Todas as Subcomissões</option>';
  return html;
}

function gerarOptsProprietariosRisco() {
  let html = '<option value="" disabled selected>Selecione...</option>';
  const ordenadas = [...state.units]
    .filter(u => u.ativo !== false)
    .filter(u => {
      const n = u.unidade.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return !n.includes('comissao') && !n.includes('subcomissao');
    })
    .sort((a, b) => a.unidade.localeCompare(b.unidade, 'pt-BR', { sensitivity: 'base' }));
  ordenadas.forEach(u => { const label = esc(u.sigla); html+=`<option value="${esc(u.id)}">${label}</option>`; });
  return html;
}
function optsUnidFiltro() {
  let h='<option value="">Todas as Unidades</option>';
  const ordenadas = [...state.units].sort((a, b) => a.unidade.localeCompare(b.unidade, 'pt-BR', { sensitivity: 'base' }));
  ordenadas.forEach(u=>{ 
    const isInactive = u.ativo === false ? ' (Inativa)' : '';
    const label = `${esc(u.sigla)}${isInactive}`; 
    h+=`<option value="${esc(u.id)}">${label}</option>`; 
  });
  return h;
}
function sincronizarSelectsUnidade() {
  const resps = [['d-resp',false],['p-who',true],['ed-resp',false],['ep-who',true]];
  resps.forEach(([id, comTodas]) => { const el=$id(id); if(!el) return; const v=el.value; el.innerHTML=gerarOptsUnidades(comTodas); if(v) el.value=v; });
  
  const proprietarios = ['r-resp', 'er-resp'];
  proprietarios.forEach(id => { const el=$id(id); if(!el) return; const v=el.value; el.innerHTML=gerarOptsProprietariosRisco(); if(v) el.value=v; });
  const filtros = ['f-doc-unidade','f-rev-unidade','f-acomp-unidade'];
  filtros.forEach(id => { const el=$id(id); if(!el) return; const v=el.value; el.innerHTML=optsUnidFiltro(); if(v) el.value=v; });
}

// ==========================================
// CARREGAMENTO SOB DEMANDA (lazy) do "resto" do sistema
// (Unidades, Documentos, Riscos, Planos, Entregas). Só dispara na
// primeira vez que o usuário visita uma dessas abas — nunca é buscado
// automaticamente. Depois de carregado uma vez, fica em cache no
// `state` e não busca de novo. Cada módulo ressincroniza o próprio estado
// após uma escrita pelo seu endpoint leve (recarregarDocs/recarregarUnidades/
// recarregarRiscosPlanos/recarregarCapacitacoes), sem reler as 7 abas.
// ==========================================
var restoDataLoaded = false;
var restoDataLoading = false;
var restoDataFilaCallbacks = [];

function garantirRestoData(callback) {
  if (restoDataLoaded) { callback(); return; }
  restoDataFilaCallbacks.push(callback);
  if (restoDataLoading) return; // já tem uma busca em andamento, só entra na fila

  restoDataLoading = true;
  google.script.run
    .withFailureHandler(function(e) {
      // Sem isso, uma falha do servidor deixava a tela travada em
      // "A carregar..." para sempre, sem nenhum aviso do que houve.
      restoDataLoading = false;
      restoDataFilaCallbacks = [];
      showAlerta('Falha ao carregar dados do sistema: ' + (e.message || String(e)) + '. Tente trocar de aba novamente.');
    })
    .withSuccessHandler(function(resto) {
      try {
        state.units = resto.units;
        state.docs = resto.docs;
        state.risks = resto.risks;
        state.plans = resto.plans;
        state.deliveries = resto.deliveries;
        // Sem isto a Matriz de Risco plota probabilidade/impacto ORIGINAIS até
        // que alguma escrita dispare recarregarRiscosPlanos(), e o modal de
        // reavaliação pré-preenche com os valores antigos (salvar "manter"
        // regredia o risco para a avaliação anterior).
        state.history = resto.history || [];
        sincronizarSelectsUnidade();
      } catch (err) {
        // Um erro aqui não pode travar o carregamento para sempre —
        // registra no console e segue em frente com o que já temos.
        console.error('Erro ao processar dados do SGQ:', err);
      }
      restoDataLoaded = true;
      restoDataLoading = false;
      var fila = restoDataFilaCallbacks; restoDataFilaCallbacks = [];
      fila.forEach(function(cb) {
        try { cb(); } catch (err) {
          console.error('Erro ao renderizar aba após carregar dados:', err);
          showAlerta('Erro ao exibir os dados: ' + (err.message || String(err)));
        }
      });
    }).getRestoData();
}

// NAVEGAÇÃO
// ==========================================
function mudarTab(tab, botao) {
  currentTab = tab;
  document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  if(botao) botao.classList.add('active');
  const view = $id('view-' + tab);
  if(view) view.classList.add('active');

  atualizarTopBar();
  const SGQ_TABS = ['unidades','doc-lista','doc-revisoes','risco-matriz','plano-acomp','indicadores'];

  const rotinas = {
    'kanban': ()=>renderTasks(),
    // Arquivados têm busca própria e sob demanda (não vêm mais no payload do
    // quadro) — a msgTabela evita a tabela vazia piscando durante a carga.
    'archived': ()=>{
      if (!archivedLoaded) msgTabela('archived-list', 7, 'A carregar...');
      garantirArquivados(()=>renderArquivados(true));
    },
    'members': ()=>renderMembers(),
    // Os gráficos do Kanban no Painel somam ativos + arquivados (métrica
    // histórica), então os arquivados precisam estar carregados antes.
    // Capacitações e Visitas Técnicas são buscadas aqui também — nenhuma das
    // duas vem mais no getRestoData()/SGQ_TABS (ambas sob demanda desde
    // 2026-07-23, ver §8.9 da documentação) — para o Painel não renderizar
    // os gráficos vazios na primeira abertura direta desta aba.
    'indicadores': ()=>{
      Promise.all([
        new Promise(r => garantirArquivados(r)),
        new Promise(r => garantirCapacitacoesData(r)),
        new Promise(r => garantirVisitasData(r))
      ]).then(() => setTimeout(renderIndicadores, 50));
    },
    'escala': ()=>renderEscala(),
    'unidades': ()=>renderUnidades(),
    'doc-lista': ()=>renderDocumentos('mestra'),
    'doc-revisoes': ()=>renderDocumentos('revisoes'),
    'risco-matriz': ()=>renderMatriz(),
    'plano-acomp': ()=>renderAcompanhamento(),
    'risco-arquivado': ()=>renderRiscosArquivados(),
    // Capacitações: carregamento sob demanda (não faz parte do getRestoData()
    // pré-carregado, desde 2026-07-23) — mesmo padrão de 'visitas-lista'
    // abaixo, com sua própria busca/fila (garantirCapacitacoesData, em
    // JS_Capacitacoes.html).
    'capacitacoes-lista': ()=>{
      if (!capacitacoesLoaded) msgTabela('lista-capacitacoes', 10, 'A carregar...');
      garantirCapacitacoesData(()=>{ renderCapacitacoes(); renderKpisCapacitacoes(); });
    },
    'ferias': ()=>carregarFerias(),
    // Visitas Técnicas: carregamento sob demanda (não faz parte do
    // getRestoData() pré-carregado) — mesmo padrão de 'archived' acima, com
    // sua própria busca/fila (garantirVisitasData, em JS_VisitasTecnicas.html).
    'visitas-lista': ()=>{
      if (!visitasLoaded) msgTabela('lista-visitas', 7, 'A carregar...');
      garantirVisitasData(()=>{ renderVisitasTecnicas(); renderKpisVisitas(); });
    }
  };

  if (tab === 'logs')   { carregarLogs();   return; }

  // Mostra "A carregar..." nas tabelas das abas do SGQ eager (pacote
  // getRestoData) enquanto os dados não chegam (só na primeira visita —
  // depois fica em cache). Capacitações/Visitas Técnicas/Arquivados têm seu
  // próprio "A carregar..." embutido na respectiva rotina acima, porque
  // seguem um carregamento sob demanda independente deste pacote.
  const MSG_TABELA_POR_ABA = {
    'unidades': ['lista-unidades', 4], 'doc-lista': ['lista-mestra', 12],
    'doc-revisoes': ['lista-revisoes', 10], 'risco-matriz': ['lista-riscos', 12],
    'plano-acomp': ['lista-acomp', 11],
    'risco-arquivado': ['lista-riscos-arquivados', 9]
  };

  if (SGQ_TABS.indexOf(tab) !== -1) {
    if (!restoDataLoaded && MSG_TABELA_POR_ABA[tab]) {
      msgTabela(MSG_TABELA_POR_ABA[tab][0], MSG_TABELA_POR_ABA[tab][1], 'A carregar...');
    }
    garantirRestoData(function() { if (rotinas[tab]) rotinas[tab](); });
  } else if (rotinas[tab]) {
    rotinas[tab]();
  }
}

function atualizarTopBar() {
  // O cabeçalho é customizado por view (dentro de cada <section>); não há mais
  // page-header/hdr-tab-controls globais para sincronizar aqui. Mantido só o
  // que ainda é necessário: o binding do filtro de membros do Kanban.
  if (currentTab === 'kanban') {
    sincronizarDropdownMembros();
    const selKanban = $id('memberFilterSelect');
    if (selKanban && !selKanban.dataset.bound) {
      selKanban.addEventListener('change', renderTasks);
      selKanban.dataset.bound = '1';
    }
  }
}

// ==========================================
// PAINEL DE INDICADORES (Monitoramento)
// Centraliza os gráficos do Kanban (Módulo 1) e das Capacitações
// (Módulo 6), sob um único filtro de membro (dashMemberFilter).
// ==========================================
function renderIndicadores() {
  // Chart.js vem de CDN (jsDelivr). Se a rede falhar e a lib não carregar,
  // todos os new Chart() abaixo lançariam "Chart is not defined" e abortariam
  // o Painel inteiro. Guardamos no único ponto de entrada dos 7 gráficos e
  // avisamos o usuário de forma não-bloqueante em vez de quebrar em silêncio.
  if (typeof Chart === 'undefined') {
    _avisarBibliotecaGraficos();
    return;
  }
  _removerAvisoGraficos();
  if (typeof ChartDataLabels !== 'undefined') {
    Chart.register(ChartDataLabels);
  }
  const fid = ($id('dashMemberFilter')||{value:''}).value;
  renderGraficosKanban(fid);
  renderGraficosCapacitacoes(fid);
  renderGraficosVisitas(fid);
}

// Aviso (idempotente) exibido no topo do Painel quando o Chart.js não está
// disponível — inserido/removido conforme a lib carrega numa recarga futura.
function _avisarBibliotecaGraficos() {
  const view = $id('view-indicadores');
  if (!view || $id('aviso-graficos-cdn')) return;
  const box = document.createElement('div');
  box.id = 'aviso-graficos-cdn';
  box.className = 'msg-error';
  box.style.margin = '16px 28px';
  box.textContent = 'Não foi possível carregar a biblioteca de gráficos (Chart.js). '
    + 'Verifique a conexão com a internet e recarregue a página.';
  view.insertBefore(box, view.firstChild);
}

function _removerAvisoGraficos() {
  const box = $id('aviso-graficos-cdn');
  if (box) box.remove();
}

// Corpo do relatório do Painel de Indicadores — tira "fotos" exatas da tela
// usando html2canvas, preservando 100% da fidelidade de layout, cores e grids.
async function montarHtmlIndicadoresPdf() {
  const kpiGeral = $id('dash-kpis-geral');
  const grids = Array.from(document.querySelectorAll('#view-indicadores .tl-chart-grid'));
  
  const promises = [];
  if (kpiGeral) promises.push(_capturarElementoComoImg(kpiGeral));
  grids.forEach(g => promises.push(_capturarElementoComoImg(g)));
  
  const imgs = await Promise.all(promises);
  
  let html = '';
  if (imgs[0] && kpiGeral) html += `<img src="${imgs[0]}" class="pdf-img-full">`;

  // Descobre o título de cada gráfico subindo pelos irmãos anteriores até achar
  // o <h3 class="tl-section-title"> mais próximo — não depende de quantos grids
  // cada seção tem nem de posição fixa no array (frágil a mudanças futuras em
  // View_Monitoramento.html). imgs[0] é o KPI geral; imgs[i+1] é o grids[i].
  let ultimoTitulo = null;
  grids.forEach((grid, i) => {
    const img = imgs[i + 1];
    if (!img) return;

    let tituloEl = grid.previousElementSibling;
    while (tituloEl && !tituloEl.classList.contains('tl-section-title')) {
      tituloEl = tituloEl.previousElementSibling;
    }
    const tituloTexto = tituloEl ? tituloEl.textContent.trim() : '';

    if (tituloTexto && tituloTexto !== ultimoTitulo) {
      const quebraPagina = ultimoTitulo !== null; // só quebra a partir do 2º título
      html += quebraPagina ? `<div class="pdf-page-break">${_pdfSecaoTitulo(tituloTexto)}</div>` : _pdfSecaoTitulo(tituloTexto);
      ultimoTitulo = tituloTexto;
    }

    html += `<div class="pdf-avoid-break"><img src="${img}" class="pdf-img-full"></div>`;
  });

  return html;
}

// DELEGAÇÃO DE EVENTOS
// ==========================================
document.addEventListener('DOMContentLoaded', function() {
  const dashYearFilter = $id('dashYearFilter');
  if (dashYearFilter) {
    const anoAtual = new Date().getFullYear();
    let opts = '<option value="">Todos</option>';
    const maxAno = Math.max(2028, anoAtual + 2); // Garante que mostre alguns anos à frente também
    for (let ano = 2026; ano <= maxAno; ano++) {
      opts += `<option value="${ano}">${ano}</option>`;
    }
    dashYearFilter.innerHTML = opts;
    dashYearFilter.value = anoAtual;
  }

  // Inicia com todos os grupos da sidebar FECHADOS
  document.querySelectorAll('.nav-group-title').forEach(function(btn) {
    btn.classList.remove('open');
    var submenu = document.getElementById(btn.dataset.group);
    if (submenu) submenu.classList.remove('open');
  });
  document.querySelectorAll('.menu-item').forEach(function(b) { b.classList.remove('active'); });

  // Abre o módulo de Tarefas e activa o Kanban IMEDIATAMENTE — não espera
  // nenhum dado do servidor. As colunas aparecem na hora; os cartões
  // preenchem assim que a etapa 1 (abaixo) retornar.
  var btnGrupo  = document.querySelector('[data-group="g-tarefas"]');
  var btnKanban = document.querySelector('[data-tab="kanban"]');
  if (btnGrupo) {
    btnGrupo.classList.add('open');
    var sub = document.getElementById('g-tarefas');
    if (sub) sub.classList.add('open');
  }
  if (btnKanban) mudarTab('kanban', btnKanban);

  // Único carregamento automático: só Tarefas + Membros (Kanban).
  // O resto do sistema (Unidades, Documentos, Riscos, Planos, Entregas)
  // só é buscado quando o usuário efetivamente clica numa dessas abas —
  // ver garantirRestoData() em mudarTab().
  google.script.run
    .withFailureHandler(function(e) { showAlerta('Falha ao carregar dados: ' + (e.message||String(e))); })
    .withSuccessHandler(function(data) {
      state.tasks = data.tasks;
      state.members = data.members;
      state.currentUserEmail = data.currentUserEmail;
      renderUserAvatar();
      renderTasks();
      sincronizarDropdownMembros();
      // Se o usuário já clicou numa aba que também depende destes dados
      // (Membros, Escala, Dashboard, Arquivados) ANTES desta resposta
      // chegar, essa aba renderizou vazia e nunca era atualizada sozinha —
      // precisava trocar de aba e voltar para os dados aparecerem. Re-renderiza
      // a aba que estiver ativa neste momento para corrigir isso.
      // 'archived' continua aqui: a tabela de arquivados tem busca própria, mas
      // resolve os nomes dos responsáveis por state.members, que vem daqui.
      // 'indicadores' precisa dos arquivados (métrica histórica) — ver
      // renderGraficosKanban.
      const rotinasPosCargaInicial = {
        'members': renderMembers, 'escala': renderEscala,
        'ferias': carregarFerias,
        'indicadores': ()=>{
          Promise.all([
            new Promise(r => garantirArquivados(r)),
            new Promise(r => garantirCapacitacoesData(r)),
            new Promise(r => garantirVisitasData(r))
          ]).then(() => renderIndicadores());
        },
        'archived': renderArquivados, 'risco-arquivado': renderRiscosArquivados
      };
      if (rotinasPosCargaInicial[currentTab]) rotinasPosCargaInicial[currentTab]();

      // Pré-carrega o "resto" do sistema (Unidades, Documentos, Riscos,
      // Planos, Entregas, Capacitações) em segundo plano, logo depois que o
      // Kanban já está na tela. Assim a PRIMEIRA vez que o usuário abre uma
      // aba do SGQ ela aparece na hora, em vez de esperar a busca pesada
      // disparar só no clique. Se ele clicar antes de terminar, garantirRestoData
      // apenas entra na fila da mesma busca (não dispara outra).
      setTimeout(function() {
        if (!restoDataLoaded && !restoDataLoading) garantirRestoData(function() {});
      }, 400);
    }).getKanbanData();

  // Afastamentos: busca própria, disparada em paralelo com a de cima (não
  // encadeada). Não entra no pacote de Tarefas+Membros porque esse é relido
  // a cada ação de cartão (recarregarKanban) — colocar Afastamentos lá
  // pesaria em toda edição/movimentação de cartão. Ainda assim chega cedo o
  // bastante para a aba abrir na hora, como Membros/Escala.
  google.script.run
    .withFailureHandler(function(e) { console.error('Falha ao pré-carregar Afastamentos: ' + (e.message||String(e))); })
    .withSuccessHandler(function(data) {
      state.afastamentos = data || [];
      if (currentTab === 'ferias') carregarFerias();
    }).getAfastamentos();

  // A13: Acessibilidade - Injetar ARIA roles nos modais e configurar Focus Trap
  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
  });

  inicializarSidebarRetratil();
});

// ==========================================
// SIDEBAR RETRÁTIL (modo somente ícones)
// ==========================================
function inicializarSidebarRetratil() {
  const sidebar = document.querySelector('.sidebar');
  const brand = $id('sidebarBrand');
  if (!sidebar || !brand) return;

  const CHAVE_STORAGE = 'sgqSidebarCollapsed';

  // No modo ícone o accordion não é usado (quem navega os grupos é o
  // flyout no hover) — fechar tudo ao recolher evita que um grupo deixado
  // aberto reapareça de uma vez (altura total, sem transição) ao reabrir.
  function fecharTodosGrupos() {
    document.querySelectorAll('.nav-group-title.open').forEach(function(b) { b.classList.remove('open'); });
    document.querySelectorAll('.nav-group-items.open').forEach(function(p) { p.classList.remove('open'); });
  }

  if (localStorage.getItem(CHAVE_STORAGE) === '1') {
    sidebar.classList.add('collapsed');
    fecharTodosGrupos();
  }

  function alternarSidebar() {
    const vaiExpandir = sidebar.classList.contains('collapsed');
    sidebar.classList.toggle('collapsed');
    if (!vaiExpandir) fecharTodosGrupos();
    localStorage.setItem(CHAVE_STORAGE, vaiExpandir ? '0' : '1');
  }
  brand.addEventListener('click', alternarSidebar);
  brand.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternarSidebar(); }
  });

  // Flyout dos grupos: só entra em ação com a sidebar recolhida (em telas
  // largas; no mobile o CSS já neutraliza .collapsed e isto não é chamado
  // porque sidebar.collapsed some da tela restrita).
  document.querySelectorAll('.nav-group-title').forEach(function(btn) {
    const painel = $id(btn.dataset.group);
    if (!painel) return;
    let timeoutFechar = null;

    btn.addEventListener('mouseenter', function() {
      if (!sidebar.classList.contains('collapsed')) return;
      clearTimeout(timeoutFechar);
      const rect = btn.getBoundingClientRect();
      painel.style.top = rect.top + 'px';
      painel.style.left = (rect.right + 8) + 'px';
      painel.classList.add('flyout-visible');
    });
    btn.addEventListener('mouseleave', function() {
      timeoutFechar = setTimeout(function() { painel.classList.remove('flyout-visible'); }, 150);
    });
    painel.addEventListener('mouseenter', function() { clearTimeout(timeoutFechar); });
    painel.addEventListener('mouseleave', function() {
      timeoutFechar = setTimeout(function() { painel.classList.remove('flyout-visible'); }, 150);
    });
  });
}

document.addEventListener('keydown', function(e) {
  // Focus Trap e fechamento via ESC para modais
  if (e.key === 'Escape') {
    const openModals = document.querySelectorAll('.modal-overlay.open');
    if (openModals.length > 0) {
      fecharModal(openModals[openModals.length - 1].id);
    }
    return;
  }
  if (e.key === 'Tab') {
    const openModals = document.querySelectorAll('.modal-overlay.open');
    if (openModals.length === 0) return;
    const modal = openModals[openModals.length - 1];
    const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    
    if (e.shiftKey) {
      if (document.activeElement === first) {
        last.focus();
        e.preventDefault();
      }
    } else {
      if (document.activeElement === last) {
        first.focus();
        e.preventDefault();
      }
    }
    return;
  }
  if (e.key === 'Enter') {
    const tag = document.activeElement.tagName;
    if (tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;
    const openModals = document.querySelectorAll('.modal-overlay.open');
    if (openModals.length === 0) return;
    const modal = openModals[openModals.length - 1];
    const btnSalvar = modal.querySelector('.btn.primary, #btn-save-task');
    if (btnSalvar && !btnSalvar.disabled) {
      e.preventDefault();
      btnSalvar.click();
    }
  }
});

document.addEventListener('click', function(e) {

// Auto-scroll durante o arraste de cartões (DnD nativo do HTML5).
// O quadro rola dentro do .board-canvas — um contêiner com overflow próprio — e
// o auto-scroll nativo do navegador só age no documento raiz, nunca num
// contêiner aninhado. Sem isto, arrastar um cartão do fim de uma coluna longa
// não sobe a tela e as demais colunas ficam inacessíveis. Este laço supre a
// lacuna: enquanto há arraste, rola o board-canvas na vertical/horizontal
// conforme o cursor se aproxima das bordas, com velocidade proporcional à
// proximidade. Só usa APIs nativas (compatível com o iframe do HTMLService).
(function () {
  const ZONA = 60;      // distância da borda (px) em que a rolagem começa
  const VEL_MAX = 22;   // rolagem máxima por frame (px)
  let rafId = null, ptrX = 0, ptrY = 0, arrastando = false;

  const canvas = () => document.querySelector('.board-canvas');

  function passo() {
    const c = canvas();
    if (!arrastando || !c) { rafId = null; return; }
    const r = c.getBoundingClientRect();

    // Vertical: cursor perto do topo sobe; perto da base desce.
    const topo = ptrY - r.top, base = r.bottom - ptrY;
    if (topo < ZONA && c.scrollTop > 0) {
      c.scrollTop -= VEL_MAX * (1 - Math.max(0, topo) / ZONA);
    } else if (base < ZONA && c.scrollTop + c.clientHeight < c.scrollHeight) {
      c.scrollTop += VEL_MAX * (1 - Math.max(0, base) / ZONA);
    }
    // Horizontal: cursor perto da esquerda/direita rola as colunas.
    const esq = ptrX - r.left, dir = r.right - ptrX;
    if (esq < ZONA && c.scrollLeft > 0) {
      c.scrollLeft -= VEL_MAX * (1 - Math.max(0, esq) / ZONA);
    } else if (dir < ZONA && c.scrollLeft + c.clientWidth < c.scrollWidth) {
      c.scrollLeft += VEL_MAX * (1 - Math.max(0, dir) / ZONA);
    }
    rafId = requestAnimationFrame(passo);
  }

  document.addEventListener('dragstart', function (e) {
    if (e.target.closest && e.target.closest('.card')) {
      arrastando = true;
      if (!rafId) rafId = requestAnimationFrame(passo);
    }
  });
  // Passivo: só registra a posição do cursor (não chama preventDefault, para
  // não alterar onde o drop é permitido — isso continua a cargo das .list-cards).
  document.addEventListener('dragover', function (e) { ptrX = e.clientX; ptrY = e.clientY; });
  function parar() { arrastando = false; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
  document.addEventListener('dragend', parar);
  document.addEventListener('drop', parar);
})();

// ==========================================
// PDF
// Gerado inteiramente no SERVIDOR a partir de um HTML de impressão
// dedicado (montado aqui reaproveitando os dados já na tela — não uma
// captura da página). Vantagens sobre a captura de tela (html2canvas):
// nunca corta/deixa página em branco (é um documento real, não uma
// imagem fatiada), não pisca nada na tela (a página visível nunca é
// tocada) e é mais leve (sem biblioteca de terceiros).
// Cada tipo aponta pro nome de uma função "montarHtml...Pdf" (definida
// perto do render da respectiva tela) que devolve só o HTML do corpo do
// relatório — o envelope (estilo + cabeçalho) é comum, montado abaixo.
// A função é referenciada por NOME (string) e resolvida em tempo de
// clique, não no carregamento do script: como os arquivos JS_*.html são
// concatenados em <script>s separados, na hora em que este trecho é
// executado nem todo mundo já rodou — resolver por nome evita depender
// da ordem de carregamento.
// ==========================================
const CFG_PDF = {
  'dashboard': { file: 'Painel_Indicadores_SGQ.pdf',   title: 'Painel de Indicadores',                ori: 'landscape', montarFn: 'montarHtmlIndicadoresPdf' },
  'archived' : { file: 'Cartoes_Arquivados_SGQ.pdf',   title: 'Cartões Arquivados',                  ori: 'portrait',  montarFn: 'montarHtmlArquivadosPdf' },
  'matriz'   : { file: 'Matriz_Risco_SGQ.pdf',         title: 'Matriz de Risco',                     ori: 'landscape', montarFn: 'montarHtmlMatrizPdf' },
  'acomp'    : { file: 'Acompanhamento_Acoes_SGQ.pdf', title: 'Acompanhamento de Ações',             ori: 'landscape', montarFn: 'montarHtmlAcompanhamentoPdf' },
  'risco-arquivado': { file: 'Riscos_Arquivados_SGQ.pdf', title: 'Riscos e Planos Arquivados',       ori: 'landscape', montarFn: 'montarHtmlRiscoArquivadoPdf' }
};

// O conversor de HTML→PDF do Apps Script (Utilities.newBlob().getAs(PDF))
// não renderiza background-color de forma confiável em elementos comuns
// (testado: cor de fundo de <div>/<span> some por completo). O que
// funciona de forma consistente:
//  - texto e cor de texto (color)
//  - bordas
//  - o atributo HTML legado "bgcolor" em <table>/<tr>/<td>/<th>
// Por isso, TUDO que precisa de uma cor de preenchimento no PDF usa
// <td bgcolor="..."> (nunca <div style="background:...">), e badges que
// no app usam pílula colorida (fundo claro + texto escuro) viram aqui borda +
// texto colorido — sem depender de nenhum preenchimento.

// Clona um <tbody> já renderizado na tela e remove qualquer célula
// marcada com a classe "no-print" (colunas de ações/botões) — assim o
// PDF reaproveita exatamente os mesmos dados/badges que já estão
// corretos na tela, sem duplicar a lógica de cada tabela. Os badges de
// status/tag são coloridos por classe (.badge-success, .tag-brick etc.),
// já definidas na folha isolada do PDF (ver _envelopeHtml), então o clone
// não precisa de nenhum tratamento extra de cor.
function _tbodyParaPdf(tbodyId) {
  const tbody = $id(tbodyId);
  if (!tbody) return '';
  const clone = tbody.cloneNode(true);
  clone.querySelectorAll('.no-print').forEach(el => el.remove());
  return clone.innerHTML;
}

// Igual a _tbodyParaPdf, mas para listas desenhadas como <div class="grid-row-hover">
// em CSS Grid (não <tr>). Clonar essas <div> direto para dentro de um <tbody> é
// HTML inválido: o conversor de PDF as expulsa da tabela (foster parenting),
// deixando as linhas soltas e o cabeçalho isolado no fim. Este helper remonta
// cada linha como <tr><td> de verdade, célula a célula, preservando a classe
// (nenhuma célula desta lista usa style inline — o alinhamento, ex. .text-center
// de Início/Conclusão/Tempo de Execução, vem todo de classe).
function _gridRowsParaPdf(containerId) {
  const container = $id(containerId);
  if (!container) return '';
  const clone = container.cloneNode(true);
  clone.querySelectorAll('.no-print').forEach(el => el.remove());
  return Array.from(clone.children).filter(function (row) {
    return row.classList && row.classList.contains('grid-row-hover');
  }).map(function (row) {
    const celulas = Array.from(row.children).map(function (cel) {
      return '<td class="' + (cel.getAttribute('class') || '') + '">' + cel.innerHTML + '</td>';
    }).join('');
    return '<tr>' + celulas + '</tr>';
  }).join('');
}

// Título de seção — tabela de uma célula sem borda (mais confiável no
// conversor do que um <div> solto).
function _pdfSecaoTitulo(texto) {
  return `<table class="pdf-titulo-secao-table"><tr><td class="pdf-titulo-secao-td">${esc(texto)}</td></tr></table>`;
}

// Cabeçalho institucional (sem fundo para alinhar com a margem 0 perfeitamente)
function _cabecalhoPdfHtml(cfg) {
  return `<table class="pdf-section-table">
    <tr><td class="pdf-section-line1">SISTEMA DE GESTÃO DA QUALIDADE</td></tr>
    <tr><td class="pdf-section-line2">COMISSÃO ESPECIAL DE QUALIDADE E PADRONIZAÇÃO · CEQP | SUCOAS - SES/DF</td></tr>
    <tr><td class="pdf-section-line3">${esc(cfg.title)}</td></tr>

// Envelope HTML completo (documento válido, com <style> próprio — não
// depende do CSS.html do app, que usa flex/grid não confiáveis no

// explícitos (mais confiável entre conversores do que a palavra-chave

       :root) E o conversor de PDF não renderiza background-color de forma
       confiável em <div>/<span> (ver nota acima sobre bgcolor) — por isso,
       igual ao resto do PDF, aqui é só borda + texto colorido, sem fundo.
       Sem essas regras, todo badge chegava ao PDF sem cor nenhuma (status) ou

    .badge-success { border: 1.3px solid #157965; color: #157965; }

    .text-center { text-align: center; }
    .pdf-img-full { display: block; width: 100%; margin-bottom: 24px; }
    .pdf-img-spaced { display: block; width: 100%; margin-bottom: 14px; }
    .pdf-img-centered { display: block; width: 100%; margin: 0 auto 20px; }
    .pdf-page-break { page-break-before: always; }
    .pdf-avoid-break { page-break-inside: avoid; }
    .pdf-th-generic { font-size: 9.5px; color: #6b7280; border-bottom: 1px solid #e5e7eb; padding: 6px 4px; text-align: left; text-transform: uppercase; font-weight: bold; }

function gerarPdfLocal(tipo) {
  // Matriz e Acompanhamento dependem dos dados do SGQ (carregados sob
  // demanda). Se o usuário clicar em "Baixar PDF" antes desses dados
  // terminarem de chegar, o PDF sai com "A carregar..." nas tabelas —
  // por isso esperamos a confirmação de que já estão prontos.
  if (tipo === 'matriz' || tipo === 'acomp' || tipo === 'risco-arquivado') {
    garantirRestoData(function() { _gerarPdfReal(tipo); });
  } else {
    _gerarPdfReal(tipo);
  }
}

// Alguns relatórios (Matriz) precisam capturar um elemento da tela como
// imagem antes de montar o HTML (ver _capturarElementoComoImg) — isso é
// assíncrono, então `montarFn` pode devolver uma string OU uma Promise
// que resolve para uma string. Promise.resolve() trata os dois casos
// da mesma forma, sem exigir mudança nos relatórios que já são síncronos.
function _gerarPdfReal(tipo) {
  const cfg = CFG_PDF[tipo];
  const btnMap = { dashboard: 'btn-download-pdf', archived: 'btn-pdf-archived', matriz: 'btn-pdf-matriz', acomp: 'btn-pdf-acomp', 'risco-arquivado': 'btn-pdf-risco-arquivado' };
  const btn = $id(btnMap[tipo]);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }

  Promise.resolve(window[cfg.montarFn]()).then(function(corpoHtml) {
    const html = _envelopeHtml(cfg, corpoHtml);
    google.script.run
      .withSuccessHandler(function(r) {
        if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
        if (!r.sucesso) { showAlerta('Erro ao gerar PDF: ' + r.mensagem); return; }
        const link = document.createElement('a');
        link.href = 'data:application/pdf;base64,' + r.base64;
        link.download = cfg.file;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        _marcarPdfBaixado(btn);
      })
      .withFailureHandler(function(e) {
        if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
        showAlerta('Erro ao gerar PDF: ' + String(e));
      })
      .gerarPdfDeHtml(html, cfg.file);
  });
}

// Pisca um check verde no botão de "Baixar PDF" por 1.4s para confirmar
// visualmente que o download começou, depois volta ao ícone original.
const _ICONE_PDF_CHECK = '<svg class="pointer-none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>';
function _marcarPdfBaixado(btn) {
  if (!btn) return;
  const iconeOriginal = btn.innerHTML;
  btn.innerHTML = _ICONE_PDF_CHECK;
  btn.classList.add('success');
  setTimeout(function() {
    btn.innerHTML = iconeOriginal;
    btn.classList.remove('success');
  }, 1400);
}

function toggleTodosEmails(chk) {
  const container = $id('pdf-email-select');
  if (!container) return;
  const chks = container.querySelectorAll('.chk-email-unidade');
  chks.forEach(c => c.checked = chk.checked);
}

function adicionarEmailsSelecionados() {
  const container = $id('pdf-email-select');
  if (!container) return;
  const chks = container.querySelectorAll('input[type="checkbox"]:checked');
  if (chks.length === 0) return;
  
  let emailsToAdd = [];
  let allSelected = false;
  
  chks.forEach(chk => {
    if (chk.value === 'ALL') allSelected = true;
    else emailsToAdd.push(chk.value);
  });
  
  if (allSelected && state.units) {
    const ativas = state.units.filter(u => u.ativo !== false && u.email);
    emailsToAdd = [...new Set(ativas.map(u => u.email.trim()))];
  } else {
    emailsToAdd = [...new Set(emailsToAdd)];
  }
  
  if (emailsToAdd.length === 0) return;
  
  const input = $id('pdf-email-dest');
  let atual = input.value.trim();
  if (atual.endsWith(',')) atual = atual.slice(0, -1).trim();
  
  if (atual) {
    emailsToAdd.forEach(e => {
      if (!atual.includes(e)) atual += ', ' + e;
    });
    input.value = atual;
  } else {
    input.value = emailsToAdd.join(', ');
  }
  
  // Limpar seleção após adicionar
  container.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
}

function gerarOptsEmailsUnidades() {
  let h = '<label class="grid-row-hover chk-email-row"><input type="checkbox" value="ALL" onchange="toggleTodosEmails(this)"> <strong>Todas as unidades</strong></label>';
  if (!state.units) return h;
  const ativas = state.units.filter(u => u.ativo !== false).sort((a,b)=>a.sigla.localeCompare(b.sigla));
  ativas.forEach(u => {
    if(u.email) {
      h += `<label class="grid-row-hover chk-email-row"><input type="checkbox" class="chk-email-unidade" value="${esc(u.email)}"> ${esc(u.sigla)} - ${esc(u.email)}</label>`;
    }
  });
  return h;
}

function abrirModalEmail(tipo) { 
  tipoPdfAtual = tipo; 
  $id('pdf-email-dest').value = ''; 
  $id('pdf-email-select').innerHTML = '<option value="">Carregando unidades...</option>';
  $id('pdf-email-select').value = '';
  abrirModal('modal-pdf-email'); 
  
  garantirRestoData(function() {
    $id('pdf-email-select').innerHTML = gerarOptsEmailsUnidades();
  });
}

function dispararEnvioPdf() {
  const emailStr = ($id('pdf-email-dest').value||'').trim();
  if (!emailStr) { showAlerta('Informe pelo menos um e-mail válido.'); return; }
  
  const listaEmails = emailStr.split(',').map(e => e.trim()).filter(e => e);
  const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const invalidos = listaEmails.filter(e => !regexEmail.test(e));
  
  if (listaEmails.length === 0 || invalidos.length > 0) { 
    showAlerta('Existem e-mails inválidos na lista. Verifique e tente novamente.'); 
    return; 
  }
  
  const btn = $id('btn-enviar-pdf');
  if (btn) { btn.innerText = 'A gerar PDF...'; btn.disabled = true; }
  if (tipoPdfAtual === 'matriz' || tipoPdfAtual === 'acomp' || tipoPdfAtual === 'risco-arquivado') {
    garantirRestoData(function() { _dispararEnvioPdfReal(emailStr); });
  } else {
    _dispararEnvioPdfReal(emailStr);
  }
}

function _dispararEnvioPdfReal(email) {
  const btn = $id('btn-enviar-pdf');
  const cfg = CFG_PDF[tipoPdfAtual];

  Promise.resolve(window[cfg.montarFn]()).then(function(corpoHtml) {
    const html = _envelopeHtml(cfg, corpoHtml);
    google.script.run
      .withSuccessHandler(function(r) {
        if (r.sucesso) feedbackBtn(btn,'Enviado!','Enviar PDF',function(){ fecharModal('modal-pdf-email'); });
        else { btn.innerText='Enviar PDF'; btn.disabled=false; showAlerta(r.mensagem); }
      })
      .withFailureHandler(falha(btn,'Enviar PDF',null))
      .enviarPdfDeHtml(email, html, cfg.file, cfg.title);
  });
}

// Captura um elemento visível da tela como imagem PNG (data URI), com
// fidelidade real (cores, fonte, badges) — usa html2canvas, mas apenas
// sobre um elemento pequeno e já visível (não a página toda), então não
// precisa esconder nada nem alterar o layout: sem flash na tela.
function _capturarElementoComoImg(el) {
  if (!el || typeof html2canvas === 'undefined') return Promise.resolve('');
  return html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false })
    .then(function(canvas) { return canvas.toDataURL('image/png'); })
    .catch(function() { return ''; });
}

// ==========================================
// LOG DE ALTERAÇÕES (auditoria)
// Nunca fica em cache — busca sempre que a aba é visitada, já que é
// uma trilha de auditoria e precisa refletir o estado mais recente.
// ==========================================
var currentLogsPage = 1;

function getFiltrosLogs() {
  return {
    acao: ($id('f-log-acao') || {value:''}).value,
    usuario: ($id('f-log-usuario') || {value:''}).value,
    dataIni: ($id('f-log-data-ini') || {value:''}).value,
    dataFim: ($id('f-log-data-fim') || {value:''}).value,
    busca: (($id('f-log-busca') || {value:''}).value || '').trim()
  };
}

function carregarLogs(pagina) {
  // Aceita o nº da página. Chamadas de evento (abertura da aba, botão atualizar,
  // troca de filtro) chegam sem número — caem na página 1, resetando a navegação.
  if (typeof pagina !== 'number' || !isFinite(pagina) || pagina < 1) pagina = 1;

  msgTabela('lista-logs', 5, 'A carregar...');

  const filtros = getFiltrosLogs();
  filtros.pagina = pagina;

  google.script.run
    .withFailureHandler(function(e) {
      msgTabela('lista-logs', 5, 'Falha ao carregar: ' + (e.message || String(e)), true);
      renderPaginacao('paginacao-logs', { totalRegistros: 0 });
    })
    .withSuccessHandler(function(result) {
      const logs         = result.logs || [];
      currentLogsPage    = result.pagina || 1;
      const totalPaginas = result.totalPaginas || 1;
      const total        = result.total || 0;

      // Dropdown de usuários é montado só na página 1 (membros já carregados),
      // preservando a seleção atual — mesmo momento da carga base anterior.
      if (currentLogsPage === 1) {
        const selUsuario = $id('f-log-usuario');
        if (selUsuario) {
          const v = selUsuario.value;
          const usuariosUnicos = membrosOrdenados().map(m => m.name);
          selUsuario.innerHTML = '<option value="">Todos os Membros</option>' + usuariosUnicos.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
          if (v) selUsuario.value = v;
        }
      }

      renderLogsHTML(logs);
      renderPaginacao('paginacao-logs', {
        pagina: currentLogsPage,
        totalPaginas: totalPaginas,
        totalRegistros: total,
        onPrev: () => carregarLogs(currentLogsPage - 1),
        onNext: () => carregarLogs(currentLogsPage + 1)
      });
    }).buscarLogs(filtros);
}

function renderLogsHTML(logs) {
  logs = logs || [];
  if (!logs.length) {
    msgTabela('lista-logs', 5, 'Nenhum registro encontrado.');
    return;
  }

  $id('lista-logs').innerHTML = logs.map(l => `<div class="grid-row-hover log-row">
    <div class="log-c-data">${esc(l.dataHora)}</div>
    <div class="log-c-user">${esc(l.usuario)}</div>
    <div><span class="log-badge">${esc(l.acao)}</span></div>
    <div class="log-c-ref">${esc(l.referencia)}</div>
    <div class="log-c-det">${esc(l.detalhes)}</div>
  </div>`).join('');
}
</script>
