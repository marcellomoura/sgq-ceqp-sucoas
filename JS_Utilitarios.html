function $id(id) { return document.getElementById(id); }
function esc(s) { return s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function fmtBr(d) { if (!d || !String(d).includes('-')) return d || '-'; const p = String(d).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d; }
// Data de hoje (fuso do navegador) como 'yyyy-MM-dd', sem passar por UTC —
// evita o desvio de 1 dia que new Date().toISOString() causa à noite no
// horário de Brasília (espelha _dataLocalISO_ do servidor).
function hojeISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function badge(st, mapa) { const c = (mapa || CORES_STATUS)[st] || ['#f3f4f6','#4b5563']; return `<span class="status-badge" style="background:${c[0]};color:${c[1]};">${esc(st)}</span>`; }
// Selo "Inativo" (membro/unidade desativado) — antes digitado igual em dois
// arquivos; estado neutro/desligado, por isso continua cinza, fora da paleta.
function badgeInativo() { return '<span class="tag-badge" style="background:#4b5563;font-size:10px;margin-left:4px;color:#fff;text-decoration:none;">Inativo</span>'; }
// Iniciais da bolinha de avatar: 1ª letra do primeiro nome + 1ª letra do
// segundo nome (ex.: "Maria Clara" -> "MC"); com um nome só, usa 1 letra.
function iniciaisMembro(nome) {
  const partes = String(nome || '').trim().split(/\s+/).filter(Boolean);
  if (!partes.length) return '';
  return partes.length > 1 ? (partes[0][0] + partes[1][0]).toUpperCase() : partes[0][0].toUpperCase();
}
// Hex das 12 cores pastel, na mesma ordem de .avatar-pastel-1..12 (CSS.html) —
// usado quando é preciso o valor bruto (ex.: stroke de SVG), não uma classe.
const PALETA_PASTEL_HEX = ['#3D8FC4','#2CA98F','#D2596F','#7A6CDD','#E0904A','#C99A2E','#D8483A','#6B9B37','#1E9AA3','#A94FA0','#55647A','#8B5E3C'];
function _hashPastel(nome) {
  const s = String(nome || '');
  let hash = 0;
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(hash) % 12;
}
// Escolhe uma das 12 classes .avatar-pastel-N (CSS.html) de forma determinística
// a partir de um nome — o mesmo nome sempre cai na mesma cor (membros, e
// também etiquetas do Kanban), sem precisar guardar a cor em nenhum lugar.
function corPastelPorNome(nome) { return 'avatar-pastel-' + (_hashPastel(nome) + 1); }
// Mesma escolha de corPastelPorNome(), mas devolve o hex puro.
function corPastelHex(nome) { return PALETA_PASTEL_HEX[_hashPastel(nome)]; }
// Só renderiza como link URLs http(s) — qualquer outro valor (ex.:
// "javascript:...") aparece como texto simples, sem virar clicável.
// comIcone reaproveita o estilo do link "🔗 Acessar" de Capacitações
// (JS_Capacitacoes.html) sem afetar quem já chama linkA() sem esse parâmetro.
function linkA(url, txt, cor, comIcone) {
  if (!url || url === '-') return '-';
  if (!/^https?:\/\//i.test(String(url).trim())) return esc(url);
  const corFinal = cor || (comIcone ? '#2b7fff' : '#2563eb');
  const peso = comIcone ? 500 : 600;
  const icone = comIcone ? '🔗 ' : '';
  const semQuebra = comIcone ? 'white-space:nowrap;' : '';
  return `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:${corFinal};font-weight:${peso};text-decoration:none;${semQuebra}">${icone}${txt}</a>`;
}
function formatUnidadeUI(val) {
  if (!val || val === '-') return val || '';
  const u = state.units.find(x => String(x.id) === String(val));
  return u ? u.sigla : val;
}
function iconBtn(cls, acao, title, attrs) { return `<button type="button" class="btn-icon ${cls}" title="${title}" data-acao="${acao}" ${attrs||''}>${ICON[cls] || ICON.del}</button>`; }
// esc(txt): as mensagens de erro carregam texto de exceção vindo do servidor
// (buscarLogs etc.). Não é vetor explorável hoje, mas era o único innerHTML do
// arquivo que interpolava texto sem escapar.
function msgTabela(tbodyId, cols, txt, err) { $id(tbodyId).innerHTML = `<tr><td colspan="${cols}" class="${err?'msg-error':'msg-empty'}">${esc(txt)}</td></tr>`; }
function feedbackBtn(btn, ok, orig, cb) { btn.disabled=false; btn.innerText=ok; setTimeout(()=>{ btn.innerText=orig; if(cb) cb(); }, 1400); }
function falha(btn, orig, statusEl) {
  return function(e) {
    if(btn){btn.disabled=false; btn.innerText=orig;}
    const msg='Erro de comunicação: '+(e&&e.message?e.message:String(e));
    if(statusEl){statusEl.innerText=msg; statusEl.style.color='#dc2626';}
    else showAlerta(msg);
  };
}

// ---------- Helpers de membros (compartilhados por Kanban, Dashboard, Pessoas) ----------
// Cópia ordenada por nome (pt-BR) — a ordem original de state.members é
// preservada porque os botões de editar/excluir usam o índice original.
// Só membros ATIVOS, ordenados por nome — usado em seletores de responsável,
// filtros, escala e afastamentos. Para resolver NOMES de qualquer membro
// (inclusive inativos, em cartões/gráficos antigos) use nomesMembros/state.members.
function membrosOrdenados() {
  return state.members.filter(m => m.ativo !== false)
    .sort((a, b) => (a.name||'').localeCompare(b.name||'', 'pt-BR', { sensitivity: 'base' }));
}
// A coluna Responsável_ID guarda um JSON de ids ("[\"MEM-1\"]"), mas dados
// antigos podem ter um id solto — os dois formatos são aceitos aqui.
function parseIdsResponsaveis(val) {
  try {
    const ids = JSON.parse(val);
    return Array.isArray(ids) ? ids.map(String) : (val ? [String(val)] : []);
  } catch(e) { return val ? [String(val)] : []; }
}
function nomesMembros(ids) {
  return ids.map(id => { const m = state.members.find(x => String(x.id) === String(id)); return m ? m.name : ''; })
    .filter(n => n).join(', ');
}
// Options "Todos" + membros em ordem alfabética (filtros de membro)
function optsMembros() {
  return '<option value="">Todos</option>' +
    membrosOrdenados().map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
}

// Alertas e confirmações
function showAlerta(msg) { $id('alerta-msg').innerText=msg; abrirModal('modal-alerta'); }
// showConfirm(msg, cb, opts?) — por padrão usa o visual de exclusão (vermelho,
// lixeira, "Excluir"). Passe opts.tone='warning' para o visual de arquivamento
// (âmbar, caixa, "Arquivar"). Sempre reaplica tudo, então não fica visual
// "vazado" de uma confirmação para a próxima.
function showConfirm(msg, cb, opts) {
  opts = opts || {};
  let cfg;
  if (opts.tone === 'warning') {
    cfg = { cor:'#C99A2E', bg:'#FBF3D3', titulo:'Confirmar Arquivamento', label:'Arquivar',
        icon:'<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>' };
  } else if (opts.tone === 'restore') {
    cfg = { cor:'#C99A2E', bg:'#FBF3D3', titulo:'Confirmar Restauração', label:'Restaurar',
        icon:'<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>' };
  } else {
    cfg = { cor:'#D8483A', bg:'#FCE1DE', titulo:'Confirmação de Exclusão', label:'Excluir',
        icon:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>' };
  }
  $id('confirm-msg').innerText = msg;
  $id('confirm-title').innerText = opts.title || cfg.titulo;
  const btn = $id('btn-confirmar-excluir');
  btn.innerText = opts.confirmLabel || cfg.label;
  btn.dataset.loadingText = opts.loadingText || 'A processar...';
  btn.style.background = cfg.cor; btn.style.borderColor = cfg.cor;
  $id('confirm-box').style.borderTopColor = cfg.cor;
  $id('confirm-icon-wrap').style.background = cfg.bg;
  const svg = $id('confirm-icon'); svg.setAttribute('stroke', cfg.cor); svg.innerHTML = cfg.icon;
  itemExcluir = cb;
  abrirModal('modal-confirmar');
}

// Modais
function abrirModal(id) { $id(id).classList.add('open'); }
function fecharModal(id) { const el=$id(id); if(el) el.classList.remove('open'); }

// Dropdowns de unidade (opts pré-gerados para não refazer a cada chamada)
function gerarOptsUnidades(comTodas) {
  let html = '<option value="" disabled selected>Selecione...</option>';
  const ordenadas = [...state.units].filter(u => u.ativo !== false).sort((a, b) => a.unidade.localeCompare(b.unidade, 'pt-BR', { sensitivity: 'base' }));
  ordenadas.forEach(u => { const label = esc(u.sigla); html+=`<option value="${esc(u.id)}">${label}</option>`; });
  if (comTodas) html += '<option value="Todas as Subcomissões">Todas as Subcomissões</option>';
  return html;
}

function gerarOptsProprietariosRisco() {
  let html = '<option value="" disabled selected>Selecione...</option>';
  const ordenadas = [...state.units]
    .filter(u => u.ativo !== false)
    .filter(u => {
      const n = u.unidade.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      return !n.includes('comissao') && !n.includes('subcomissao');
    })
    .sort((a, b) => a.unidade.localeCompare(b.unidade, 'pt-BR', { sensitivity: 'base' }));
  ordenadas.forEach(u => { const label = esc(u.sigla); html+=`<option value="${esc(u.id)}">${label}</option>`; });
  return html;
}
function optsUnidFiltro() {
  let h='<option value="">Todas as Unidades</option>';
  const ordenadas = [...state.units].sort((a, b) => a.unidade.localeCompare(b.unidade, 'pt-BR', { sensitivity: 'base' }));
  ordenadas.forEach(u=>{ 
    const isInactive = u.ativo === false ? ' (Inativa)' : '';
    const label = `${esc(u.sigla)}${isInactive}`; 
    h+=`<option value="${esc(u.id)}">${label}</option>`; 
  });
  return h;
}
function sincronizarSelectsUnidade() {
  const resps = [['d-resp',false],['p-who',true],['ed-resp',false],['ep-who',true]];
  resps.forEach(([id, comTodas]) => { const el=$id(id); if(!el) return; const v=el.value; el.innerHTML=gerarOptsUnidades(comTodas); if(v) el.value=v; });
  
  const proprietarios = ['r-resp', 'er-resp'];
  proprietarios.forEach(id => { const el=$id(id); if(!el) return; const v=el.value; el.innerHTML=gerarOptsProprietariosRisco(); if(v) el.value=v; });
  const filtros = ['f-doc-unidade','f-rev-unidade','f-acomp-unidade'];
  filtros.forEach(id => { const el=$id(id); if(!el) return; const v=el.value; el.innerHTML=optsUnidFiltro(); if(v) el.value=v; });
}

// ==========================================
// CARREGAMENTO SOB DEMANDA (lazy) do "resto" do sistema
// (Unidades, Documentos, Riscos, Planos, Entregas). Só dispara na
// primeira vez que o usuário visita uma dessas abas — nunca é buscado
// automaticamente. Depois de carregado uma vez, fica em cache no
// `state` e não busca de novo. Cada módulo ressincroniza o próprio estado
// após uma escrita pelo seu endpoint leve (recarregarDocs/recarregarUnidades/
// recarregarRiscosPlanos/recarregarCapacitacoes), sem reler as 7 abas.
// ==========================================
var restoDataLoaded = false;
var restoDataLoading = false;
var restoDataFilaCallbacks = [];
var logsCache = []; // B17: Declaração global explícita

function garantirRestoData(callback) {
  if (restoDataLoaded) { callback(); return; }
  restoDataFilaCallbacks.push(callback);
  if (restoDataLoading) return; // já tem uma busca em andamento, só entra na fila

  restoDataLoading = true;
  google.script.run
    .withFailureHandler(function(e) {
      // Sem isso, uma falha do servidor deixava a tela travada em
      // "A carregar..." para sempre, sem nenhum aviso do que houve.
      restoDataLoading = false;
      restoDataFilaCallbacks = [];
      showAlerta('Falha ao carregar dados do sistema: ' + (e.message || String(e)) + '. Tente trocar de aba novamente.');
    })
    .withSuccessHandler(function(resto) {
      try {
        state.units = resto.units;
        state.docs = resto.docs;
        state.risks = resto.risks;
        state.plans = resto.plans;
        state.deliveries = resto.deliveries;
        state.trainings = resto.trainings;
        // Sem isto a Matriz de Risco plota probabilidade/impacto ORIGINAIS até
        // que alguma escrita dispare recarregarRiscosPlanos(), e o modal de
        // reavaliação pré-preenche com os valores antigos (salvar "manter"
        // regredia o risco para a avaliação anterior).
        state.history = resto.history || [];
        sincronizarSelectsUnidade();
      } catch (err) {
        // Um erro aqui não pode travar o carregamento para sempre —
        // registra no console e segue em frente com o que já temos.
        console.error('Erro ao processar dados do SGQ:', err);
      }
      restoDataLoaded = true;
      restoDataLoading = false;
      var fila = restoDataFilaCallbacks; restoDataFilaCallbacks = [];
      fila.forEach(function(cb) {
        try { cb(); } catch (err) {
          console.error('Erro ao renderizar aba após carregar dados:', err);
          showAlerta('Erro ao exibir os dados: ' + (err.message || String(err)));
        }
      });
    }).getRestoData();
}

// NAVEGAÇÃO
// ==========================================
function mudarTab(tab, botao) {
  currentTab = tab;
  document.querySelectorAll('.menu-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  if(botao) botao.classList.add('active');
  const view = $id('view-' + tab);
  if(view) view.classList.add('active');

  atualizarTopBar();
  const SGQ_TABS = ['unidades','doc-lista','doc-revisoes','risco-matriz','plano-acomp','capacitacoes-lista','indicadores'];

  const rotinas = {
    'kanban': ()=>renderTasks(),
    // Arquivados têm busca própria e sob demanda (não vêm mais no payload do
    // quadro) — a msgTabela evita a tabela vazia piscando durante a carga.
    'archived': ()=>{
      if (!archivedLoaded) msgTabela('archived-list', 7, 'A carregar...');
      garantirArquivados(()=>renderArquivados(true));
    },
    'members': ()=>renderMembers(),
    // Os gráficos do Kanban no Painel somam ativos + arquivados (métrica
    // histórica), então os arquivados precisam estar carregados antes.
    'indicadores': ()=>garantirArquivados(()=>setTimeout(renderIndicadores, 50)),
    'escala': ()=>renderEscala(),
    'unidades': ()=>renderUnidades(),
    'doc-lista': ()=>renderDocumentos('mestra'),
    'doc-revisoes': ()=>renderDocumentos('revisoes'),
    'risco-matriz': ()=>renderMatriz(),
    'plano-acomp': ()=>renderAcompanhamento(),

    'capacitacoes-lista': ()=>{ renderCapacitacoes(); renderKpisCapacitacoes(); },
    'ferias': ()=>carregarFerias()
  };

  if (tab === 'logs')   { carregarLogs();   return; }

  // Mostra "A carregar..." nas tabelas das abas do SGQ enquanto os dados
  // não chegam (só na primeira visita — depois fica em cache)
  const MSG_TABELA_POR_ABA = {
    'unidades': ['lista-unidades', 4], 'doc-lista': ['lista-mestra', 12],
    'doc-revisoes': ['lista-revisoes', 10], 'risco-matriz': ['lista-riscos', 12],
    'plano-acomp': ['lista-acomp', 11], 'capacitacoes-lista': ['lista-capacitacoes', 10],
    'risco-arquivado': ['lista-riscos-arquivados', 9]
  };

  if (SGQ_TABS.indexOf(tab) !== -1) {
    if (!restoDataLoaded && MSG_TABELA_POR_ABA[tab]) {
      msgTabela(MSG_TABELA_POR_ABA[tab][0], MSG_TABELA_POR_ABA[tab][1], 'A carregar...');
    }
    garantirRestoData(function() { if (rotinas[tab]) rotinas[tab](); });
  } else if (rotinas[tab]) {
    rotinas[tab]();
  }
}

// ==========================================
// PAINEL DE INDICADORES (Monitoramento)
// Centraliza os gráficos do Kanban (Módulo 1) e das Capacitações
// (Módulo 6), sob um único filtro de membro (dashMemberFilter).
// ==========================================
function renderIndicadores() {
  // Chart.js vem de CDN (jsDelivr). Se a rede falhar e a lib não carregar,
  // todos os new Chart() abaixo lançariam "Chart is not defined" e abortariam
  // o Painel inteiro. Guardamos no único ponto de entrada dos 7 gráficos e
  // avisamos o usuário de forma não-bloqueante em vez de quebrar em silêncio.
  if (typeof Chart === 'undefined') {
    _avisarBibliotecaGraficos();
    return;
  }
  _removerAvisoGraficos();
  if (typeof ChartDataLabels !== 'undefined') {
    Chart.register(ChartDataLabels);
  }
  const fid = ($id('dashMemberFilter')||{value:''}).value;
  renderGraficosKanban(fid);
  renderGraficosCapacitacoes(fid);
}

// Aviso (idempotente) exibido no topo do Painel quando o Chart.js não está
// disponível — inserido/removido conforme a lib carrega numa recarga futura.
function _avisarBibliotecaGraficos() {
  const view = $id('view-indicadores');
  if (!view || $id('aviso-graficos-cdn')) return;
  const box = document.createElement('div');
  box.id = 'aviso-graficos-cdn';
  box.className = 'msg-error';
  box.style.margin = '16px 28px';
  box.textContent = 'Não foi possível carregar a biblioteca de gráficos (Chart.js). '
    + 'Verifique a conexão com a internet e recarregue a página.';
  view.insertBefore(box, view.firstChild);
}

function _removerAvisoGraficos() {
  const box = $id('aviso-graficos-cdn');
  if (box) box.remove();
}

// Corpo do relatório do Painel de Indicadores — os 7 gráficos viram
// imagem estática (Chart.js não existe fora do navegador); cada módulo
// monta apenas a parte que lhe pertence.
function montarHtmlIndicadoresPdf() {
  const getTxt = id => { const e = document.getElementById(id); return e ? e.innerText : '0'; };
  const kpis = `<table style="margin-bottom:20px;"><tr>
    ${_pdfKpiCell('Tarefas em Andamento', getTxt('kpi-dash-tarefas'), '#7A6CDD')}
    ${_pdfKpiCell('Tarefas Concluídas', getTxt('kpi-dash-tarefas-conc'), '#2CA98F')}
    ${_pdfKpiCell('Capacitações Ativas', getTxt('kpi-dash-cap'), '#8b5cf6')}
    ${_pdfKpiCell('Capacitações Realizadas', getTxt('kpi-dash-cap-conc'), '#2CA98F')}

  return kpis + tKanban + graficosKanbanPdfHtml() + tCap + graficosCapacitacoesPdfHtml();
}

document.addEventListener('DOMContentLoaded', function() {
  const dashYearFilter = $id('dashYearFilter');
  if (dashYearFilter) {
    const anoAtual = new Date().getFullYear();
    let opts = '<option value="">Todos os Anos</option>';
    const maxAno = Math.max(2028, anoAtual + 2); // Garante que mostre alguns anos à frente também
    for (let ano = 2026; ano <= maxAno; ano++) {
      opts += `<option value="${ano}">${ano}</option>`;
    }
    dashYearFilter.innerHTML = opts;
    dashYearFilter.value = anoAtual;
  }

  // Inicia com todos os grupos da sidebar FECHADOS
  document.querySelectorAll('.nav-group-title').forEach(function(btn) {
    btn.classList.remove('open');
    var submenu = document.getElementById(btn.dataset.group);
    if (submenu) submenu.classList.remove('open');
  });
  document.querySelectorAll('.menu-item').forEach(function(b) { b.classList.remove('active'); });

  // Abre o módulo de Tarefas e activa o Kanban IMEDIATAMENTE — não espera
  // nenhum dado do servidor. As colunas aparecem na hora; os cartões
  // preenchem assim que a etapa 1 (abaixo) retornar.
  var btnGrupo  = document.querySelector('[data-group="g-tarefas"]');
  var btnKanban = document.querySelector('[data-tab="kanban"]');
  if (btnGrupo) {
    btnGrupo.classList.add('open');
    var sub = document.getElementById('g-tarefas');
    if (sub) sub.classList.add('open');
  }
  if (btnKanban) mudarTab('kanban', btnKanban);

  // Único carregamento automático: só Tarefas + Membros (Kanban).
  // O resto do sistema (Unidades, Documentos, Riscos, Planos, Entregas)
  // só é buscado quando o usuário efetivamente clica numa dessas abas —
  // ver garantirRestoData() em mudarTab().
  google.script.run
    .withFailureHandler(function(e) { showAlerta('Falha ao carregar dados: ' + (e.message||String(e))); })
    .withSuccessHandler(function(data) {
      state.tasks = data.tasks;
      state.members = data.members;
      renderTasks();
      sincronizarDropdownMembros();
      // Se o usuário já clicou numa aba que também depende destes dados
      // (Membros, Escala, Dashboard, Arquivados) ANTES desta resposta
      // chegar, essa aba renderizou vazia e nunca era atualizada sozinha —
      // precisava trocar de aba e voltar para os dados aparecerem. Re-renderiza
      // a aba que estiver ativa neste momento para corrigir isso.
      // 'archived' continua aqui: a tabela de arquivados tem busca própria, mas
      // resolve os nomes dos responsáveis por state.members, que vem daqui.
      // 'indicadores' precisa dos arquivados (métrica histórica) — ver
      // renderGraficosKanban.
      const rotinasPosCargaInicial = {
        'members': renderMembers, 'escala': renderEscala,
        'ferias': carregarFerias,
        'indicadores': ()=>garantirArquivados(renderIndicadores),
        'archived': renderArquivados, 'risco-arquivado': renderRiscosArquivados
      };
      if (rotinasPosCargaInicial[currentTab]) rotinasPosCargaInicial[currentTab]();

      // Pré-carrega o "resto" do sistema (Unidades, Documentos, Riscos,
      // Planos, Entregas, Capacitações) em segundo plano, logo depois que o
      // Kanban já está na tela. Assim a PRIMEIRA vez que o usuário abre uma
      // aba do SGQ ela aparece na hora, em vez de esperar a busca pesada
      // disparar só no clique. Se ele clicar antes de terminar, garantirRestoData
      // apenas entra na fila da mesma busca (não dispara outra).
      setTimeout(function() {
        if (!restoDataLoaded && !restoDataLoading) garantirRestoData(function() {});
      }, 400);
    }).getKanbanData();

  // Afastamentos: busca própria, disparada em paralelo com a de cima (não
  // encadeada). Não entra no pacote de Tarefas+Membros porque esse é relido
  // a cada ação de cartão (recarregarKanban) — colocar Afastamentos lá
  // pesaria em toda edição/movimentação de cartão. Ainda assim chega cedo o
  // bastante para a aba abrir na hora, como Membros/Escala.
  google.script.run
    .withFailureHandler(function(e) { console.error('Falha ao pré-carregar Afastamentos: ' + (e.message||String(e))); })
    .withSuccessHandler(function(data) {
      state.afastamentos = data || [];
      if (currentTab === 'ferias') carregarFerias();
    }).getAfastamentos();

  // A13: Acessibilidade - Injetar ARIA roles nos modais e configurar Focus Trap
  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
  });
});

document.addEventListener('keydown', function(e) {
  // Focus Trap e fechamento via ESC para modais
  if (e.key === 'Escape') {
    const openModals = document.querySelectorAll('.modal-overlay.open');
    if (openModals.length > 0) {
      fecharModal(openModals[openModals.length - 1].id);
    }
    return;
  }
  if (e.key === 'Tab') {
    const openModals = document.querySelectorAll('.modal-overlay.open');
    if (openModals.length === 0) return;
    const modal = openModals[openModals.length - 1];
    const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    
    if (e.shiftKey) {
      if (document.activeElement === first) {
        last.focus();
        e.preventDefault();
      }
    } else {
      if (document.activeElement === last) {
        first.focus();
        e.preventDefault();
      }
    }
  }
});

// ==========================================
// PDF
// Gerado inteiramente no SERVIDOR a partir de um HTML de impressão
// dedicado (montado aqui reaproveitando os dados já na tela — não uma
// captura da página). Vantagens sobre a captura de tela (html2canvas):
// nunca corta/deixa página em branco (é um documento real, não uma
// imagem fatiada), não pisca nada na tela (a página visível nunca é
// tocada) e é mais leve (sem biblioteca de terceiros).
// Cada tipo aponta pro nome de uma função "montarHtml...Pdf" (definida
// perto do render da respectiva tela) que devolve só o HTML do corpo do
// relatório — o envelope (estilo + cabeçalho) é comum, montado abaixo.
// A função é referenciada por NOME (string) e resolvida em tempo de
// clique, não no carregamento do script: como os arquivos JS_*.html são
// concatenados em <script>s separados, na hora em que este trecho é
// executado nem todo mundo já rodou — resolver por nome evita depender
// da ordem de carregamento.
// ==========================================
const CFG_PDF = {
  'dashboard': { file: 'Painel_Indicadores_SGQ.pdf',   title: 'Painel de Indicadores',                ori: 'landscape', montarFn: 'montarHtmlIndicadoresPdf' },
  'archived' : { file: 'Cartoes_Arquivados_SGQ.pdf',   title: 'Cartões Arquivados',                  ori: 'portrait',  montarFn: 'montarHtmlArquivadosPdf' },
  'matriz'   : { file: 'Matriz_Risco_SGQ.pdf',         title: 'Matriz de Risco',                     ori: 'landscape', montarFn: 'montarHtmlMatrizPdf' },
  'acomp'    : { file: 'Acompanhamento_Acoes_SGQ.pdf', title: 'Acompanhamento de Ações',             ori: 'landscape', montarFn: 'montarHtmlAcompanhamentoPdf' },
  'risco-arquivado': { file: 'Riscos_Arquivados_SGQ.pdf', title: 'Riscos e Planos Arquivados',       ori: 'landscape', montarFn: 'montarHtmlRiscoArquivadoPdf' }
};

// O conversor de HTML→PDF do Apps Script (Utilities.newBlob().getAs(PDF))
// não renderiza background-color de forma confiável em elementos comuns
// (testado: cor de fundo de <div>/<span> some por completo). O que
// funciona de forma consistente:
//  - texto e cor de texto (color)
//  - bordas
//  - o atributo HTML legado "bgcolor" em <table>/<tr>/<td>/<th>
// Por isso, TUDO que precisa de uma cor de preenchimento no PDF usa
// <td bgcolor="..."> (nunca <div style="background:...">), e badges que
// no app usam pílula colorida (fundo claro + texto escuro) viram aqui borda +
// texto colorido — sem depender de nenhum preenchimento.

// Extrai a cor de "color: X" (texto) de um style inline — não confundir com
// "background-color: X", por isso a declaração é isolada por ";" antes do match.
function _extrairCorTexto(styleTexto) {
  const partes = String(styleTexto || '').split(';');
  for (const p of partes) {
    const m = /^\s*color\s*:\s*(.+)$/i.exec(p);
    if (m) return m[1].trim();
  }
  return null;
}

// Converte badges de pílula colorida (status-badge/tag-badge, que hoje usam
// fundo claro + texto escuro) em borda + texto colorido — a única forma que
// renderiza de maneira confiável no PDF. Usa a cor do TEXTO (escura, legível),
// não a de fundo (clara demais para servir de cor de traço/texto no PDF).
function _converterBadgesParaPdf(container) {
  container.querySelectorAll('.status-badge, .tag-badge').forEach(function(el) {
    const cor = _extrairCorTexto(el.getAttribute('style'));
    if (!cor) return;
    el.setAttribute('style', `border:1.3px solid ${cor};color:${cor};font-weight:700;background:none;`);
  });
}

// Clona um <tbody> já renderizado na tela e remove qualquer célula
// marcada com a classe "no-print" (colunas de ações/botões) — assim o
// PDF reaproveita exatamente os mesmos dados/badges que já estão
// corretos na tela, sem duplicar a lógica de cada tabela. Os badges
// coloridos passam por _converterBadgesParaPdf (ver acima).
function _tbodyParaPdf(tbodyId) {
  const tbody = $id(tbodyId);
  if (!tbody) return '';
  const clone = tbody.cloneNode(true);
  clone.querySelectorAll('.no-print').forEach(el => el.remove());
  _converterBadgesParaPdf(clone);
  return clone.innerHTML;
}

// Título de seção — tabela de uma célula sem borda (mais confiável no
// conversor do que um <div> solto).
function _pdfSecaoTitulo(texto) {
  return `<table style="margin:16px 0 8px;"><tr><td style="border:none;padding:0;font-size:14px;font-weight:700;color:#030712;">${esc(texto)}</td></tr></table>`;
}

function _pdfKpiCell(label, valor, cor) {
  return `<td bgcolor="#ffffff" style="background:#ffffff;width:25%;padding:14px 16px;border:1px solid #e5e7eb;">
    <span style="font-size:10.5px;font-weight:700;color:#4b5563;">${esc(label)}</span><br>
    <div style="font-size:24px;font-weight:700;color:${cor};margin-top:8px;">${esc(String(valor))}</div>
  </td>`;
}

// Converte um <canvas> de gráfico Chart.js em imagem (Chart.js não roda
// no servidor, então cada gráfico do PDF vira uma imagem estática).
function _imgDeCanvas(canvasId) {
  try { const c = $id(canvasId); return c ? c.toDataURL('image/png') : ''; } catch(e) { return ''; }
}
function _pdfGraficoCel(titulo, canvasId, largura) {
  return `<td style="width:${largura||'50%'};padding:0 4px;vertical-align:top;border:none;">
    <div style="border:1px solid #e5e7eb; border-radius:6px; padding:8px; background-color:#ffffff;">
      <span style="font-size:11px;font-weight:700;color:#4b5563;display:block;margin-bottom:8px;text-align:center;">${esc(titulo)}</span>
      <div style="text-align:center;">
        <img src="${_imgDeCanvas(canvasId)}" style="max-height:165px; width:auto; max-width:100%;">
      </div>
    </div>
  </td>`;
}

// Cabeçalho institucional (sem fundo para alinhar com a margem 0 perfeitamente)
function _cabecalhoPdfHtml(cfg) {
  return `<table style="margin-bottom:20px; border-collapse: collapse;">
    <tr><td style="border:none;padding:0 0 6px 0;font-size:12px;font-weight:800;color:#030712;">SISTEMA DE GESTÃO DA QUALIDADE</td></tr>
    <tr><td style="border:none;padding:0 0 16px 0;color:#6b7280;font-size:9.5px;border-bottom:1px solid #e5e7eb;">COMISSÃO ESPECIAL DE QUALIDADE E PADRONIZAÇÃO · CEQP | SUCOAS - SES/DF</td></tr>
    <tr><td style="border:none;padding:16px 0 0;font-size:24px;font-weight:700;color:#030712;">${esc(cfg.title)}</td></tr>
  </table>`;
}

// Envelope HTML completo (documento válido, com <style> próprio — não
// depende do CSS.html do app, que usa flex/grid não confiáveis no
// conversor de PDF do Apps Script). Dimensões do @page em milímetros
// explícitos (mais confiável entre conversores do que a palavra-chave
// "landscape") para garantir a orientação correta.
function _envelopeHtml(cfg, corpoHtml) {
  const pagina = cfg.ori === 'landscape' ? '297mm 210mm' : '210mm 297mm';
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    @page { size: ${pagina}; margin: 12mm; }
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; color: #030712; font-size: 11px; margin: 0; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: middle; font-size: 10.5px; }
    th { background: #f9fafb; color: #4b5563; font-size: 9.5px; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid #e5e7eb; }
    tr { page-break-inside: avoid; }
    .msg-empty { text-align: center; color: #6b7280; padding: 16px; font-size: 11px; }
    .status-badge { padding: 3px 8px; border-radius: 5px; font-weight: 700; font-size: 9.5px; display: inline-block; white-space: nowrap; }
    .tag-badge { border-radius: 4px; padding: 2px 6px; font-size: 9px; font-weight: 700; color: white; display: inline-block; }
    .urgent-date { color: #D8483A; font-weight: 700; }
    .matrix-table { border-collapse: separate; border-spacing: 3px; margin-bottom: 6px; }
    .matrix-table th, .matrix-table td { height: 70px; text-align: center; font-weight: 700; border-radius: 5px; font-size: 10.5px; width: 16%; vertical-align: middle; padding: 3px; }
    .badge-cluster { display: block; text-align: center; }
    .risk-badge { display: inline-block; border: 1px solid #d1d5db; color: #030712; padding: 1px 5px; border-radius: 4px; font-size: 9.5px; font-weight: 700; margin: 1px; }
  </style></head><body>${_cabecalhoPdfHtml(cfg)}${corpoHtml}</body></html>`;
}

function gerarPdfLocal(tipo) {
  // Matriz e Acompanhamento dependem dos dados do SGQ (carregados sob
  // demanda). Se o usuário clicar em "Baixar PDF" antes desses dados
  // terminarem de chegar, o PDF sai com "A carregar..." nas tabelas —
  // por isso esperamos a confirmação de que já estão prontos.
  if (tipo === 'matriz' || tipo === 'acomp' || tipo === 'risco-arquivado') {
    garantirRestoData(function() { _gerarPdfReal(tipo); });
  } else {
    _gerarPdfReal(tipo);
  }
}

// Alguns relatórios (Matriz) precisam capturar um elemento da tela como
// imagem antes de montar o HTML (ver _capturarElementoComoImg) — isso é
// assíncrono, então `montarFn` pode devolver uma string OU uma Promise
// que resolve para uma string. Promise.resolve() trata os dois casos
// da mesma forma, sem exigir mudança nos relatórios que já são síncronos.
function _gerarPdfReal(tipo) {
  const cfg = CFG_PDF[tipo];
  const btnMap = { dashboard: 'btn-download-pdf', archived: 'btn-pdf-archived', matriz: 'btn-pdf-matriz', acomp: 'btn-pdf-acomp', 'risco-arquivado': 'btn-pdf-risco-arquivado' };
  const btn = $id(btnMap[tipo]);
  if (btn) { btn.classList.add('loading'); btn.disabled = true; }

  Promise.resolve(window[cfg.montarFn]()).then(function(corpoHtml) {
    const html = _envelopeHtml(cfg, corpoHtml);
    google.script.run
      .withSuccessHandler(function(r) {
        if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
        if (!r.sucesso) { showAlerta('Erro ao gerar PDF: ' + r.mensagem); return; }
        const link = document.createElement('a');
        link.href = 'data:application/pdf;base64,' + r.base64;
        link.download = cfg.file;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      })
      .withFailureHandler(function(e) {
        if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
        showAlerta('Erro ao gerar PDF: ' + String(e));
      })
      .gerarPdfDeHtml(html, cfg.file);
  });
}

function adicionarEmailDest(val) {
  if (!val) return;
  const input = $id('pdf-email-dest');
  let atual = input.value.trim();
  // Remove trailing comma if exists
  if (atual.endsWith(',')) atual = atual.slice(0, -1).trim();
  
  if (val === 'ALL') {
    if (!state.units) return;
    const ativas = state.units.filter(u => u.ativo !== false && u.email);
    // Filter unique emails
    const emails = [...new Set(ativas.map(u => u.email.trim()))];
    const todos = emails.join(', ');
    input.value = atual ? atual + ', ' + todos : todos;
  } else {
    input.value = atual ? atual + ', ' + val : val;
  }
  $id('pdf-email-select').value = '';
}

function gerarOptsEmailsUnidades() {
  let h = '<option value="">Adicionar Unidade à lista...</option>';
  h += '<option value="ALL">** Adicionar TODAS as Unidades **</option>';
  if (!state.units) return h;
  const ativas = state.units.filter(u => u.ativo !== false).sort((a,b)=>a.sigla.localeCompare(b.sigla));
  ativas.forEach(u => {
    if(u.email) {
      h += `<option value="${esc(u.email)}">${esc(u.sigla)} - ${esc(u.email)}</option>`;
    }
  });
  return h;
}

function abrirModalEmail(tipo) { 
  tipoPdfAtual = tipo; 
  $id('pdf-email-dest').value = ''; 
  $id('pdf-email-select').innerHTML = '<option value="">Carregando unidades...</option>';
  $id('pdf-email-select').value = '';
  abrirModal('modal-pdf-email'); 
  
  garantirRestoData(function() {
    $id('pdf-email-select').innerHTML = gerarOptsEmailsUnidades();
  });
}

function dispararEnvioPdf() {
  const emailStr = ($id('pdf-email-dest').value||'').trim();
  if (!emailStr) { showAlerta('Informe pelo menos um e-mail válido.'); return; }
  
  const listaEmails = emailStr.split(',').map(e => e.trim()).filter(e => e);
  const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const invalidos = listaEmails.filter(e => !regexEmail.test(e));
  
  if (listaEmails.length === 0 || invalidos.length > 0) { 
    showAlerta('Existem e-mails inválidos na lista. Verifique e tente novamente.'); 
    return; 
  }
  
  const btn = $id('btn-enviar-pdf');
  if (btn) { btn.innerText = 'A gerar PDF...'; btn.disabled = true; }
  if (tipoPdfAtual === 'matriz' || tipoPdfAtual === 'acomp' || tipoPdfAtual === 'risco-arquivado') {
    garantirRestoData(function() { _dispararEnvioPdfReal(emailStr); });
  } else {
    _dispararEnvioPdfReal(emailStr);
  }
}

function _dispararEnvioPdfReal(email) {
  const btn = $id('btn-enviar-pdf');
  const cfg = CFG_PDF[tipoPdfAtual];

  Promise.resolve(window[cfg.montarFn]()).then(function(corpoHtml) {
    const html = _envelopeHtml(cfg, corpoHtml);
    google.script.run
      .withSuccessHandler(function(r) {
        if (r.sucesso) feedbackBtn(btn,'✅ Enviado!','📨 Enviar PDF',function(){ fecharModal('modal-pdf-email'); });
        else { btn.innerText='📨 Enviar PDF'; btn.disabled=false; showAlerta(r.mensagem); }
      })
      .withFailureHandler(falha(btn,'📨 Enviar PDF',null))
      .enviarPdfDeHtml(email, html, cfg.file, cfg.title);
  });
}

// Captura um elemento visível da tela como imagem PNG (data URI), com
// fidelidade real (cores, fonte, badges) — usa html2canvas, mas apenas
// sobre um elemento pequeno e já visível (não a página toda), então não
// precisa esconder nada nem alterar o layout: sem flash na tela.
function _capturarElementoComoImg(el) {
  if (!el || typeof html2canvas === 'undefined') return Promise.resolve('');
  return html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false })
    .then(function(canvas) { return canvas.toDataURL('image/png'); })
    .catch(function() { return ''; });
}

// ==========================================
// LOG DE ALTERAÇÕES (auditoria)
// Nunca fica em cache — busca sempre que a aba é visitada, já que é
// uma trilha de auditoria e precisa refletir o estado mais recente.
// ==========================================
var currentLogsOffset = 0;
var currentLogsHasMore = false;

function getFiltrosLogs() {
  return {
    acao: ($id('f-log-acao') || {value:''}).value,
    usuario: ($id('f-log-usuario') || {value:''}).value,
    dataIni: ($id('f-log-data-ini') || {value:''}).value,
    dataFim: ($id('f-log-data-fim') || {value:''}).value,
    busca: (($id('f-log-busca') || {value:''}).value || '').trim()
  };
}

function carregarLogs(isLoadMore = false) {
  if (typeof isLoadMore !== 'boolean') isLoadMore = false; // Tratar chamadas de evento

  if (!isLoadMore) {
    currentLogsOffset = 0;
    msgTabela('lista-logs', 5, 'A carregar...');
    const btnMais = $id('btn-load-more-logs');
    if (btnMais) btnMais.style.display = 'none';
  } else {
    const btnMais = $id('btn-load-more-logs');
    if (btnMais) { btnMais.innerText = 'A carregar...'; btnMais.disabled = true; }
  }

  const filtros = getFiltrosLogs();
  filtros.offset = currentLogsOffset;

  google.script.run
    .withFailureHandler(function(e) {
      if (!isLoadMore) {
        msgTabela('lista-logs', 5, 'Falha ao carregar: ' + (e.message || String(e)), true);
      } else {
        showAlerta('Falha ao carregar mais registros: ' + (e.message || String(e)));
        const btnMais = $id('btn-load-more-logs');
        if (btnMais) { btnMais.innerText = 'Carregar mais'; btnMais.disabled = false; }
      }
    })
    .withSuccessHandler(function(result) {
      const logs = result.logs || [];
      currentLogsHasMore = result.temMais || false;
      const acoesUnicas = result.acoesUnicas || [];

      if (!isLoadMore && currentLogsOffset === 0) {
        const selAcao = $id('f-log-acao');
        if (selAcao && acoesUnicas.length > 0) {
          const v = selAcao.value;
          selAcao.innerHTML = '<option value="">Todas</option>' + acoesUnicas.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
          if (v) selAcao.value = v;
        }
        const selUsuario = $id('f-log-usuario');
        if (selUsuario) {
          const v = selUsuario.value;
          const usuariosUnicos = membrosOrdenados().map(m => m.name);
          selUsuario.innerHTML = '<option value="">Todos</option>' + usuariosUnicos.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('');
          if (v) selUsuario.value = v;
        }
      }

      if (!isLoadMore) {
        logsCache = logs;
      } else {
        logsCache = logsCache.concat(logs);
      }
      currentLogsOffset += logs.length;
      
      renderLogsHTML();
    }).buscarLogs(filtros);
}

function renderLogsHTML() {
  if (!logsCache.length) {
    msgTabela('lista-logs', 5, 'Nenhum registro encontrado.');
    const btnMais = $id('btn-load-more-logs');
    if (btnMais) btnMais.style.display = 'none';
    return;
  }

  $id('lista-logs').innerHTML = logsCache.map(l => `<div style="display: grid; grid-template-columns: 130px 180px 170px 190px 1fr; gap: 16px; align-items: center; background-color: #ffffff; padding: 12px 20px; border-radius: 8px; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px rgba(0,0,0,0.02); font-size: 13px; color: #111827; transition: transform 0.15s, box-shadow 0.15s;" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 6px -1px rgba(0,0,0,0.05)'" onmouseout="this.style.transform='none'; this.style.boxShadow='0 1px 2px rgba(0,0,0,0.02)'">
    <div style="white-space:nowrap; font-size:12px; color:#4b5563;">${esc(l.dataHora)}</div>
    <div style="font-size:12px;">${esc(l.usuario)}</div>
    <div><span style="display:inline-block; font-weight:600; color:#4b5563; border:1px solid #e5e7eb; border-radius:12px; padding:2px 8px; background:#f9fafb; font-size:11px;">${esc(l.acao)}</span></div>
    <div style="font-weight:600; color:#111827;">${esc(l.referencia)}</div>
    <div style="font-size:12.5px; color:#4b5563; line-height: 1.4;">${esc(l.detalhes)}</div>
  </div>`).join('');

  const btnMais = $id('btn-load-more-logs');
  if (btnMais) {
    if (currentLogsHasMore) {
      btnMais.style.display = 'block';
      btnMais.innerText = 'Carregar mais';
      btnMais.disabled = false;
    } else {
      btnMais.style.display = 'none';
    }
  }
}
</script>
