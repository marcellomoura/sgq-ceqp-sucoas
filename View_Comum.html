  <!-- Modal: PDF por e-mail -->
  <div id="modal-pdf-email" class="modal-overlay">
    <div class="modal-box sm">
      <div class="modal-close-bar"><button type="button" class="close-modal" data-close="modal-pdf-email"
          aria-label="Fechar">&times;</button></div>
      <h3 class="modal-title">Enviar Relatório por E-mail</h3>
      <p class="modal-subtitle">Informe o e-mail do destinatário para envio direto do PDF.</p>
      <label class="field-label" for="pdf-email-select">Selecionar Unidade (Opcional)</label>
      <div id="pdf-email-select" class="pdf-email-list">
        <div class="msg-loading">Carregando unidades...</div>
      </div>
      <button type="button" class="btn secondary w-100 mb-14 center" onclick="adicionarEmailsSelecionados()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        OK - Adicionar Selecionados
      </button>
      <label class="field-label" for="pdf-email-dest">E-mail do Destinatário</label>
      <input type="email" id="pdf-email-dest" class="field-input" placeholder="Ex: gestao@saude.df.gov.br">
      <div class="modal-footer">
        <button class="btn secondary" data-close="modal-pdf-email">Cancelar</button>
        <button class="btn primary" id="btn-enviar-pdf">Enviar PDF</button>
      </div>
    </div>
  </div>
