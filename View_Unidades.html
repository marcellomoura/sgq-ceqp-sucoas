      <section id="view-unidades" class="view-section">

        <header class="view-header mb-24">
          <div class="page-title mb-0">Unidades</div>
          
          <div class="flex-row items-center gap-16">
            <select id="f-unidades-status" onchange="renderUnidades()" class="filter-select">
              <option value="ativas">Ativas</option>
              <option value="inativas">Inativas</option>
              <option value="todas">Todas</option>
            </select>
            
            <button class="btn-create" id="btn-nova-unidade" type="button">
              <span class="btn-create-icon">+</span> Nova Unidade
            </button>
          </div>
        </header>

        <!-- Lista de Unidades (Grid Header + Conteúdo) -->
        <div class="list-scroll x">
          <div class="list-scroll-inner min-w-750">
            <div class="list-head unid-row gap-16">
              <div>Sigla</div>
              <div>Nome</div>
              <div>E-mail</div>
              <div class="text-center">Link do Drive</div>
              <div class="no-print text-center">Ações</div>
            </div>
            <div id="lista-unidades" class="list-body">
              <div class="msg-empty">A carregar...</div>
            </div>
          </div>
        </div>
      </section>

  <!-- Modal: Editar Unidade -->
  <div id="modal-unidade" class="modal-overlay">
    <div class="modal-box md">
      <div class="modal-close-bar"><button type="button" class="close-modal" data-close="modal-unidade"
          aria-label="Fechar">&times;</button></div>
      <h3 class="modal-title" id="modal-unidade-title">Editar Unidade</h3>
      <input type="hidden" id="eu-id">
      <div class="form-row mt-10">
        <div class="flex-2"><label class="field-label" for="eu-nome">Nome da Unidade</label><input type="text"
            id="eu-nome" class="field-input"></div>
        <div class="flex-1"><label class="field-label" for="eu-sigla">Sigla</label><input type="text" id="eu-sigla"
            class="field-input"></div>
      </div>
      <label class="field-label" for="eu-email">E-mail</label><input type="email" id="eu-email" class="field-input">
      <label class="field-label" for="eu-link-drive">Link do Drive</label><input type="text" id="eu-link-drive" class="field-input" placeholder="Link da pasta do Drive">
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close="modal-unidade">Cancelar</button>
        <button class="btn primary" id="btn-confirmar-unidade">Salvar Unidade</button>
      </div>
    </div>
  </div>
